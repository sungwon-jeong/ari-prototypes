        subtabsOf(pond).push(normTab({name, source:'user'}));
        resortTab(pond, subtabByName(pond,name));
      }
      fileSelection(name);
    }});
}

/* ---------- sub-tab membership ----------
   Every sub-tab owns a list of image keys. Auto tabs are seeded by the
   classifier when a photo is saved; manual tabs start empty and the user
   fills them from the grid. Counts are derived, never stored, so they can't
   drift away from what's actually in there. */
/* ---------- sub-tab model ----------
   A sub-tab is a name the USER chose. The classifier only fills it.

     label      what you see and rename
     rule       what the classifier matches against. Same as label until you
                switch auto-filling off, at which point it is null and the tab
                stops changing on its own.
     source     'user' (you declared it) | 'suggested' (we proposed it)
     autoIds    filled by the classifier — wiped and rebuilt on every re-sort
     manualIds  put there by you — NEVER touched by a re-sort

   The auto/manual split is the whole point: renaming a tab re-targets it and
   re-files every photo, but anything you placed by hand survives that.

   NOTE(spec): production also needs `excludedIds` — photos you took OUT of an
   auto tab. Without it a classifier upgrade re-scores everything and silently
   undoes every manual removal your users ever made. Left out of the prototype
   because there is no model swap here to observe it.                        */

/* The demo account is on PRO — the seeded ponds carry 5-6 sub-tabs, which is
   past the free ceiling, and a walkthrough should show the finished feature.
   Flip this to false to walk the paywall instead; every limit path still runs. */
var IS_PRO = true;
const UNSORTED = 'Unsorted';      // reserved label — never user-created
const SUBTAB_PRESETS = {
  Interior : ['Stairs','Colour','Living room','Bedroom','Lamp','Material'],
  Fashion  : ['Silhouette','Material','Colour','Styling','Detail'],
  Graphic  : ['Type','Layout','Colour','Print','Logo'],
  Research : ['Reference','Counter-example','Method','Quote']
};
/* Presets are names. They used to carry a description each, for a classifier
   that is deferred to v2 and reads nothing. */
/* One account state in v1 — there is no paid tier. Both constants are 3 so that
   subtabLimit() gives the same answer whichever branch it takes.
   PRD: Ponds and visibility / Architecture input 9. */
const SUBTAB_MAX = 3;             // per pond
const SUBTAB_FREE = 3;            // same — kept so existing call sites still read
const MEMBERSHIP_MAX = 3;         // tabs one photo may land in. quality bound,
                                  // NOT a paid tier — a photo silently missing
                                  // from a tab reads as a broken classifier.

function autoIdsFor(rule){
  if(!rule) return [];
  const r = String(rule).toLowerCase();
  return Object.keys(IMAGE_CATEGORIES)
    .filter(k => (IMAGE_CATEGORIES[k]||[]).some(t => String(t).toLowerCase()===r));
}
/* seeds in SUBTABS are written in the old shape; upgrade them on first touch
   so the literals stay readable and load order stops mattering */
function normTab(s){
  if(s && s._n) return s;
  if(!s) return s;
  s.label = s.label || s.name;
  s.name  = s.label;                       // .name kept as an alias for call sites
  // A name alone does not say what a person means by it. A test on 30 real
  // photographs put precision at 88%, and every single error was one word —
  // "interior" meant homes to its author and was read as anywhere indoors.
  // The description is what the classifier is actually given.
  if(s.desc === undefined)   s.desc = '';
  if(s.rule === undefined)   s.rule = s.label;
  if(s.source === undefined) s.source = 'user';
  if(s.hidden === undefined) s.hidden = false;
  if(!s.autoIds)   s.autoIds   = autoIdsFor(s.rule);   // rule null ⇒ []
  if(!s.manualIds) s.manualIds = (s.members || []).slice();
  delete s.members; delete s.auto; delete s.count;
  s._n = true;
  return s;
}
function subtabsOf(pond){
  const list = (SUBTABS[pond] = SUBTABS[pond] || []);
  list.forEach(normTab);
  return list;
}
/* the visible ones — hidden tabs still hold their memberships */
function liveSubtabs(pond){ return subtabsOf(pond).filter(s=>!s.hidden); }
function subtabByName(pond, name){
  // case-insensitive: "Lamp" and "lamp" are one tab to a person, and letting
  // both exist splits one pile into two that look identical
  const k=String(name||'').trim().toLowerCase();
  return subtabsOf(pond).find(s=>String(s.label).trim().toLowerCase()===k);
}

function membersOf(pond, name){
  const s = subtabByName(pond, name); if(!s) return [];
  const out = s.autoIds.slice();
  s.manualIds.forEach(k=>{ if(!out.includes(k)) out.push(k); });
  return out;
}
function subtabCount(pond, name){
  if(name===UNSORTED) return unsortedOf(pond).length;
  const inPond = (pond==='All') ? null : ((POND_MEMBERS[pond])||[]);
  return membersOf(pond, name).filter(k=>!inPond || inPond.includes(k)).length;
}
function addToSubtab(pond, name, keys){
  const s = subtabByName(pond, name); if(!s) return 0;
  let added=0;
  keys.forEach(k=>{ if(!s.manualIds.includes(k)){ s.manualIds.push(k); added++; } });
  track('subtab_assigned', {pond, name, added});
  return added;
}

/* re-target a tab and re-file everything. manual placements are untouched. */
function resortTab(pond, s){
  normTab(s);
  /* Automatic filing is deferred to v2 — see user-stories/11--sub-tabs-core.md.
     A Sub-tab is named by the user and filled by hand, so autoIds stays empty
     and manualIds is the only thing that puts a photograph in a tab. The
     machinery below is left in place because it is what comes back in v2, and
     because deleting it would take the manual half with it. */
  s.autoIds = [];
  return s;
}
/* Unsorted is computed, never stored: whatever the pond holds that no live tab
   claims. In v1 that is most things, because filing is by hand — a photograph
   nobody has filed has to be visible somewhere, and silently dropping it is how
   people conclude the feature is broken. */
function unsortedOf(pond){
  const inPond = (pond==='All') ? null : ((POND_MEMBERS[pond])||[]);
  const all = MYGRID.map(c=>c.img).filter(k=>!inPond || inPond.includes(k));
  const claimed = new Set();
  liveSubtabs(pond).forEach(s=>{ if(s.label!==UNSORTED) membersOf(pond,s.label).forEach(k=>claimed.add(k)); });
  return all.filter(k=>!claimed.has(k));
}
function subtabLimit(){ return IS_PRO ? SUBTAB_MAX : SUBTAB_FREE; }
function atSubtabLimit(pond){
  if(liveSubtabs(pond).length < subtabLimit()) return false;
  toast(`Beta accounts have ${SUBTAB_MAX} sub-tabs per pond`);
  return true;
}

/* ---------- (a) auto classification on save ----------
   Stands in for the Vision call: reads the tags already on the photo and
   files it under any matching sub-tab, creating one when enough photos
   share a tag. */
/* Files a freshly saved photo into the tabs the user already declared.
   It never invents a tab: the taxonomy is the user's to choose, and a photo
   that fits nothing lands in Unsorted rather than spawning a chip nobody asked
   for. No minimum photo count either — one photo is enough to belong. */
function autoClassify(imgKey, pond){
  if(!POND_META[pond] || POND_META[pond].autoDetect === false) return [];
  const tags = (IMAGE_CATEGORIES[imgKey] || []).map(t=>String(t).toLowerCase());
  const applied = [];
  liveSubtabs(pond).forEach(s=>{
    if(applied.length >= MEMBERSHIP_MAX) return;
    if(!s.rule) return;                                  // auto-filling switched off
    if(!tags.includes(String(s.rule).toLowerCase())) return;
    if(!s.autoIds.includes(imgKey)) s.autoIds.push(imgKey);
    applied.push(s.label);
  });
  track(applied.length ? 'subtab_auto_applied' : 'subtab_unsorted',
        {img:imgKey, pond, tabs:applied});
  return applied;
}

/* ---------- reading switcher ----------
   Slot 0 is always whoever made the image. After that come reposters —
   people I follow first, then most recent. Six slots on screen; anything
   past that lives behind the +N overflow sheet. */
/* No slot limit: every face renders and the row wraps. A count of the people
   you cannot see is worse than a taller card. */
var _readings = [];                    // [{who, notes, pid}] for the open post
var _readingIdx = 0;
var _readingId = null;

/* the teaching line shows on the first reading bar you meet and then stops */
function buildReadings(id, img){
  const sec=document.getElementById(id);
  // Resolved from the image, never from the screen. The plop screens are reused,
  // so the dataset fallback this used to take was whatever the LAST photograph
  // left behind — on the Feed path that is a hard-coded 'hanuel', who is a
  // reposter of redlamp, so the base Layer and his own Layer deduped into one
  // and the bar read "2 readings" where the profile said 3.
  const orig = originIdentityOf(img);
  const base = [{who:{name:orig.name, handle:orig.handle, avL:orig.l||orig.avL||(orig.name||'?')[0], avG:orig.g||orig.avG||'g5'},
                 notes:(typeof MARKNOTES!=='undefined' && MARKNOTES[img]) || [], original:true}];
  let reposts = (typeof repostsFor==='function' ? repostsFor(img) : []).map(r=>({who:r, notes:r.notes}));
  // one avatar per person. If whoever took the photograph has also reposted it,
  // they appear once — two identical avatars side by side cannot be told apart.
  const seen = new Set([orig.handle]);
  reposts = reposts.filter(r=>{
    const h = r.who && r.who.handle;
    if(!h || seen.has(h)) return false;
    seen.add(h); return true;
  });
  // people I follow first, then whatever order they came in (newest first)
  reposts.sort((a,b)=>{
    const fa = (typeof FOLLOWING!=='undefined' && FOLLOWING.has(a.who.handle)) ? 0 : 1;
    const fb = (typeof FOLLOWING!=='undefined' && FOLLOWING.has(b.who.handle)) ? 0 : 1;
    return fa-fb;
  });
  return base.concat(reposts);
}

function syncReadingBar(id, img){
  const bar=document.getElementById(id+'-readbar'); if(!bar) return;
  _readings = buildReadings(id, img);
  // Following changes the ORDER of the avatars, never which one is selected —
  // a post that looks different every time you scroll past it is a post you
  // cannot find again.
  /* Yours opens first when you have one. On a photograph you reposted, the
     reading you came back for is your own — you already know what you thought
     of it, and having to find yourself in a row of faces to re-read your own
     sentence is the one case where the default is knowably wrong.
     This does not reopen the rule below it: which Layer is selected still
     depends only on who is looking, never on who they follow, so the screen is
     the same every time the same person opens it. */
  const mine = _readings.findIndex(r => r.who && r.who.handle === ME_HANDLE);
  _readingIdx = mine > 0 ? mine : 0;
  _readingId = id;
  /* Every card in the scroll has its own Layers, and the globals hold one
     card's worth. Filling the card below — which happens before you ever see
     it, so its top edge is a photograph rather than a gap — used to overwrite
     the one you were looking at. Each card keeps its own, and the globals
     follow whichever card is current. */
  if(bar.closest('.plopcard')){
    const card = bar.closest('.plopcard');
    card._readings = _readings; card._readingIdx = _readingIdx;
  }
  /* Nothing to switch between, so nothing to show. The box existed at one Layer
     only while the heart lived inside it — every Plop can be liked, so it had to
     be reachable wherever a reading was. The heart is in the action row now, and
     what is left is a bordered line round a single face and its owner's handle,
     both of which the byline directly above has already said.

     This is the common card, not an edge case: at fifty testers almost every
     photograph will have exactly one reading. */
  if(_readings.length < 2){ bar.style.display='none'; return; }
  bar.style.display='';
  const avs=document.getElementById(id+'-rb-avs');
  /* Every face, wrapping to a second line beyond what fits. No horizontal
     scroll, no +N, no clipping: a count of the people you cannot see is worse
     than a taller card, and card height varying in the rare case is fine. */
  avs.innerHTML = _readings.map((r,i)=>
      `<span class="rb-av ${i===0?'origin ':''}${i===_readingIdx?'on':''}" title="${esc(r.who.name)}" onclick="pickReading(${i}, '${id}')">${av(r.who.avL, r.who.avG)}</span>`).join('');
  renderLayerLine(id);
  /* No count, and no line teaching that the faces are tappable. The row says
     how many by being a row, and which one you are reading by the ring on it
     and by the marks on the photograph changing when you tap.

     If people do not discover it, that is a finding rather than a missing
     sentence: it would mean the selected state is too weak, or the faces too
     small, or the control in the wrong place. A sentence explaining a control
     is a patch over a control that is not working, and putting it back would
     hide the problem instead of fixing it. */
  const oldLab = bar.querySelector('.rb-label'); if(oldLab) oldLab.remove();
  // the marks on screen were painted from the original's notes further up;
  // if we are opening on somebody else's Layer they have to be replaced
  if(_readingIdx !== 0) paintReading(_readingIdx);
}


/* One way to draw a note onto a hero, whichever screen asked for it. A note
   carrying a `shape` is a drawn Mark: its path goes into the SVG layer and its
   pill anchors to the centre of what was drawn. Three call sites used to build
   marks by hand with {text, vis, editable} and no shape between them, so a
   Layer with a region in it lost the region the moment you swiped to it — the
   note stayed and the drawing did not. */
/* `by` carries whoever wrote the note, when that is not the person looking at
   it. Marks copied into a Repost used to arrive without it, so the editor
   treated Maralind's sentences as yours: no @maralind on them, and none of the
   handling that being somebody else's is supposed to switch on. */
function paintNoteOnHero(id, hero, n, fallbackPos, by){
  var el;
  var opt = {text:n.text, vis:n.visibility||'public', editable:false};
  if(by && by.handle && by.handle !== ME_HANDLE){
    opt.inherited = true; opt.authorName = by.name || ''; opt.authorHandle = by.handle;
  }
  if(n.shape && n.shape.length > 1){
    var c = pathCentre(n.shape);
    el = plopMarkEl(c.x, freeBandY(hero, c.y, null), opt);
    el.dataset.path = JSON.stringify(n.shape);
    el.dataset.kind = 'region';
    hero.appendChild(el);
    paintRegion(id, n.shape, n.visibility||'public', el);
  } else {
    var p = (n.pos && isFinite(n.pos.x)) ? n.pos : fallbackPos;
    el = plopMarkEl(p.x, freeBandY(hero, p.y, null), opt);
    hero.appendChild(el);
  }
  /* Rebuilt now that it is IN the hero. markIsRemovable asks the element which
     screen it is on, and plopMarkEl builds the markup before anybody appends
     it — so at build time closest() is null, every seeded mark was judged
     un-removable, and the cross never rendered on any of them. That is why the
     only way to drop one inherited mark was to clear them all. */
  rebuildMark(el, false);
  return el;
}
/* Make a card's Layers the current ones. Called when a card scrolls into view
   and before anything that reads the globals acts on a specific card. */
/* Whose reading is on screen, written beside the face it belongs to.

   The handle is here because the byline now always names the photographer, so
   this is the only thing left saying whose marks you are reading — it replaces
   what removing "N readings" took away rather than decorating what is left.

   It sits immediately after the selected avatar rather than at the end of the
   box. A name right-aligned in a container is attached to nothing; a name
   against a face can only mean that face. What it costs is that the row reflows
   as you tap between people — at the one to three faces almost every photograph
   will have, that is a few pixels.

   It is absent on the photographer's own Layer, where it would repeat the
   byline word for word.

   The heart used to live here and is now in the action row: it was a long way
   from the controls it belongs with, and a second line holding one word and one
   glyph made a 92px box out of a 26px avatar. */
function renderLayerLine(id){
  const bar = document.getElementById(id+'-readbar'); if(!bar) return;
  const avs = bar.querySelector('.rb-avs'); if(!avs) return;
  const card = document.getElementById(id);
  const rs = (card && card._readings) || _readings;
  const ix = (card && card._readings) ? card._readingIdx : _readingIdx;
  const r = rs && rs[ix]; if(!r) return;

  const old = bar.querySelector('.rb-handle'); if(old) old.remove();
  if(!r.original){                   // the photographer's own Layer names nobody
    const el = document.createElement('span');
    el.className = 'rb-handle';
    el.textContent = '@' + (r.who.handle || '');
    const sel = avs.children[ix];
    if(sel && sel.nextSibling) avs.insertBefore(el, sel.nextSibling);
    else avs.appendChild(el);
  }

  /* Measured, never counted. Six faces fit at 375px and five at 320px, so a
     count is right on one phone and wrong on the next — and the last thing in
     this file that assumed rather than measured was the mark pill choosing
     which side to flip to. */
  const scrolls = avs.scrollWidth > avs.clientWidth + 1;
  bar.classList.toggle('scrolls', scrolls);
  /* Tapping a face off the right-hand end selected somebody you could not then
     see, and inserting the handle beside them moved the row under your thumb as
     well. What is brought into view is the HANDLE, not the face — the face is
     next to it and comes with it, and scrolling to the face alone can leave the
     name that says who they are just off the edge. */
  if(scrolls){
    const want = bar.querySelector('.rb-handle') || avs.children[ix];
    if(want && want.scrollIntoView) want.scrollIntoView({block:'nearest', inline:'nearest'});
  }
  rbEdges(bar);
  if(!avs._edgeWired){ avs._edgeWired = 1; avs.addEventListener('scroll', () => rbEdges(bar), {passive:true}); }
}
/* Which side has more behind it. Read after any scroll, and after any render —
   selecting somebody moves the row, so the answer changes without a gesture. */
function rbEdges(bar){
  const avs = bar.querySelector('.rb-avs'); if(!avs) return;
  const max = avs.scrollWidth - avs.clientWidth;
  bar.classList.toggle('more-l', max > 1 && avs.scrollLeft > 1);
  bar.classList.toggle('more-r', max > 1 && avs.scrollLeft < max - 1);
}

/* ── Likes ────────────────────────────────────────────────────────────────
   The lightest response there is: you liked what somebody saw without wanting
   to keep their photograph.

   It acts on the PLOP — one person's Layer — never on the photograph, which is
   why it sits beside the handle whose reading it is. Tapping a face changes the
   name and the heart together, so an emptying heart reads as "a different
   person's reading" rather than as a bug. */
/* A like is on the PHOTOGRAPH, not on a reading of it.

   It used to be keyed by image and Layer, so liking somebody's reading and then
   tapping another face emptied the heart — you had liked the fourth mark rather
   than the picture, and the state vanished the moment you looked at anybody
   else's. That is a finer distinction than anyone wants from the lightest
   response in the product, and it made the control behave as though it had
   forgotten what you did.

   One photograph, one like, whoever's marks you happen to be reading.

   ⚠️ This makes CLAUDE.md's Glossary wrong where it says "You like a Plop — one
   person's reading — not the photograph", and 19--likes.md with it. Both are on
   the list. */
var LIKES = {};           // img → {mine:bool, others:int}
function likeKey(id){
  const card = document.getElementById(id);
  return card ? (card.dataset.img || null) : null;
}
function likeRec(id){
  const k = likeKey(id); if(!k) return null;
  return (LIKES[k] = LIKES[k] || {mine:false, others:0});
}
function likedPlop(id){ const r = likeRec(id); return !!(r && r.mine); }
function likeCountOf(id){ const r = likeRec(id); return r ? r.others + (r.mine?1:0) : 0; }
function toggleLike(id){
  const rec = likeRec(id); if(!rec) return;
  const card = document.getElementById(id); const img = card.dataset.img;
  rec.mine = !rec.mine;
  renderActionBar(id);
  /* It goes to whoever TOOK the photograph, because that is whose it is now —
     not to whoever wrote the reading that happened to be on screen.

     Liking your own creates nothing. Every notification in this product exists
     because ANOTHER person acted, and a push telling you what you just did
     would be the first exception and would read as a bug. */
  const own = imageIsMine(img);
  if(rec.mine && !own) notifyLike(originIdentityOf(img).handle);
  track(rec.mine ? 'like' : 'unlike', {img, own});
}
function notifyLike(handle){ /* their device, not ours */ }
function openLikers(id){
  const n = likeCountOf(id);
  track('like_list_opened', {n});
  toast(n ? `${n} ${n===1?'person likes':'people like'} this photograph` : 'No likes yet');
}

function useCard(id){
  const card = document.getElementById(id);
  if(!card || !card._readings) return;
  _readings = card._readings; _readingIdx = card._readingIdx; _readingId = id;
}
function pickReading(i, cardId){
  if(cardId) useCard(cardId);
  track('reading_picked', {idx:i});
  paintReading(i);
}
/* Painting a Layer and choosing one are not the same event. The screen now
   opens on your own reading when you have one, and nobody tapped a face to
   make that happen — counting it as a pick would make "people compare
   readings" (H6) true on every photograph you have ever reposted. */
function paintReading(i){
  const id=_readingId; const r=_readings[i]; if(!r) return;
  _readingIdx=i;
  const card=document.getElementById(id); if(card && card._readings) card._readingIdx=i;
  renderLayerLine(id);
  /* The heart is in the action row and acts on the SELECTED Layer, so changing
     which face is ringed changes what it refers to — and whether a count sits
     beside it, since that only shows on your own reading. */
  renderActionBar(id);
  document.querySelectorAll('#'+id+'-rb-avs .rb-av').forEach((el,k)=>el.classList.toggle('on', k===i));
  const hero=document.getElementById(id+'-hero'); if(!hero) return;
  hero.querySelectorAll('.plop-mark').forEach(el=>el.remove());
  clearRegions(id);                       // the last Layer's drawings are not this one's
  const img=document.getElementById(id).dataset.img;
  const pos=markPositionsFor(img, r.notes.length);
  r.notes.forEach((n,k)=>paintNoteOnHero(id, hero, n, pos[k % pos.length]));
  hero.classList.add('marks-on', 'numbered');
  renumberMarks(id);          // a different Layer is a different set of numbers
  track('reading_switched', {img, idx:i, original:!!r.original});
}


/* ---------- Repost history ---------- */
function repostsFor(img){ return (typeof REPOST_HISTORY!=='undefined' && REPOST_HISTORY[img]) || []; }
/* How many Layers a photograph carries: whoever took it, plus one per person who
   has reposted it. One avatar per person — a reposter who is also the origin is
   not counted twice. */
function readingCount(img){
  // Whoever took it always has a Layer — that is what makes the photograph exist.
  // Counting only the reposters made the Feed badge read one lower than the
  // reading bar on the same photograph: redlamp said 2 from the Feed and 3 from
  // your own profile.
  const seen = new Set([ originIdentityOf(img).handle ]);
  try { (repostsFor(img)||[]).forEach(r=>{ if(r && r.handle) seen.add(r.handle); }); } catch(e){}
  return Math.max(1, seen.size);
}
/* Publishing my own reading of someone else's photograph. Three things happen and
   none of them is a new card:
     · my Layer joins the photograph, so the avatar row and the count both rise
     · the photograph returns to the top of the Feed — the Feed is ordered by most
       recent activity, and a Repost is activity
     · in a PRIVATE pond, none of it happens. Nothing done into a private pond
       reaches anybody, or the pond is not private. PRD: §8, two exceptions.
   Reposting twice replaces my earlier reading rather than stacking a second one —
   one Layer per person is what the avatar row means. */
function publishRepost(img, notes, pond){
  if(!img) return;
  if(typeof pondIsPrivate==='function' && pondIsPrivate(pond)){
    track('repost_published', {img, notes:(notes||[]).length, private:true});
    return;
  }
  const list = (REPOST_HISTORY[img] = REPOST_HISTORY[img] || []);
  const mine = list.findIndex(r => r.handle === ME_HANDLE);
  const entry = {name:'Sungwon', handle:ME_HANDLE, avL:'S', avG:'g9', when:'just now',
                 notes:(notes||[]).filter(n=>n.visibility!=='private')};
  if(mine >= 0) list.splice(mine, 1, entry); else list.unshift(entry);
  // back to the top: the Feed is one card per photograph, ordered by activity
  const fi = FEED.findIndex(f => f.img === img);
  if(fi > 0) FEED.unshift(FEED.splice(fi, 1)[0]);
  if(typeof renderFeed==='function') renderFeed(); else syncFeedBadges();
  track('repost_published', {img, notes:entry.notes.length, resurfaced:fi>0});
}
/* The Feed renders before REPOST_HISTORY exists, so badges are placed empty and
   filled here once the data is up. Called again after anything that adds a Layer. */
function syncFeedBadges(){
  document.querySelectorAll('.rc-badge[data-img]').forEach(el=>{
    const n = readingCount(el.dataset.img);
    if(n >= 2){ el.textContent = n; el.style.display = ''; }   // silent at one
    else { el.textContent = ''; el.style.display = 'none'; }
  });
}
/* The "N people marked this differently" card is gone. It restated what the
   reading switcher shows directly above it, and two controls describing one
   fact make the reader stop and work out the difference. Overflow now lives on
   the switcher's own chevron. */
/* openRepostHistory is gone with the +N button that opened it. Every face now
   renders and the row wraps, so a sheet listing the ones you could not see is
   answering a question nobody is left with. */
const REPOST = {srcId:null, img:null, pending:false};
var _batchSuppressCoach = false;


/* The coach mark teaches one thing — that the photo is tappable — and it only
   earns the right to say it once. It is counted the moment it is DISPLAYED, not
   when it is dismissed: a user who opens the editor and hits Skip has still been
   shown the lesson, and must not be taught again. In the real app _coachSeen is
   persisted per user; a session variable here would re-teach on every cold start. */
const COACH_MAX = 1;
var _coachSeen = 0;                    // TODO(app): persist per user, not per session
/* The coach mark and the hint said the same thing in different words, at the
   same time. Only one of them should be talking. */
function syncHintVisibility(){
  var h = document.getElementById('mk-hint');
  var c = document.getElementById('rev-coach');
  if(h) h.style.visibility = (c && c.classList.contains('on')) ? 'hidden' : 'visible';
}
function showCoach(allow){
  const el=document.getElementById('rev-coach'); if(!el) return;
  const show = allow===true && _coachSeen < COACH_MAX && markCountOf('scr-review')===0;
  el.classList.toggle('on', show);
  if(show) _coachSeen++;
  syncHintVisibility();
}
function hideCoach(){
  const el=document.getElementById('rev-coach');
  if(el) el.classList.remove('on');
  syncHintVisibility();
}


/* live character counter — only shows once you're near the limit */
function markCount(inp){
  const el = inp.closest('.plop-mark'); if(!el) return;
  const box = el.querySelector('.pm-count'); if(!box) return;
  const n = inp.value.length;
  const near = n >= NOTE_MAXLEN - 20;      // ~50자부터 보여줘야 갑자기 막히지 않음
  box.textContent = near ? n + '/' + NOTE_MAXLEN : '';
  box.classList.toggle('on', near);
  box.classList.toggle('full', n >= NOTE_MAXLEN);
}


/* ---------- marks never overlap ----------
   A pill can run to two lines, so each mark reserves a horizontal band tall
   enough to hold one. New marks snap to the nearest FREE band instead of
   landing exactly where the finger did — a small compromise that guarantees
   every note stays readable. */
const BAND_H = 17;                 // % of image height reserved per mark
const BAND_TOP = 6, BAND_BOTTOM = 94;
function bandIndexOf(y){
  return Math.round((y - BAND_TOP) / BAND_H);
}
function bandCentre(i){
  return Math.min(BAND_BOTTOM, Math.max(BAND_TOP, BAND_TOP + i * BAND_H));
}
function occupiedBands(hero, except){
  const used = new Set();
  hero.querySelectorAll('.plop-mark').forEach(el=>{
    if(el===except) return;
    const y = parseFloat(el.dataset.y);
    if(isFinite(y)) used.add(bandIndexOf(y));
  });
  return used;
}
/* nearest free band to the tapped point, searching down then up */
function freeBandY(hero, y, except){
  const maxBand = Math.floor((BAND_BOTTOM - BAND_TOP) / BAND_H);
  const used = occupiedBands(hero, except);
  const want = Math.min(maxBand, Math.max(0, bandIndexOf(y)));
  if(!used.has(want)) return bandCentre(want);
  for(let d=1; d<=maxBand; d++){
    if(want+d <= maxBand && !used.has(want+d)) return bandCentre(want+d);
    if(want-d >= 0        && !used.has(want-d)) return bandCentre(want-d);
  }
  return bandCentre(want);
}

/* ---------- marks: cap + counter ---------- */
/* Three, not five. Five was a catalogue; a photograph deserves a few
   observations. This is a statement about what the product is rather than a
   measurement threshold — the event below is how we find out who to ask. */
/* 300, and deliberately not tighter. A name typed into a caption is meant to
   become a link once there is data to resolve it, and a tight limit makes
   people drop the names first. */
const CAPTION_MAX = 300;
const MARK_CAP = 3;
/* How many photographs the library will take in one go. It used to be written
   `MARK_CAP + 5` with a hard-coded "Up to 10 photos" message beside it — two
   limits that have nothing to do with each other, wired together, so changing the
   mark cap would have moved the photo cap and left the toast lying about it. */
const BATCH_MAX = 10;
function markCountOf(id){
  // an empty pill is not a mark yet — it disappears the moment it's committed,
  // so it must not inflate the count or claim a band
  const hero=document.getElementById(id+'-hero');
  if(!hero) return 0;
  let n=0;
  hero.querySelectorAll('.plop-mark').forEach(el=>{
    const inp=el.querySelector('.pm-input');
    const txt=(inp ? inp.value : (el.dataset.text||'')).trim();
    if(txt) n++;
  });
  return n;
}
function hasEmptyMark(id){
  const hero=document.getElementById(id+'-hero'); if(!hero) return false;
  return [...hero.querySelectorAll('.plop-mark')].some(el=>{
    const inp=el.querySelector('.pm-input');
    return !((inp ? inp.value : (el.dataset.text||'')).trim());
  });
}
/* Fired when somebody reaches for a fourth. Not to second-guess the number — to
   know who to ask on a feedback call. "You hit the limit four times last week,
   tell me about that" is a better question than "was three enough?" */
function markLimitHit(id){
  toast('Up to ' + MARK_CAP + ' marks per photograph');
  track('mark_limit_hit', {screen:id, limit:MARK_CAP});
  try{ refreshMarkCount(); }catch(e){}
}
function markCapReached(id){ return markCountOf(id) >= MARK_CAP; }
function refreshMarkCount(){
  const n=markCountOf('scr-review');
  if(n) hideCoach();                    // the lesson is over the moment it lands
  syncSaveButton();
  /* No running commentary on the count. "One more mark left" and "3 marks —
     that's the limit" narrated a number nobody had asked about, on a screen
     whose whole subject is the photograph. The limit announces itself once, at
     the moment it stops you, and says nothing until then. */
  const btn=document.getElementById('rev-next-btn');
  if(btn) btn.textContent = n ? 'Next →'
    : (batchLabel==='Reflection' ? 'Nothing today' : 'Skip');
  if(btn) btn.classList.toggle('has-marks', n>0);
}

/* ---------- event log (wired to PostHog later) ---------- */
const TRACK=[]; window.TRACK=TRACK;
function track(name, props){
  TRACK.push({name, props:props||{}, t:Date.now()});
  if(window.posthog && window.posthog.capture) window.posthog.capture(name, props||{});
}

function plopEditing(id){
  if(id==='scr-review') return true;          // the capture editor is always annotatable
  const nb=document.getElementById(id+'-notebtn');
  return !!(nb && nb.classList.contains('open'));
}
/* ---------- swipe the photo to page through readings ----------
   Marking owns the pointer whenever the editor is armed, so this only ever runs
   on a resting post — where a drag previously did nothing at all. Horizontal
   intent is required (1.4x the vertical travel) so the page still scrolls. */
var _rswipe=null;
const SWIPE_MIN=44;
function readSwipeStart(id,evt){
  if(_readingId!==id || _readings.length<2) return;
  _rswipe={id, x:evt.clientX, y:evt.clientY, live:false};
}
function readSwipeMove(evt){
  if(!_rswipe) return;
  const dx=evt.clientX-_rswipe.x, dy=evt.clientY-_rswipe.y;
  if(!_rswipe.live && Math.abs(dx)>10 && Math.abs(dx)>Math.abs(dy)*1.4){
    _rswipe.live=true;
    const h=document.getElementById(_rswipe.id+'-hero'); if(h) h.classList.add('swiping');
  }
  if(_rswipe.live) _rswipe.dx=dx;
}
function readSwipeEnd(){
  const g=_rswipe; _rswipe=null; if(!g) return;
  const h=document.getElementById(g.id+'-hero'); if(h) h.classList.remove('swiping');
  if(!g.live || Math.abs(g.dx||0) < SWIPE_MIN) return;
  const dir = g.dx < 0 ? 1 : -1;                      // drag left = next reading
  const next = _readingIdx + dir;
  if(next < 0 || next >= _readings.length){
    toast(dir>0 ? 'That is the last reading' : 'Back at the original');
    return;
  }
  pickReading(next);
  track('reading_swiped', {dir});
}
function plopPointerDown(id,evt){
  if(!plopEditing(id)){ readSwipeStart(id,evt); return; }
  const hero=document.getElementById(id+'-hero');
  const img=hero.querySelector('img');
  const rect=img.getBoundingClientRect();
  if(evt.clientX<rect.left||evt.clientX>rect.right||evt.clientY<rect.top||evt.clientY>rect.bottom) return;
  const sx=((evt.clientX-rect.left)/rect.width)*100;
  const sy=((evt.clientY-rect.top)/rect.height)*100;
  plopDrag={id, hero, rect, sx, sy, moved:false};
  try{ hero.setPointerCapture(evt.pointerId); plopDrag.pointerId=evt.pointerId; }catch(e){}
  if(evt.preventDefault) evt.preventDefault();
}

function plopPointerMove(id,evt){
  if(_rswipe && _rswipe.id===id){ readSwipeMove(evt); return; }
  if(!plopDrag || plopDrag.id!==id) return;
  const g=plopDrag;
  const cx=Math.min(Math.max(((evt.clientX-g.rect.left)/g.rect.width)*100,0),100);
  const cy=Math.min(Math.max(((evt.clientY-g.rect.top)/g.rect.height)*100,0),100);
  /* A drag draws a REGION. Marking is the product and typing in front of an
     object is the narrowest part of the funnel, so a Mark can be a shape you
     draw round something as well as a point you tap -- see
     user-stories/03--marking.md. The gesture chooses: tap = point, drag =
     region, and there is no tool to switch between them.

     Dragging on a DETAIL screen is still the reading swipe, handled by
     readSwipeMove above. */
  /* LATCHED, not recomputed. A region is drawn as a loop that ends near where
     it started, so recomputing this from the current position turns the last
     frame of a closed shape back into a tap. */
  g.moved = g.moved || (Math.abs(cx-g.sx)+Math.abs(cy-g.sy)) > 2.5;
  if(MARK_TOOL === 'region' && g.moved){
    if(!g.path) g.path = [{x:g.sx, y:g.sy}];
    var last = g.path[g.path.length-1];
    if(Math.abs(cx-last.x)+Math.abs(cy-last.y) > 0.8) g.path.push({x:cx, y:cy});
    drawLasso(id, g.path, false);
  }
}
function plopPointerUp(id,evt){
  if(_rswipe && _rswipe.id===id){ readSwipeEnd(); return; }
  if(!plopDrag || plopDrag.id!==id) return;
  const g=plopDrag; plopDrag=null;
  try{ if(g.pointerId!=null) document.getElementById(id+'-hero').releasePointerCapture(g.pointerId); }catch(e){}
  if(!g.moved){
    // TAP: commit whatever is selected (empty ones are discarded), then pin a new note here
    deselectAllMarks(id);
    if(markCapReached(id)){ markLimitHit(id); return; }
  /* A tap while the draw tool is selected falls back to a point, which is right
     — a shape that small is not a shape. But it used to happen in silence, with
     the draw tool still lit, so it read as the tool being broken. */
  if(MARK_TOOL === 'region') toast('That was a tap, so it is a point. Drag to draw');
    hideCoach();
    if(hasEmptyMark(id)){ toast('Finish the open note first'); return; }
    g.hero.classList.add('marks-on');
    const el=plopMarkEl(g.sx, g.sy, {editable:false, vis:'public', text:''});
    g.hero.appendChild(el);
    renumberMarks(id);
    track('mark_added', {screen:id, kind:'point'});
    refreshMarkCount();
    openMarkNote(el, true);
    // no auto-focus: placing a pin shows only the toolbar; tap the field to zoom & type
    return;
  }
  // DRAG: a region. The gesture chose; there is no tool to switch.
  clearLasso(id);
  const pts = g.path || [];
  // too small to be a shape — treat it as the tap it probably was
  if(pts.length < 4){
    if(markCapReached(id)) { markLimitHit(id); return; }
    const el0 = plopMarkEl(g.sx, g.sy, {editable:false, vis:'public', text:''});
    g.hero.appendChild(el0); renumberMarks(id); refreshMarkCount(); openMarkNote(el0, true);
    return;
  }
  deselectAllMarks(id);
  if(markCapReached(id)){ markLimitHit(id); return; }
  if(hasEmptyMark(id)){ toast('Finish the open note first'); return; }
  hideCoach();
  g.hero.classList.add('marks-on');
  const c = pathCentre(pts);
  const el = plopMarkEl(c.x, c.y, {editable:false, vis:'public', text:''});
  el.dataset.path = JSON.stringify(pts.map(p=>({x:+p.x.toFixed(2), y:+p.y.toFixed(2)})));
  el.dataset.kind = 'region';
  g.hero.appendChild(el);
  paintRegion(id, pts, 'public');
  renumberMarks(id);
  track('mark_added', {screen:id, kind:'region'});
  refreshMarkCount();
  openMarkNote(el, true);
}

let plopPond={};
let plopPondTarget=null;
function openPlopPond(id){
  plopPondTarget=id;
  openSheet('plop-pond-sheet');
}
/* Saving used to be recorded against the SCREEN id. The two detail screens are
   reused for every post, so saving photo X then opening photo Y showed Y as
   saved, and coming back to X lost it. A save belongs to (you, image) — that is
   the shape the real app needs too, so the prototype uses it. */
/* Images in your collection: the ones you have saved, plus your own work, which
   is in your Pond by virtue of having been posted. Seeded once — it used to
   grow as you browsed, because populatePlop added to it while drawing. */
const SAVED = new Set([...SAVED_IMGS, ...MYGRID.map(c => c.img).filter(imageIsMine)]);
function imgOf(id){ const s=document.getElementById(id); return s&&s.dataset?s.dataset.img:null; }
const plopSaved = new Proxy({}, {           // legacy call sites keep working
  get(_,id){ const k=imgOf(id); return k ? SAVED.has(k) : false; },
  set(_,id,v){ const k=imgOf(id); if(k){ v?SAVED.add(k):SAVED.delete(k); } return true; }
});
function repostBtn(id){ return document.querySelector('#'+id+' .actbtn.repost'); }
function syncSaveButtons(id){
  const k = imgOf(id);
  const saved = !!(k && SAVED.has(k));
  const sb=document.getElementById(id+'-savebtn');
  if(sb) sb.classList.toggle('on', saved);          // bookmark fills when kept
  const rb=repostBtn(id);
  if(rb) rb.classList.toggle('reposted', saved);
}
   // back-compat
/* REPOST — keep the plop exactly as-is; the author's notes travel with it, read-only. */
/* "Done": commit the selected pill and close the editor. (Notes autosave as you go.) */
function plopSaveNote(id){
  deselectAllMarks(id);          // commit any active pill (autosave)
  collectPlopNotes(id);
  const sec=document.getElementById(id);
  const img=sec&&sec.dataset?sec.dataset.img:null;
  const has = !!(img && MARKNOTES[img] && MARKNOTES[img].length);
  const pond=plopPond[id]||'Inspiration';
  if(has) keepImage(img, pond, 'post');  // marking something makes it mine, not a bookmark
  // Close the editor
  const btn=document.getElementById(id+'-notebtn'), wrap=document.getElementById(id+'-notewrap');
  if(btn) btn.classList.remove('open'); if(wrap) wrap.classList.remove('open');
  plopClearTool(id);
  if(has) keepImage(img, pond); else unkeepImage(img);
  renderPlopMarks(id, false);
  syncSaveButtons(id);
  if(typeof renderMyGrid==='function') renderMyGrid();
  toast(has ? `Saved to ${pond}` : 'Removed · not saved');
}
function otherView(v){
  const vg=document.getElementById('ovg'), vl=document.getElementById('ovl');
  const grid=document.getElementById('ogrid'), list=document.getElementById('olist');
  if(vg) vg.classList.toggle('on', v==='grid');
  if(vl) vl.classList.toggle('on', v==='list');
  if(grid) grid.style.display = v==='grid' ? 'grid' : 'none';
  if(list) list.style.display = v==='list' ? 'block' : 'none';
  // sub-tabs belong to the pond, not the view — keep them in both
  if(typeof renderOtherSubtabs==='function') renderOtherSubtabs();
  if(v==='grid' && typeof renderOtherGrid==='function') renderOtherGrid();
  if(v==='list' && typeof renderOtherNotes==='function') renderOtherNotes();
}

const HANDLE_META={hanuel:['H','g5']};
KEPTBY.forEach(k=>HANDLE_META[k[0]]=[k[2],k[1]]);

/* editor */
var _revImg = null;
var lastPosted = null;
/* Real camera, not a mock. `capture="environment"` on a file input opens the
   native camera on a phone, so the prototype can run the actual moment H1 is
   about — see something, shoot it, mark it — instead of asking people to
   imagine it. The earlier build had a fake camera screen, which taught testers
   nothing and mislead them about what the app does.

   The two paths are recorded separately because the difference is the finding:
   shooting then marking is a thing you do in front of the object; importing
   then marking is a thing you do later, looking back. If nobody uses the
   camera, marking is a reflective act and Q4 should be built around that. */
var _captureSource = 'library';
var _shotSeq = 0;
/* On a phone this opens the camera. This file is opened in a desktop browser at
   least as often — the README says to — and there the input does nothing at all,
   so the sheet closed and the first row in Add became a dead end. Say so and
   offer the way that works, rather than failing silently. */
function hasCamera(){
  return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent)
      && !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
}
function takePhoto(){
  closeSheet('add-sheet');
  const inp=document.getElementById('shot-input');
  if(!inp || !hasCamera()){
    toastAction('The camera needs a phone', 'Photo library',
      ()=>{ resetLibrary(); go('scr-library'); });
    track('camera_unavailable', {});
    return;
  }
  inp.value='';           // same photo twice must still fire change
  inp.click();
}
function shotPicked(inp){
  const f=inp.files && inp.files[0];
  if(!f) return;
  const r=new FileReader();
  r.onload=function(){
    const key='shot'+(++_shotSeq);
    IMG[key]=r.result;                 // thumb() falls back to IMG, so grids work too
    IMAGE_CATEGORIES[key]=[];          // no tags yet — it will land in Unsorted
    _captureSource='camera';
    track('photo_taken', {});
    openEditor(key,'','');
  };
  r.onerror=function(){ toast("That photo didn't load"); };
  r.readAsDataURL(f);
}
function openEditor(img,title,sub,fromDraft){
  // consume the one-shot flags set by whoever called us
  const isRepost = REPOST.pending===true; REPOST.pending=false;
  const isBatchTail = _batchSuppressCoach; _batchSuppressCoach=false;
  // a fresh capture inherits nothing — leaving srcId set makes every later
  // "is this a repost?" test answer yes forever
  if(!isRepost){ REPOST.srcId=null; REPOST.img=null; }
  _revImg = img;
  // Every other screen carries its image on the section; the editor only kept it
  // in _revImg, so collectPlopNotes read dataset.img, found nothing and returned
  // empty. Putting it where the rest of the code looks fixes it everywhere.
  const _rs = document.getElementById('scr-review'); if(_rs) _rs.dataset.img = img;
  document.querySelectorAll('.sheetwrap').forEach(s=>s.classList.remove('open'));
  document.getElementById('rev-img').src=IMG[img]||IMG.duvet;
  /* reviewStep names the step you are on — Mark, then Caption. It runs after
     this, so anything set here is a default for the paths that carry their own
     title (Repost, From a link, "Photo 2 of 5"). */
  document.getElementById('rev-head-t').textContent=fromDraft?'Draft 1 of 3':'Mark';

  // The prototype used to pre-fill a caption for six demo images. With the new
  // rule — a mark or a caption is what makes something a post — that pre-fill
  // silently published photos the tester never wrote anything about.

  const _cap = document.getElementById('f-desc');
  if(_cap){ _cap.value=''; capGrow(_cap); }
  // fresh canvas: drop any marks left over from the previous photo
  const hero = document.getElementById('scr-review-hero');
  if(hero){
    hero.querySelectorAll('.plop-mark').forEach(el=>el.remove());
    hero.classList.add('marks-on','armed');
  }
  clearRegions('scr-review');
  const _pr=document.getElementById('rev-prompt'); if(_pr) _pr.style.display='none';
  go('scr-review');
  const _h = document.getElementById('scr-review-hero'); if(_h) _h.classList.add('numbered');
  setTool('point');
  reviewStep(1);          // marks first
  refreshMarkCount();
  // first fresh single capture only — never on a repost (marks arrive seeded),
  // never on a draft you already marked up, never on photos 2..n of a batch
  showCoach(!isRepost && !fromDraft && !isBatchTail);
}
function reviewStep(n){
  window._revStep=n;
  const s1=document.getElementById('rev-step1'), s2=document.getElementById('rev-step2');
  if(s1) s1.style.display = n===1?'block':'none';
  if(s2) s2.style.display = n===2?'block':'none';
  const d1=document.getElementById('rev-d1'), d2=document.getElementById('rev-d2');
  if(d1) d1.classList.toggle('on', n>=1);
  if(d2) d2.classList.toggle('on', n>=2);
  const sp=document.getElementById('rev-scroll'); if(sp) sp.scrollTop=0;
  /* The header said "Draft" before anything had been drafted. Name the step
     instead — it matches the two-segment progress bar directly above it. */
  const ht=document.getElementById('rev-head-t');
  if(ht && !/Repost|link|of /.test(ht.textContent)) ht.textContent = n===2 ? 'Caption' : 'Mark';
  if(n===2) capGrow(document.getElementById('f-desc'));   // measurable only now it is shown
  syncSaveButton();
  const hero=document.getElementById('scr-review-hero');
  if(hero) hero.classList.toggle('armed', n===1);
  if(n===1) refreshMarkCount();
}
function reviewNext(){
  deselectAllMarks('scr-review');
  const n = markCountOf('scr-review');
  track(n ? 'mark_step_completed' : 'mark_screen_skipped', {marks:n});
  reviewStep(2);
}
function discardDraft(){
  const hero=document.getElementById('scr-review-hero');
  if(hero) hero.querySelectorAll('.plop-mark').forEach(el=>el.remove());
  track('draft_discarded', {});
  go('scr-feed'); toast('Draft discarded');
}
function reviewBack(){
  if(window._revStep===2){ reviewStep(1); return; }
  deselectAllMarks('scr-review');
  if(returnFromEdit()) return;   // you came here from a card; go back to it
  goBack('scr-feed');
}
// Legacy alias for any old callers
/* A caption grows with what you write rather than scrolling inside a fixed box.
   Reset to auto first or the field can only ever get taller. */
function capGrow(el){
  if(!el) return;
  el.style.height = 'auto';
  /* A hidden element has no scrollHeight, and openEditor runs while the caption
     step is still display:none — measuring there pinned the field at 0px and it
     stayed there once the step was shown. Leave it on auto until it is on
     screen; reviewStep calls this again when it reveals step 2. */
  if(!el.offsetParent && el.scrollHeight === 0) return;

/* Legacy name from before the editor knew the difference between posting and
   parking. It wrote 'Save' unconditionally, and it runs AFTER syncSaveButton on
   both paths that matter — the openEditor wrapper below, and the document-level
   input listener, which bubbles after #f-desc's own oninput. So the button read

function updateSaveLabel(){ syncSaveButton(); }
/* A photo with neither a mark nor a caption is not a post — it goes to Drafts.
   Publishing something empty used to be free, which made "share of uploads that
   carry a mark" (H1) unreadable: a low number could mean people do not care, or
   just that saying nothing was the path of least resistance. Now marking is the
   price of publishing, so a low number is a real signal. It also gives Drafts a
   reason to exist — before this it only filled from the batch sheet. */
function isEmptyPost(){
  return markCountOf('scr-review')===0 && !((document.getElementById('f-desc')||{}).value||'').trim();
}
function syncSaveButton(){
  const b=document.getElementById('bigsave-btn'); if(!b) return;
  const empty=isEmptyPost();
  b.textContent = empty ? 'Save as draft' : 'Post';
  b.classList.toggle('is-draft', empty);

  if(n) n.style.display = empty ? 'block' : 'none';
}
function saveDraft(){
  deselectAllMarks('scr-review');       // commit any pill still being typed
  // Publishing a Repost is not publishing over the photograph. A Repost is a Plop
  // of the reposter's own, sitting on someone else's Image as another Layer — so
  // its notes must NOT be written to MARKNOTES, which is the original owner's
  // Layer. collectPlopNotes has always taken persist=false for exactly this and
  // nothing ever passed it, so reposting silently overwrote the marks of whoever
  // took the photograph. PRD: Repost — "everything in a Repost is yours except
  // who took the photograph".
  const isRepost = !!(REPOST.srcId && REPOST.img && REPOST.img === _revImg);
  const repostNotes = isRepost ? collectPlopNotes('scr-review', false) : null;
  // Nothing on this path ever wrote the marks to MARKNOTES — persistMarks skips
  // scr-review by design and no save step picked them up, so every mark made in
  // the capture editor was discarded the moment you pressed save. H1 measures
  // marks on new uploads; the whole output of that flow was being thrown away.
  if(!isRepost) collectPlopNotes('scr-review');
  const marks = markCountOf('scr-review');
  const capEl = document.getElementById('f-desc');
  const caption = capEl ? capEl.value.trim() : '';
  const asDraft = !marks && !caption;
  track(asDraft ? 'draft_saved' : 'post_created',
        {marks, caption: !!caption, source: _captureSource});
  const pond = document.getElementById('pond-name').textContent;
  const isReflection = batchLabel === 'Reflection';
  if(asDraft){
    // A draft is parked, not kept: it must not join a pond, the grid or a sub-tab
    // until it has a mark or a caption. That decision has to happen before
    // keepImage, or an empty photo shows up in My Pond anyway.
    /* syncDraftsCount() runs after the unshift below */
    DRAFTS.unshift({img:_revImg, title:'Untitled',
      meta:({camera:'Camera', link:'From a link'}[_captureSource] || 'Photo library')+' · just now'});
    if(typeof renderDrafts==='function') renderDrafts();
    syncDraftsCount();
    syncReflectionBanner();
    /* Out of the way, not into a list of unfinished things. A Draft has no proof
       to show — it is in nobody's Feed by definition — so the toast carries the
       only affordance that matters. batchAllDrafts has landed drafts on the Feed
       with a "find them in ＋ → Drafts" line since before this screen existed;
       saving one draft and saving five should not end up in different places. */
    go('scr-feed');
    setTimeout(()=>toastAction('Saved as draft · nothing is public yet', 'Drafts',
      ()=>go('scr-drafts')), 260);
    return;
  }
  lastPosted = {img: _revImg, pond};
  /* The caption you wrote had nowhere to go. The detail screen reads its text
     from the FEED entry, and posting never wrote to it — so you typed a caption,
     published, opened the Plop, and read the seed sub-line instead. A caption is
     one of the two things that make a photograph a Plop; losing it silently is
     the worst kind of quiet. */
  if(_revImg){
    const entry = (typeof FEED_BY_ID!=='undefined' && FEED_BY_ID[_revImg]) || null;
    if(entry){ entry.desc = caption; if(caption) entry.s = caption; }
  }
  // A published Repost has to become a Layer, or it produces no signal at all —
  // it makes no Feed card of its own, so the count, the avatar row and the
  // photograph's position in the Feed are the ONLY things it moves. Nothing
  // wrote to REPOST_HISTORY and syncFeedBadges ran once at load, so pressing
  // Post on a Repost changed nothing anywhere. PRD: Actions → Repost.
  if(isRepost) publishRepost(_revImg, repostNotes, pond);
  // keepImage joins the pond, the grid and the sub-tabs, and calls autoClassify.
  // 'post' because this is my own photograph being published, not a bookmark.
  if(_revImg) keepImage(_revImg, pond, 'post');
  // Publishing a draft takes it out of Drafts, however it was opened.
  if(_revImg){
    const di = DRAFTS.findIndex(d => d.img === _revImg);
    if(di >= 0){
      DRAFTS.splice(di, 1);
      track('draft_published', {via: isReflection ? 'reflection' : 'drafts'});
      if(typeof renderDrafts==='function') renderDrafts();
      syncDraftsCount();
    }
  }
  syncReflectionBanner();
  // Batch: advance to the next photo instead of the success screen
  if(batchQueue.length > 1 && batchIndex < batchQueue.length - 1){
    const label = isReflection ? 'Reflection' : 'Photo';
    toast(`${label} ${batchIndex+1} of ${batchQueue.length} saved`);
    batchIndex++;
    setTimeout(openBatchItem, 200);
    return;
  }
  const wasBatch = batchQueue.length > 1;
  const n = wasBatch ? batchQueue.length : 1;
  batchQueue = [];
  batchIndex = 0;
  batchLabel = 'Draft';

  /* Straight to the Feed. The confirmation screen asked you to choose between
     two things you do not care about yet — "View post" and "Back to feed" —
     and parked you at a dead end either way. Seeing the photograph sitting at
     the top of the Feed is stronger proof than a tick, and it puts you back
     into the loop instead of at the end of one.

     A private Pond is the exception: nothing you put there reaches a Feed, so
     sending you to one to look for it would be a lie. PRD: §8. */
  const isPrivate = (typeof pondIsPrivate==='function') && pondIsPrivate(pond);
  if(!isPrivate && _revImg) resurfaceInFeed(_revImg);

  // "Posted", not "Saved" — Save means keeping someone else's photograph.
  // Calling your own publish a save is the exact confusion the Glossary exists
  // to prevent. PRD: Glossary → Save vs Repost.
  const what = isReflection ? 'Reflection saved'
             : wasBatch     ? `Posted · ${n} photos`
             : marks        ? `Posted · ${marks} mark${marks>1?'s':''}`
                            : 'Posted';
  const where = isPrivate ? ` · ${pond}, private` : '';

  /* Editing a mark you already published is not posting: it started on a card
     and it ends back on that card, at its top, where the changed marks are. */
  const cameFromCard = returnFromEdit();
  if(!cameFromCard) go('scr-feed');
  const img = _revImg;
  setTimeout(()=>{
    if(cameFromCard) toast(marks ? 'Marks updated' : 'Updated');
    else if(isPrivate) toastAction(what + where, 'See it', ()=>{ PROFILE_STATE.pond=pond; go('scr-my-profile'); });
    else          toastAction(what, 'View', ()=>viewLastPost());
  }, 260);
}
/* Bring a photograph to the top of the Feed. The Feed is ordered by most recent
   activity and publishing is activity. No flourish on the card: the toast
   confirms the action, and a highlight that fades after 1.8s is only legible to
   somebody already watching that spot. */
function resurfaceInFeed(img){
  const i = FEED.findIndex(f => f.img === img);
  if(i > 0) FEED.unshift(FEED.splice(i, 1)[0]);
  else if(i < 0){
    const base = (typeof FEED_BY_ID!=='undefined' && FEED_BY_ID[img]) || {img, t:'', s:''};
    const entry = Object.assign({}, base, {id:img, img, mine:1});
    FEED.unshift(entry);
    FEED_BY_ID[img] = entry;      // or the detail screen reads a stale copy
  }
  if(typeof renderFeed==='function') renderFeed();
}

/* ---- Paste a link -------------------------------------------------------
   What comes back from a link is an image plus whatever the page said about it,
   and from that point on it is an ordinary photograph in the editor: point and
   region marks, the note sheet, the mark list, all of it unchanged. A Mark is
   coordinates on an image and has no opinion about provenance.

   The demo table is keyed by host so that WHAT YOU PASTE IS WHAT YOU GET. 2607's
   version returned the same duvet whatever you typed, which is the same defect
   the library had — a tester notices in five seconds and stops trusting the
   screen. An unrecognised host still resolves, to a clearly generic result.

   NOTE FOR THE SPEC, not a prototype problem: CLAUDE.md gives a Plop
   `origin: capture | repost` and `source: camera | library`. A pasted link is
   neither — it is someone else's photograph arriving with no Plop to Repost
   from. `_captureSource` is set to 'link' here so the question is at least

const URL_SOURCES = {
  'studio-yumi.kr':   {img:'duvet',       t:'"Wearing a duvet"',   who:'@studio.yumi'},
  'peterkennard.com': {img:'posterwall_l',t:'Political posters',   who:'Peter Kennard'},
  'tate.org.uk':      {img:'turbinehall', t:'Turbine hall skulls', who:'Tate Modern'},
  'palazzograssi.it': {img:'ceiling_l',   t:'Ceiling, Palazzo Grassi', who:'Venice'}
};
const URL_DEMO = 'https://studio-yumi.kr/works/duvet';

function urlShowState(kind, msg){

  el.style.display='flex';

}
function urlHostOf(v){
  const m = String(v||'').match(/^(?:https?:\/\/)?(?:www\.)?([^\/\s?#]+)/i);

/* typing invalidates whatever was fetched — the preview must never describe a

function urlTyped(){

function urlPasteDemo(){

function urlFetch(){
  const v=(document.getElementById('url-in').value||'').trim();

  if(!/\./.test(host)){ urlShowState('err', "That doesn't look like a link"); return; }
  urlShowState('load', 'Reading the page…');
  document.getElementById('url-go').classList.remove('ready');
  track('url_fetch_started', {host});
  setTimeout(function(){
    const hit = URL_SOURCES[host];
    const meta = hit
      ? {src:v, img:hit.img, t:hit.t, who:hit.who, host:host}
      : {src:v, img:'marbled', t:'', who:'', host:host};

/* ═══ real photos off the phone ═══════════════════════════
   An imported photo becomes an ordinary IMG key, so the library, the
   profile grid and the whole marking editor work on it without knowing
   it came from anywhere different.

   Nothing is asked on the way in — no pond, no caption, no filing. One
   question here and this becomes the six-step save people walked away
   from. */
function importPhotos(){ document.getElementById('filein').click(); }
async function handleFiles(e){
  const files=[...e.target.files]; if(!files.length) return;
  toast('Adding '+files.length+'\u2026');
  for(const f of files){
    try{
      const src=await downscale(f,1400);
      const k='u_'+Math.random().toString(36).slice(2,8);
      IMG[k]=src; LIB.unshift(k);
      /* Straight into the collection. September routes a photo through the
         editor before it reaches the profile, which is the six-step save
         people walked away from. Marking stays available; it stops being
         the toll gate. */
      if(typeof MYGRID!=='undefined' && !MYGRID.some(c=>c.img===k)) MYGRID.unshift({img:k});
    }catch(err){}
  }
  e.target.value='';
  renderLibGrid();
  if(typeof renderMyProfile==='function') renderMyProfile();
  else if(typeof renderMyGrid==='function') renderMyGrid();
  toast(files.length+(files.length===1?' photo added':' photos added'));
}
/* A phone photo is over 4000px. Four of those decoding at once in a pool
   stutters, so the long edge comes down to 1400 on the way in. */
function downscale(file,max){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{ const im=new Image();
      im.onload=()=>{ const r=Math.min(1,max/Math.max(im.width,im.height));
        const c=document.createElement('canvas');
        c.width=Math.round(im.width*r); c.height=Math.round(im.height*r);
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);
        res(c.toDataURL('image/jpeg',.82)); };
      im.onerror=rej; im.src=fr.result; };
    fr.onerror=rej; fr.readAsDataURL(file);
  });
}

/* These used to set a class and toast `Browsing "Interiors"` while the grid below

const PILL_TAGS = {
  Popular:      null,                    // everything, in the order it comes
  Interiors:    ['interior','lamp','light','ceiling','terracotta'],
  Typography:   ['typography','poster'],
  Chapels:      ['chapel','architecture','concrete'],
  Textiles:     ['textile','installation'],

  <button onclick="cancelChoose()" style="font-size:15px;color:var(--soft)">Cancel</button>
