/* ---------------- render dynamic lists ---------------- */
/* The Feed was painted once, inline, at load. It has to be a function: a Repost
   returns its photograph to the top, and the tile indices every handler closes
   over shift when it does. Re-render, then re-badge. */
function renderFeed(){
  const box = document.getElementById('masonry'); if(!box) return;
  box.innerHTML = FEED.map((f,i)=>`
 <div class="tile" id="tile-${i}" onpointerdown="tilePressStart(${i})" onpointerup="tilePressEnd(${i})" onpointerleave="tilePressCancel()" onpointercancel="tilePressCancel()">
   <div class="ph"><img src="${thumb(f.img)}" alt="${esc(f.t)}"><span class="rc-badge" data-img="${f.img}" style="display:none"></span>${(typeof IMAGE_SOURCE!=='undefined'&&IMAGE_SOURCE[f.img])?`<span class="src-badge" title="From ${esc(IMAGE_SOURCE[f.img].host)}">${I.link}</span>`:''}</div>
 </div>`).join('');
  if(typeof syncFeedBadges==='function') syncFeedBadges();
}
/* Spread the authors as far as the data allows, which is not far.

   ⚠️ The seed is 24 of 30 photographs belonging to @sungwon, and six others
   holding one each. So "no handle appears twice running" is not achievable by
   reordering — it needs 23 separators and there are 6. The best any order can
   do is 17 adjacent pairs, and this reaches it.

   The real finding is not the order. It is that the demo feed is one person's
   camera roll, which is the wrong thing to show for a product about reading
   what other people noticed. Fixing it means reassigning photographs, not
   sorting them — see prototype/README.md.

   Stable rather than random: a demo that deals a different hand every reload is
   one you cannot point at in a meeting. */
(function spreadFeedAuthors(){
  const who = f => (originIdentityOf(f.img) || {}).handle || '?';
  const out = [];
  const pool = FEED.slice();
  while(pool.length){
    const last = out.length ? who(out[out.length-1]) : null;
    let k = pool.findIndex(f => who(f) !== last);
    if(k < 0) k = 0;                 // only one handle left; nothing to spread
    out.push(pool.splice(k, 1)[0]);
  }
  FEED.length = 0; Array.prototype.push.apply(FEED, out);
})();
renderFeed();
let pressTimer=null, longPressed=false;
function tilePressStart(i){
  longPressed=false;
  clearTimeout(pressTimer);
  pressTimer=setTimeout(()=>{
    longPressed=true;
    if(navigator.vibrate)navigator.vibrate(8);
    openFeedPond(i);
  },480);
}
function tilePressEnd(i){
  clearTimeout(pressTimer);
  if(longPressed){longPressed=false;return;}
  openTile(i);
}
function tilePressCancel(){
  clearTimeout(pressTimer);
}
/* The 160ms delay is the tile's zoom animation. It used to fire unconditionally,
   so a navigation that happened in the meantime got yanked back to this post. */
var _tileNav = null;

/* The detail scroll.

   Cards are built for every FEED entry from the one you tapped onward, so the
   next photograph is genuinely the next one in the feed rather than a guess.
   Only the card you land on is filled straight away; the rest fill as they come
   near, because filling thirty cards at once means decoding thirty photographs
   before the first one is on screen. */
var _scrollFrom = 0;       // which FEED index the scroll starts at
var _scrollAt = 0;         // which one is on screen now, for the way back
var _filled = new Set();

function cardIdFor(i){ return 'card-' + i; }

function openPlopScroll(i){
  const feed = document.getElementById('plopfeed'); if(!feed) return;
  _scrollFrom = i; _scrollAt = i; _filled = new Set(); _soloCard = false;
  feed.innerHTML = FEED.slice(i).map((f, k) => plopCard(cardIdFor(i + k))).join('');
  fillCard(i);
  fillCard(i + 1);           // the sliver of the next one has to be a photograph
  go('scr-plops');
  const page = document.getElementById('plops-scroll');
  if(page) page.scrollTop = 0;
  watchCards();
}

/* One card on its own.

   Five places open the detail on a photograph that is not a feed position — a
   saved image, a repost version, a plop reached from a profile grid. They all
   built an object, populated one of the two static screens, then patched its
   datasets by hand. They share this instead: the same card, filled the same
   way, with the patching passed in. */
var _soloCard = false;
function openPlopSingle(f, after){
  const feed = document.getElementById('plopfeed'); if(!feed) return;
  _soloCard = true; _filled = new Set();
  feed.innerHTML = plopCard('card-solo');
  populatePlop('card-solo', f);
  if(typeof after === 'function') after('card-solo');
  go('scr-plops');
  const page = document.getElementById('plops-scroll');
  if(page) page.scrollTop = 0;
  if(_cardObserver) _cardObserver.disconnect();
}

function fillCard(i){
  if(i < 0 || i >= FEED.length || _filled.has(i)) return;
  const el = document.getElementById(cardIdFor(i)); if(!el) return;
  _filled.add(i);
  populatePlop(cardIdFor(i), FEED[i]);
}

/* Which card you are on, so back can return the grid to it, and so the ones
   just ahead are filled before you reach them. */
var _cardObserver = null;
function watchCards(){
  if(_cardObserver) _cardObserver.disconnect();
  if(typeof IntersectionObserver === 'undefined') return;
  const page = document.getElementById('plops-scroll');
  _cardObserver = new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      const i = parseInt((e.target.id||'').replace('card-',''), 10);
      if(isNaN(i)) return;
      if(e.isIntersecting){ fillCard(i); fillCard(i+1); }
      if(e.isIntersecting && e.intersectionRatio > 0.5){ _scrollAt = i; useCard(cardIdFor(i)); }
    });
  }, { root: page, threshold: [0, 0.5] });
  document.querySelectorAll('#plopfeed .plopcard').forEach(function(c){ _cardObserver.observe(c); });
}

function refreshPlopScroll(){
  const page = document.getElementById('plops-scroll');
  if(page) page.scrollTop = 0;
  _scrollAt = _scrollFrom;
  track('feed_refreshed', {from:_scrollFrom});
  toast('Up to date');
}

/* Back goes to the grid at the photograph you were ON, not the one you tapped.
   Scroll to the twenty-third, press back, and the grid opens with the
   twenty-third in view and everything else where it was.

   A third from the top, not centred: centred puts it under the thumb and reads
   as a jump, a third down reads as where you scrolled to. */
function closePlopScroll(){
  const i = _scrollAt;
  const solo = _soloCard;
  goBack('scr-feed');
  if(solo) return;   // it was never a feed position, so there is nothing to return to
  requestAnimationFrame(function(){
    const tile = document.getElementById('tile-' + i);
    const page = document.getElementById('feed-scroll');
    if(!tile || !page) return;
    const top = tile.offsetTop - page.clientHeight / 3;
    page.scrollTop = Math.max(0, top);
  });
}

function openTile(i){
  const f=FEED[i];
  const tile=document.getElementById('tile-'+i);
  const img=tile?tile.querySelector('img'):null;
  if(img) img.style.transform='scale(1.06)';
  if(_tileNav) clearTimeout(_tileNav);
  _tileNav = setTimeout(()=>{ _tileNav=null; openPlopScroll(i); if(img) img.style.transform=''; },160);
}
/* The action bar.

   "Repost" is a word borrowed from another product; "Add yours" says what
   happens. And on your own photograph Save is a STATE rather than a control —
   it is in your Pond by definition and cannot be unsaved, so the only way to
   remove it is Delete, in the menu. Two controls must not destroy the same
   thing. */
/* The credit line, which is three cases rather than one rule with an exception.
   Written that way on purpose: as an exception, somebody eventually tidies the
   third away.

     you took it    the top line is you                no credit line
     a repost       the top line is the photographer   no credit line — it IS the credit
     from a link    the top line is whoever pasted     "From <source>" stays

   The third cannot collapse, and not for reasons of layout. Nobody who took a
   photograph on somebody's website has an account here, so there is no name to
   put on the top line — and ADR 0003 admits linked photographs to the Feed on
   the single condition that attribution is mandatory and unremovable. It is
   "not a courtesy field; it is the condition the decision rests on." */
function renderCredit(id, f, el){
  const section = document.getElementById(id);
  const src = (typeof IMAGE_SOURCE!=='undefined') ? IMAGE_SOURCE[f.img] : null;
  if(src){
    delete section.dataset.origname; delete section.dataset.orighandle; delete section.dataset.origtarget;
    el.innerHTML = `<span class="plop-credit">From </span>`
      + `<button class="plop-src" onclick="event.stopPropagation();openSource('${esc(f.img)}')">`
      + `${I.link}<span>${esc(src.who || src.host)}</span>${I.arrowUR}</button>`;
    return;
  }
  const orig = f.origName
    ? {name:f.origName, handle:f.origHandle||'', target:f.origTarget||'scr-other-profile'}
    : originAuthorOf(f.img);
  if(orig){
    section.dataset.origname   = orig.name;
    section.dataset.orighandle = orig.handle||'';
    section.dataset.origtarget = orig.target||'scr-other-profile';
  }
  // the top line already names whoever took it, on every Layer
  el.innerHTML = '';
}

/* Which Layer the heart in the action row refers to, and whether it is yours.
   Both read the card's own state rather than the globals, because the scroll
   fills the card below before you reach it and the globals belong to whichever
   card is current. */
function readingIdxOf(id){
  const card = document.getElementById(id);
  return (card && card._readings) ? card._readingIdx : (_readingId===id ? _readingIdx : 0);
}
function ownsReading(id, ix){
  const card = document.getElementById(id);
  const rs = (card && card._readings) || (_readingId===id ? _readings : null);
  const r = rs && rs[ix];
  return !!(r && r.who && r.who.handle === ME_HANDLE);
}

/* `mine` is whose PHOTOGRAPH it is, and it is settled when the card is filled.
   The heart re-renders on every Layer change and every like, and neither of
   those knows it — so the card remembers, and the argument is optional after
   the first call. */
function renderActionBar(id, mine){
  const bar = document.getElementById(id+'-actions'); if(!bar) return;
  const card = document.getElementById(id);
  if(mine === undefined) mine = card ? !!card._mine : false;
  else if(card) card._mine = !!mine;
  /* Bare icons. A filled circle with a halo, a black pill and a 13px caption
     were three scales inside eight vertical pixels.

     The word on Add yours came off with them. It was there because three
     identical glyphs would hide the one that matters — but a pen is not
     confusable with a bookmark, so the distinct glyph pays for the missing
     word. Filled only when the state is on.

     The heart is here, first. It was in the layers box, on the reasoning that a
     Like acts on one person's reading and so belongs beside the handle whose
     reading it is. That reasoning still holds and the result did not: a heart
     alone on the right of a name is a long way from the controls it shares a
     job with.

     And it acts on the PHOTOGRAPH, which settles that argument rather than
     conceding it: the heart was put beside the handle because it was thought to
     act on one reading. It does not, so it belongs with the things that act on
     the picture. Tapping a face changes the marks and leaves the heart alone. */
  const liked = likedPlop(id);
  /* Only whoever took the photograph ever sees the count — the list is the
     accumulated version of the notifications they already receive. The count
     belongs TO the heart rather than beside it: as its own item in the row it
     was a bare numeral between two glyphs, neither an icon nor the one word the
     row allows, and it broke the spacing on both sides of itself. */
  const n = mine ? likeCountOf(id) : 0;
  const heart = `<span class="ab-likewrap">`
    + `<button class="ab-ico ab-like ${liked?'on':''}"
       aria-pressed="${liked?'true':'false'}" aria-label="${liked?'Liked':'Like'} this photograph"
       onclick="event.stopPropagation();toggleLike('${id}')">${I.heart}</button>`
    + (mine && n ? `<button class="ab-count" onclick="event.stopPropagation();openLikers('${id}')">${n}</button>` : '')
    + `</span>`;
  bar.innerHTML = heart + (mine
    /* Two things on your own photograph, not three. Editing is tapping a mark,
       per the brief — and it is in the menu as well, because a Plop can carry a
       caption and no marks, and that one would otherwise have nothing to tap. */
    ? `<span class="ab-ico state on" aria-label="Saved — in your pond">${I.bookmark}</span>`
      + `<button class="ab-ico more" onclick="openPlopMenu('${id}')" aria-label="More">${I.dots}</button>`
    : `<button class="ab-ico keep" id="${id}-savebtn" onclick="plopSave('${id}')" aria-label="Save">${I.bookmark}</button>`
      + `<button class="ab-ico" onclick="openRepostEditor('${id}')" aria-label="Add yours">${I.addYours}</button>`
      + `<button class="ab-ico more" onclick="openPlopMenu('${id}')" aria-label="More">${I.dots}</button>`);
  // the hidden note button several handlers still reach for
  if(!document.getElementById(id+'-notebtn')){
    const b = document.createElement('button');
    b.id = id+'-notebtn'; b.style.display='none'; b.setAttribute('aria-hidden','true');
    bar.appendChild(b);
  }
}

/* What the menu holds, which is three cases and not two.

   CLAUDE.md says delete lives only on your own Plop and report only on somebody
   else's. The case it does not cover is your own photograph with somebody
   else's marks on it: you tap their face, read what they wrote, and it is
   abusive. With only Delete available you would have to destroy your own
   photograph — and everybody's readings of it — to remove one person's. Report
   already carries which Layer was on screen, so the same control covers it. */
var _menuCard = null;
function openPlopMenu(id){
  _menuCard = id;
  const sec = document.getElementById(id); if(!sec) return;
  const mine = (sec.dataset.authhandle||'') === ME_HANDLE;
  const rs = sec._readings, ix = sec._readingIdx;
  const readingIsMine = !(rs && rs[ix] && (rs[ix].who||{}).handle !== ME_HANDLE);
  const rows = [];
  if(mine) rows.push(['Edit', '', "editOwnPlop('" + id + "')"]);
  if(mine) rows.push(['Delete', 'del', 'plopMenuDelete()']);
  if(!mine || !readingIsMine) rows.push(['Report', '', 'plopMenuReport()']);
  const body = document.getElementById('plopmenu-rows');

function plopMenuDelete(){
  closeSheet('plopmenu-sheet');

     delete that reaches another person's work. */
  const sec = document.getElementById(_menuCard);
  const img = sec ? sec.dataset.img : null;
  const others = img ? Math.max(0, readingCount(img) - 1) : 0;
  const body = document.getElementById('plop-del-body');
  if(body) body.textContent = others
    ? `This can't be undone, and ${others} other reading${others>1?'s':''} of this photograph will go with it.`
    : "This can't be undone.";

function confirmPlopDelete(){

}
function plopMenuReport(){
  closeSheet('plopmenu-sheet');
  const idx = (_readingId === _menuCard) ? _readingIdx : 0;

function populatePlop(id, f){
  const section = document.getElementById(id);
  if(section){
    section.dataset.img = f.img;

       screens carried this in the markup, which is how a photograph opened
       credited to whoever the previous one belonged to. */
    /* The top line is whoever TOOK the photograph, and it does not change when
       you read somebody else's Layer. It used to name whose marks were on
       screen, so one photograph appeared under a different name depending on
       which face was selected — which reads as though writing on a picture
       makes it yours. It does not.

       That is also why "Image by @handle" existed: something had to say who
       actually took it. With the top line saying so, it is redundant — except
       on a photograph from a link, where there is no such person to name.
       See the three cases in renderCredit. */
    /* Ask the image, never the FEED row. `f.mine` is a flag written into the
       seed by hand, and the moment ownership moved it started disagreeing with
       REPOST_SOURCE — a photograph of Maralind's opened with my name on it
       while her face sat in the layers box underneath. originIdentityOf is the
       single answer to "whose photograph is this"; anything that keeps its own
       copy will drift from it. */
    const me = imageIsMine(f.img);
    const orig = me ? null : (typeof originAuthorOf==='function' ? originAuthorOf(f.img) : null);
    const who = me ? {name:'Sungwon', handle:ME_HANDLE, avL:'S', avG:'g9', target:'scr-my-profile'}

                     ? {name:orig.name, handle:orig.handle, avL:orig.avL||(orig.name||'?')[0],

                     : {name:f.name||'Hanuel', handle:f.handle||'hanuel', avL:f.avL||'H', avG:f.avG||'g5',
                        target:'scr-other-profile'};
    section.dataset.authname = who.name; section.dataset.authhandle = who.handle;
    section.dataset.authtarget = who.target; section.dataset.authl = who.avL; section.dataset.authg = who.avG;
    const auth = document.getElementById(id+'-author');
    if(auth){
      auth.style.cursor = 'pointer';

        + `<span class="nm">${esc(who.name)}</span><span class="hd">@${esc(who.handle)}</span>`

    const s = section.querySelector('.plop-sub');
    if(s){
      renderCredit(id, f, s);
    }
    const d = section.querySelector('.plop-desc');
    if(d){
      d.textContent = (f.desc || f.s || '').slice(0, CAPTION_MAX);
      d.classList.add('clamped');
      let more = d.nextElementSibling;
      if(!more || !more.classList.contains('plop-more')){
        more = document.createElement('div');
        more.className = 'plop-more';
        more.textContent = 'more';
        more.onclick = function(){ d.classList.remove('clamped'); more.classList.remove('on'); };

        more.classList.toggle('on', d.scrollHeight > d.clientHeight + 2);

  // Notes — a published quote keeps its own set, others read the shared store
  const notes = plopNotesFor(section, f.img);
  const hasNotes = notes.length > 0;
  // Render reference-style marks (dot + dim pill) — view mode
  renderPlopMarks(id, false);
  // The persistent text list on the detail page is gone — note TEXT now lives
  // only in the profile note view. On the image, marks stay tappable (dim bubble).
  const notesbox = document.getElementById(id+'-notesbox');
  if(notesbox){ notesbox.style.display='none'; notesbox.innerHTML=''; }
  // Reset plopnotes area (for new notes)
  const plopnotes = document.getElementById(id+'-plopnotes');
  if(plopnotes) plopnotes.innerHTML='';
  /* Nothing is added to SAVED here. Painting a screen is not an event, and this
     line used to make it one:

       if(hasNotes || f.kept || f.mine) SAVED.add(f.img)

     so opening anything carrying marks put it in your saved set. The bookmark
     came up filled on a photograph you had never saved, and your first tap on
     it said "Removed from your pond". `hasNotes` is true when the photograph
     has marks by ANYBODY, so reading somebody else's Layer counted as keeping
     their picture.

     What it was reaching for is real — CLAUDE.md says marking your own
     photograph saves it — but that belongs where the marking happens, not where
     a screen is drawn. SAVED is seeded once at load instead, and this function
     only reads it. */
  syncSaveButtons(id);
  syncReadingBar(id, f.img);
  /* The "reposted" badge is gone: the credit line under the title already names
     whoever made the image, and the reading row shows every take on it. */
}
// Deterministic mark positions per image (spread across image)
function markPositionsFor(imgKey, count){
  const seeds = [
    [52, 45], [32, 58], [68, 55], [45, 76], [60, 32], [28, 38],
    [72, 78], [50, 62], [38, 26], [66, 68]
  ];
  const off = ((imgKey||'x').charCodeAt(0) + (imgKey||'x').length) % seeds.length;
  return Array.from({length: count}, (_, i) => {
    const s = seeds[(off + i) % seeds.length];
    return {x: s[0], y: s[1]};
  });
}
/* ---- reference-style marks: white dot / swipe region + dim pill with note text ---- */
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }
/* pill contents — view = text only; selected = input + ONE compact toolbar (move/visibility/delete) */
function pillInnerHtml(text, vis, editable, locked, byHandle){
  const v = VIS_META[vis] ? vis : 'public';
  const vm = VIS_META[v];
  // a private note carries a lock on the resting pill — the dashed outline says
  // "unshared" at a glance, the glyph says it again for anyone who can't separate
  // the two by contrast alone. Public marks stay completely unadorned.
  const lock = v==='private' ? `<span class="pm-lock">${I.lock}</span>` : '';
  // inherited (someone else's) note inside a quote — credited to whoever wrote it,
  // and only removable: keep it as they wrote it, or take it out
  if(locked){
    // the author's handle sits in the toolbar, just left of the trash —
    // so it only shows once you tap the marker, not on the resting pill
    const by = byHandle ? `<span class="pm-by">@${esc(byHandle)}</span>` : '';
    return lock + `<span class="pm-note">${esc(text)}</span>`
      + (editable ? `<span class="pm-bar pm-bar-locked">`
          + by
          + `<button class="pm-del" title="Remove this note" onclick="event.stopPropagation();plopMarkAskDelete(this)" onpointerdown="event.stopPropagation()">${I.trash}</button>`
          + `<button class="pm-cancel" title="Close" onclick="event.stopPropagation();plopMarkCancel(this)" onpointerdown="event.stopPropagation()">${I.close}</button>`
        + `</span>` : '');
  }
  /* Removing one mark belongs where the mark is. It lived behind "Delete this
     mark" at the bottom of the note sheet, which meant opening an editor to
     throw something away.

     Only while you are marking — on somebody's published card these are words
     to read, not yours to remove. */
  if(!editable) return lock + `<span class="pm-note">${esc(text)}</span>`;
  return `<span class="pm-bar">`
      + `<button class="pm-move" title="Drag to move" onpointerdown="plopMoveStart(event,this)">${I.move}</button>`
      + `<button class="pm-mic" title="Hold to speak" onpointerdown="event.stopPropagation();speakStart(event,this)">${I.mic}</button>`
      + `<button class="pm-vis nv-${v}" title="${vm.label}" onclick="event.stopPropagation();plopMarkVis(this)" onpointerdown="event.stopPropagation()">${I[vm.icon]}</button>`
      + `<button class="pm-del" title="Delete" onclick="event.stopPropagation();plopMarkAskDelete(this)" onpointerdown="event.stopPropagation()">${I.trash}</button>`
      + `<button class="pm-cancel" title="Cancel edit" onclick="event.stopPropagation();plopMarkCancel(this)" onpointerdown="event.stopPropagation()">${I.close}</button>`
    + `</span>`
    + `<input class="pm-input" maxlength="${NOTE_MAXLEN}" placeholder="What caught your eye?" value="${esc(text)}" oninput="event.stopPropagation();this.closest('.plop-mark').dataset.text=this.value;markCount(this)" onclick="event.stopPropagation()" onpointerdown="event.stopPropagation()" onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur();commitMark(this.closest('.plop-mark'));}">`
    + `<span class="pm-count"></span>`;
}
/* (re)build a mark element's inner markup from its dataset */
/* Whether this mark is on a screen where it can be removed. Editable means the
   inline editor is open; a committed mark on the marking screen is neither
   editing nor read-only, and that is the state that needs the ✕. */
/* Whether this mark can be taken off the photograph from here.

   In the editor, everything can — including somebody else's, carried in by a
   Repost. That is the whole of what you may do to an inherited mark: keep it as
   they wrote it, or take it out. Editing it is refused separately, in
   plopMarkReedit, because rewriting somebody's sentence under their name is the
   thing the credit exists to prevent.

   Only ever asked of a mark already in the DOM — see paintNoteOnHero. */
function markIsRemovable(el){
  const host = el.closest('.plopcard, .screen');
  if(!host) return false;
  if(host.id === 'scr-review') return true;
  return typeof canEditMarks === 'function' && canEditMarks(host.id) && el.dataset.inherited !== '1';
}
function rebuildMark(el, editable){
  const text = el.dataset.text || '';
  const vis = el.dataset.vis || 'public';
  const locked = el.dataset.inherited === '1';   // someone else's note carried into a quote
  const byHandle = locked ? (el.dataset.authorHandle || '') : '';
  el.classList.toggle('editing', !!editable);
  el.classList.toggle('locked', locked);
  el.classList.toggle('dotonly', !text && !editable);
  el.innerHTML = `<span class="pm-dot"></span><span class="pm-num">${el.dataset.num||''}</span>`
    + `<span class="pm-pill">${pillInnerHtml(text, vis, editable, locked, byHandle)}`
    + ((!editable && text && markIsRemovable(el))
        ? `<button class="pm-x" title="Remove this mark" aria-label="Remove this mark"
             onpointerdown="event.stopPropagation()"
             onclick="event.stopPropagation();markRemove(this)">${I.close}</button>` : '')
    + `</span>`;

  el.setAttribute('onpointerdown','markDragStart(this,event)');

     and folds where it is not — so a pill sitting over the spot you want to
     mark is one tap from gone, on either screen. */
  el.setAttribute('onclick', 'event.stopPropagation();markTapped(this,event)');
}
/* Which way a pill reaches, decided by measuring rather than by which half of
   the photograph its dot sits in. A fixed midpoint truncates a long note on a
   dot at 45%: it has room by the rule and none on the screen. Try right, flip
   only on a real overflow, and keep whichever side overflows less — a note near
   an edge has to go somewhere, and overhanging a little is better than
   cramming. An annotation sitting partly off the picture says "on top of, not
   part of".

   It never flips vertically. A pill that jumps above or below its dot reads as
   unstable and the eye has to find it again; reaching the other way keeps it at
   the same height — the same object turning rather than moving. */
function placeMark(el){
  if(!el || el.classList.contains('collapsed')) return;
  const hero = el.closest('.hero'); if(!hero) return;
  const pill = el.querySelector('.pm-pill'); if(!pill) return;
  const hr = hero.getBoundingClientRect();
  const pad = 8;
  // where the dot itself sits, which is the point both sides are measured from
  const anchor = hr.left + (parseFloat(el.style.left) || 0) / 100 * hr.width;
  const right = (hr.right - pad) - anchor;
  const left  = anchor - (hr.left + pad);
  const flip = left > right;
  el.classList.toggle('flip', flip);
  // Cap to the room on the side it settled on. Nothing is allowed to hang off
  // the edge: a pill overhanging the picture reads as deliberate until the
  // moment it takes a word with it, and a note cut mid-word is not a note.
  pill.style.maxWidth = Math.max(140, Math.round((flip ? left : right) - 34)) + 'px';
}
function placeAllMarks(id){
  const hero = document.getElementById(id + '-hero'); if(!hero) return;
  hero.querySelectorAll('.plop-mark').forEach(placeMark);
}
function plopMarkEl(x, y, opt){
  opt = opt || {};

  el.style.left = x + '%'; el.style.top = y + '%';
  el.dataset.x = x; el.dataset.y = y;
  el.dataset.vis = VIS_META[opt.vis] ? opt.vis : 'public';
  el.dataset.text = opt.text || '';
  if(opt.free) el.dataset.free = '1';
  if(opt.inherited) el.dataset.inherited = '1';
  // author credit must be on the element before the first render
  if(opt.authorName) el.dataset.authorName = opt.authorName;
  if(opt.authorHandle) el.dataset.authorHandle = opt.authorHandle;

/* ═══ Tools, badges and the note sheet ═════════════════════════════════════
   The TOOL decides what a touch makes, not the gesture. An earlier version let
   a tap make a point and a drag make a region -- it reads well and fails on a
   phone, where a drag is already pan and pinch and nobody discovers that
   dragging draws. See user-stories/03--marking.md.

   While marking, a Mark is a NUMBER and its text lives in a sheet. Reading
   somebody's Layer shows the words instead. Two modes, on purpose.          */

var MARK_TOOL = 'point';
var _mnEl = null;                  /* the mark the open sheet belongs to */
var _mnIsNew = false;              /* placing it, or changing one that exists */

function setTool(t){
  MARK_TOOL = t;
  var p = document.getElementById('mk-point'), r = document.getElementById('mk-region');
  if(p) p.classList.toggle('on', t === 'point');
  if(r) r.classList.toggle('on', t === 'region');
  /* No hint for the region tool. The tool bar exists BECAUSE the gesture was
     not discoverable, and a tool labelled "Draw" is the explanation — a second
     sentence saying the same thing is the duplication just removed between the
     coach mark and this line. */
  /* The hint's job is over the moment a tool is chosen. It said "Tap the
     photograph where you noticed something" underneath a bar with Point and
     Draw already on it, which is the same duplication that took the region
     hint away — the instruction was already on screen, spelled shorter. */
  var h = document.getElementById('mk-hint');
  if(h) h.style.display = 'none';
  track('mark_tool_selected', { tool: t });
}

/* badges are numbered in the order they were made */
function renumberMarks(id){
  var hero = document.getElementById(id + '-hero'); if(!hero) return;
  var n = 0;
  hero.querySelectorAll('.plop-mark').forEach(function(el){
    n++;

function undoMark(id){

  var c = document.getElementById('mn-count'); if(c) c.classList.remove('hint');

   the sheet was doing exactly that on its own, covering roughly the bottom third

function revealMark(el){

    var sheet = document.querySelector('#mark-note-sheet.open .sheet');
    if(!sheet) return;
    var pr = pane.getBoundingClientRect();
    var lid = sheet.getBoundingClientRect().top;
    var m = el.getBoundingClientRect();
    var pad = 28;
    if(m.top - pad >= pr.top && m.bottom + pad <= lid) return;     // already in view
    var strip = lid - pr.top;
    if(strip < 90) return;                                          // no room to make
    var by = (m.top + m.height / 2) - (pr.top + strip / 2);
    /* Scrolling cannot do this: on the capture screen the pane's content fits it
       exactly, so scrollTop has nowhere to go. Lift the pane instead. The top of
       the photograph slides out of sight, which is the right thing to lose —
       you are looking at the part you just marked. */
    if(pane.scrollHeight > pane.clientHeight){
      pane.scrollTo({ top: Math.max(0, pane.scrollTop + by), behavior: 'smooth' });
    } else {
      _paneLift = Math.max(0, Math.round(by));
      pane.style.transition = 'transform .22s ease';
      pane.style.transform = 'translateY(' + (-_paneLift) + 'px)';
      _paneLifted = pane;
    }
  }, 240);
}

/* ═══ Drawing a region ═════════════════════════════════════════════════════
   A Mark is a point OR a region, never both. Tap places a point; drag draws a
   region. Its note anchors to the centre of what was drawn.

   Shapes live on the mark element as data-path -- a JSON list of {x,y} in the
   same 0-100 space the points use, so a region survives any image size. The
   server never interprets it; see prisma/schema.prisma.                    */

function lassoLayer(id, make){
  var hero = document.getElementById(id+'-hero'); if(!hero) return null;
  var svg = hero.querySelector('svg.lasso-layer');
  if(!svg && make){
    svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.setAttribute('class','lasso-layer');
    svg.setAttribute('viewBox','0 0 100 100');
    svg.setAttribute('preserveAspectRatio','none');
    hero.appendChild(svg);
  }
  return svg;
}
function pathD(pts, close){
  if(!pts || !pts.length) return '';
  var d = 'M' + pts[0].x.toFixed(2) + ' ' + pts[0].y.toFixed(2);
  for(var i=1;i<pts.length;i++) d += 'L' + pts[i].x.toFixed(2) + ' ' + pts[i].y.toFixed(2);
  return d + (close ? 'Z' : '');
}
/* the live line while a finger is down */
function drawLasso(id, pts, done){
  var svg = lassoLayer(id, true); if(!svg) return;
  var live = svg.querySelector('path.lasso-live');
  if(!live){
    live = document.createElementNS('http://www.w3.org/2000/svg','path');
    live.setAttribute('class','lasso-live');
    svg.appendChild(live);
  }
  live.setAttribute('d', pathD(pts, false));
  if(done) live.remove();
}
function clearLasso(id){
  var svg = lassoLayer(id, false); if(!svg) return;
  var live = svg.querySelector('path.lasso-live'); if(live) live.remove();
}
/* a committed region, drawn under its pill */
function paintRegion(id, pts, vis, markEl){
  var svg = lassoLayer(id, true); if(!svg || !pts || pts.length < 2) return;
  var NS = 'http://www.w3.org/2000/svg';
  /* the invisible target goes down first, so the visible stroke sits over it */
  if(markEl){
    var hit = document.createElementNS(NS,'path');
    hit.setAttribute('class','lasso-hit');
    hit.setAttribute('d', pathD(pts, false));
    /* stop the draw handler: a press on an existing region is aimed at that
       region, not at starting a new one over the top of it */
    hit.addEventListener('pointerdown', function(e){ e.stopPropagation(); });
    hit.addEventListener('click', function(e){ e.stopPropagation(); plopMarkReedit(markEl); });
    svg.appendChild(hit);
  }
  var p = document.createElementNS(NS,'path');
  p.setAttribute('class','lasso-shape' + (vis==='private' ? ' priv' : ''));
  p.setAttribute('d', pathD(pts, false));
  svg.appendChild(p);
}
function clearRegions(id){
  var svg = lassoLayer(id, false); if(!svg) return;
  svg.querySelectorAll('path.lasso-shape,path.lasso-hit').forEach(function(n){ n.remove(); });
}
/* the note hangs off the middle of the shape, not off a corner of it */
function pathCentre(pts){
  if(!pts || !pts.length) return {x:50,y:50};
  var sx=0, sy=0;
  for(var i=0;i<pts.length;i++){ sx+=pts[i].x; sy+=pts[i].y; }
  return { x: sx/pts.length, y: sy/pts.length };
}
/* redraw every committed region on a screen from its marks */
function repaintRegions(id){
  clearRegions(id);
  var hero = document.getElementById(id+'-hero'); if(!hero) return;
  hero.querySelectorAll('.plop-mark[data-path]').forEach(function(el){
    var pts; try { pts = JSON.parse(el.dataset.path); } catch(e){ return; }
    paintRegion(id, pts, el.dataset.vis, el);
  });
}

/* ═══ Speaking a Mark ═══════════════════════════════════════════════════════
   record -> transcribe -> shorten to NOTE_MAXLEN -> hand back EDITABLE.

   Speaking and typing produce the same Mark and neither is the fallback --
   see user-stories/03--marking.md. The prototype fakes the two model calls;
   everything either side of them is the real interaction.

   Three things this has to get right, because they are what the beta measures:
     - the shortened line arrives editable, not as a finished answer
     - the transcript is kept and shown to NOBODY once saved
     - a failure never loses the Mark: the field stays typeable            */

/* No permission gate here. iOS shows its own dialog the first time an app asks
   for the microphone, which is what user-stories/02--capture.md is describing —
   that line is about the OS prompt and stays true. What used to be here was a
   custom sheet simulating it, and a prototype faking a system dialog teaches
   testers about a screen that will never exist. Holding the mic just records. */
var _speak = null;
var _speakN = 0;

/* People speak in paragraphs. The point of each pair is that the second is
   much shorter than the first -- that gap is what H10 measures.

   The two model calls are faked, so the fake has to behave the way the real one
   should or the beta measures the wrong thing. The rule these demonstrate:

     KEEP   proper nouns, materials, places, and the specific observation
     CUT    hedging ("I think", "kind of", "the thing is"), connectives, and
            anything the photograph already shows

   The names are the part that matters. These are designers saying words like
   terrazzo and verdigris, often in rooms with bad acoustics, and somebody else
   reads the result -- a line that has dropped the one word carrying the
   information is worse than no line, because it looks finished.

   The 70-character limit is NOT the lever here. If names are being lost, that
   is the shortener's prompt. The limit exists to force a single thought, the
   transcript exists precisely to find out whether shortening preserves meaning
   (CLAUDE.md, Transcript), and raising it now would spend that answer before
   collecting it -- as well as making five Layers on one photograph unreadable,
   which is H6. */
var SPEAK_SAMPLES = [
  ["So the thing I noticed here is the way the light kind of pools right where the plaster has failed, and it makes the whole corner feel softer than it should.",
   "Light pools where the plaster failed"],
  ["I think what I like is that it is terrazzo but they have used these really oversized chips, much bigger than you normally see, so it reads almost like a pebble floor.",
   "Terrazzo, but the chips are oversized — almost a pebble floor"],
  ["This is the Ando chapel in Naoshima, and the thing is the concrete is so smooth that it does not really read as concrete at all, more like something poured and then polished.",
   "Ando, Naoshima — concrete too smooth to read as concrete"],
  ["There is a repetition in the tiling but it is not regular, it slips about every fourth one, and I think that slip is the whole reason it feels handmade.",
   "The tiling slips every fourth tile — that is why it feels made"],
  ["What I like about this is that the brass has gone that dull green colour, verdigris I suppose, and against the terracotta it is doing something I keep coming back to.",
   "Verdigris brass against terracotta"],
  ["The colour here is doing something quite odd, it reads as grey from right across the room and then up close it is clearly a very desaturated green.",
   "Grey across the room, desaturated green up close"]
];

function speakEnd(){
  if(!_speak) return;
  var st = _speak; _speak = null;
  if(st.btn) st.btn.classList.remove('on');
  var held = Date.now() - st.t0;

  if(held < 600){ speakShow(false); toast('Hold it down while you speak'); return; }

  speakShow(true, 'One moment...', '', true);

  setTimeout(function(){
    speakShow(false);
    _speakN++;
    /* every fourth attempt fails, so the failure path is reachable in a demo
       rather than theoretical. A failure must never cost the Mark. */
    if(_speakN % 4 === 0){
      toast('Didn\'t catch that. Try again, or type it');
      track('speak_failed', {});
      /* A failure must never cost the Mark, and the recovery is that the field
         stays typeable. It used to reach for .pm-input inside the mark element —
         which stopped existing when the mic moved into the sheet — so nothing was

               || st.el.querySelector('.pm-input');

    var transcript = pair[0], shortLine = pair[1];

         nobody read it -- see H10. Readable first, editable on a tap. */

    var sec = st.el.closest('.plopcard, .screen'); if(sec){ try{ syncSaveButtons(sec.id); persistMarks(sec.id); }catch(e){} }

      var c = document.getElementById('mn-count');
      if(c){ c.textContent = 'From what you said'; c.classList.add('hint'); }

    }

   you are moving it; press and let go and you have tapped it. No long-press to
   discover and no handle to hit, which matters at this size.

   On a point, the dot and its words are the same object and both move. On a

const DRAG_SLOP = 6;
/* A point may go anywhere: the point IS the mark, and moving it is the whole

function markDragBounds(el){
  if(el.dataset.kind !== 'region' || !el.dataset.path) return null;
  let pts; try { pts = JSON.parse(el.dataset.path); } catch(e){ return null; }
  if(!pts || !pts.length) return null;
  const xs = pts.map(p=>p.x), ys = pts.map(p=>p.y);
  return {
    x0: Math.max(0,   Math.min.apply(null, xs) - REGION_SLACK),
    x1: Math.min(100, Math.max.apply(null, xs) + REGION_SLACK),
    y0: Math.max(0,   Math.min.apply(null, ys) - REGION_SLACK),
    y1: Math.min(100, Math.max.apply(null, ys) + REGION_SLACK),
  };
}
let markDrag = null;
function markDragStart(el, evt){

  if(!img) return;

    startLeft: parseFloat(el.style.left)||0, startTop: parseFloat(el.style.top)||0,
    startX: evt.clientX, startY: evt.clientY, pid: evt.pointerId,

    const nt = markDrag._nt!=null ? markDrag._nt : markDrag.startTop;

function collectPlopNotes(id, persist){

  if(!img) return [];
  const hero = document.getElementById(id+'-hero');

    const inp = el.querySelector('.pm-input');
    const noteEl = el.querySelector('.pm-note');

    if(!txt) return;
    const entry = {text: txt.slice(0,NOTE_MAXLEN), visibility: el.dataset.vis||'public'};

      entry.inherited = true;

function currentGridItems(){

  let items = MYGRID.slice();
  // 1) POND — always narrows to the selected pond's members
  if(pond && pond!=='All'){
    const members = (typeof POND_MEMBERS!=='undefined' && POND_MEMBERS[pond]) || [];
    items = items.filter(c => members.includes(c.img));

/* A save has to actually land somewhere: it joins the pond, shows up in My Pond
   and gets filed by the classifier. Before this it only flipped a button.

   `kind` says which of the two things landed. A Save creates a BOOKMARK —
   someone else's image in my collection, carrying nothing of mine, never
   reaching a feed and not markable. Publishing my own photograph creates a
   POST. Both sit in a pond and both get filed; only the second is mine.
   Passing no kind means bookmark, because Save is the common caller. */
function keepImage(img, pond, kind){
  if(!img) return;
  SAVED.add(img);
  if(kind === 'post') SAVED_IMGS.delete(img); else SAVED_IMGS.add(img);
  const m = (POND_MEMBERS[pond] = POND_MEMBERS[pond] || []);
  if(!m.includes(img)) m.push(img);
  Object.keys(POND_MEMBERS).forEach(p=>{        // one pond per photo
    if(p===pond) return;
    const i=POND_MEMBERS[p].indexOf(img); if(i>=0) POND_MEMBERS[p].splice(i,1);
  });
  if(!MYGRID.some(c=>c.img===img)) MYGRID.unshift({img});
  const pd=_PONDS.find(p=>p.name===pond); if(pd) pd.count=(POND_MEMBERS[pond]||[]).length;
  const all=_PONDS.find(p=>p.name==='All'); if(all) all.count=MYGRID.length;
  if(typeof autoClassify==='function') autoClassify(img, pond);
  if(typeof renderMyGrid==='function' && document.getElementById('mygrid')) renderMyGrid();
  if(typeof renderSubtabs==='function') renderSubtabs();
}
function unkeepImage(img){
  if(!img) return;
  SAVED.delete(img); SAVED_IMGS.delete(img);
  Object.keys(POND_MEMBERS).forEach(p=>{
    const i=POND_MEMBERS[p].indexOf(img); if(i>=0) POND_MEMBERS[p].splice(i,1);
  });
  subtabsOf('All'); Object.keys(SUBTABS).forEach(p=>subtabsOf(p).forEach(s=>{
    let i=s.autoIds.indexOf(img);   if(i>=0) s.autoIds.splice(i,1);
    i=s.manualIds.indexOf(img);     if(i>=0) s.manualIds.splice(i,1);
  }));
  const gi=MYGRID.findIndex(c=>c.img===img); if(gi>=0) MYGRID.splice(gi,1);
  if(typeof renderMyGrid==='function' && document.getElementById('mygrid')) renderMyGrid();
  if(typeof renderSubtabs==='function') renderSubtabs();
}

/* ---------- Repost · fork the image with the source's public marks seeded ---------- */
function openRepostEditor(srcId, own){
  const sec=document.getElementById(srcId); if(!sec) return;
  const img=sec.dataset ? sec.dataset.img : null;
  if(!img){ toast('Nothing to repost'); return; }
  /* You cannot Repost anything sitting on your own photograph — not your own
     Plop, and not somebody else's reading of it.
     08--repost.md says "a person cannot Repost their own Plop", which forbids
     the first and permits the second: their reading is their Plop, so by the
     letter you could publish your version of how they saw your picture, ending
     with two Plops of yours on one image. That was blocked here as a side
     effect of asking the image rather than the screen, and the wider rule was
     then chosen deliberately rather than left as an accident. The spec now says
     so; see 08--repost.md. */
  /* Editing your own marks comes through here too, and must not be refused by
     the rule that stops you reposting yourself. `own` is set by Edit and by
     tapping your own mark — both are you changing your own reading, which is
     the opposite of publishing a second one. */
  if(!own && ((sec.dataset.authhandle||'')===ME_HANDLE || imageIsMine(img))){
    toast(imageIsMine(img) && (sec.dataset.authhandle||'')!==ME_HANDLE
      ? "This is your photograph — reposting it would be reposting yourself"
      : "This one's already yours");
    track('repost_blocked_own', {img});
    return;
  }
  // REPOST.pending is read (and cleared) by openEditor on the very next line of
  // execution. Attribution is NOT stored here — REPOST_SOURCE is the single source
  // of truth for who made an image; a second copy only ever drifts out of sync.
  REPOST.pending=true; REPOST.srcId=srcId; REPOST.img=img;
  // the source's caption comes along pre-filled — everything in a repost is
  // yours to change; only the image credit stays with whoever made it
  const srcCap = (sec.querySelector('.plop-desc')||{}).textContent || '';
  openEditor(img,'','');                   // reuses the capture editor
  /* the caption you were reading comes along — it is a starting point for your
     own reading, and everything in a Repost is yours to change */
  const dsc=document.getElementById('f-desc'); if(dsc){ dsc.value = srcCap; capGrow(dsc); }
  document.getElementById('rev-head-t').textContent = own ? 'Edit' : 'Repost';
  const hero=document.getElementById('scr-review-hero');
  // Seed whatever the user is ACTUALLY looking at. If they swiped to Jinyoung's
  // reading and hit repost, seeding the original author's marks would hand them
  // something different from what was on screen.
  const viewing = (_readingId===srcId && _readings[_readingIdx]) ? _readings[_readingIdx] : null;
  /* Editing your own keeps the private ones — they are yours to see. Seeding a
     Repost drops them, because a private mark is only ever seen by whoever
     made it. */
  const seeded = own
    ? ((viewing && viewing.notes) || (typeof MARKNOTES!=='undefined' && MARKNOTES[img]) || [])
    : (viewing && !viewing.original)
      ? (viewing.notes||[]).filter(n=>n.visibility!=='private')
      : _sourcePublicNotes(img);
  if(viewing && !viewing.original) track('repost_of_reading', {img, who:viewing.who.handle});
  clearRegions('scr-review');
  const pos=markPositionsFor(img, seeded.length);
  /* Whose words these are. Reposting somebody's reading copies their sentences,
     and a copy that forgets its author is the same thing as writing it
     yourself. Editing your own passes nobody, because they are already yours. */
  const seedBy = own ? null
    : (viewing && !viewing.original) ? viewing.who : originIdentityOf(img);
  seeded.slice(0, MARK_CAP).forEach((n,i)=>paintNoteOnHero('scr-review', hero, n, pos[i % pos.length], seedBy));
  hero.classList.add('marks-on');
  // The marking screen draws marks as numbered badges and hides the pill, so a
  // seeded mark that never got a number rendered as a blank circle — the
  // reposter could see that something was there and not what it said.
  renumberMarks('scr-review');
  refreshMarkCount();
  track('repost_started', {img, seeded:seeded.length});
}





/* ---------- (c) one place to see and tidy every sub-tab ---------- */
var _dclPond=null, _dclList=[];
function newPondFlow(){
  // No limit here on purpose. CLAUDE.md §9 puts a beta account at two ponds, and
  // this comment used to point at an atPondLimit() that was never written — the
  // wall reads as enforced and is not. Left open deliberately for the prototype;
  // the real cap belongs with pond_limit_hit in the app, not here.
  askText({title:'New pond', max:24, cta:'Create', placeholder:'Interiors, Research…',
    sub:'A pond is a board. Sub-tabs live inside it.',
    cb:function(name){
      if(POND_META[name]){ toast('You already have that one'); return; }
      // Every pond used to be born private with no working way out, which would
      // have read as "nobody wants to publish" when it was really "nobody could".
      POND_META[name] = {autoDetect:true, public:true};
      POND_MEMBERS[name] = POND_MEMBERS[name] || [];
      SUBTABS[name] = [];
      _PONDS.push({name, count:0});
      PROFILE_STATE.pond = name; PROFILE_STATE.activeSubs.clear();
      updatePondBtnLabel(); renderSubtabs(); renderMyGrid();
      setTimeout(()=>openDeclareSheet(name), 220);   // straight into declaring
    }});
}
/* _dclList holds names. It used to hold a name and a one-line description, and
   the description existed for exactly one reader: a classifier, to tell it what
   your word meant. Automatic filing is deferred to v2, so nothing reads it —
   and a second input per sub-tab is asking for work that nothing uses.

   Written as though automatic filing will never exist, because from where the
   person is standing it does not. The cost, named so it is not a surprise: when
   filing arrives, nobody's sub-tabs carry a description and the classifier
   starts cold. It can ask then, when there is a reason to. */
function dclIndexOf(name){
  return _dclList.findIndex(x => x.n.toLowerCase() === String(name).toLowerCase());
}
function openDeclareSheet(pond){
  _dclPond = pond;
  _dclList = liveSubtabs(pond).filter(s=>s.label!==UNSORTED).map(s=>({n:s.label}));
  document.getElementById('dcl-pond').textContent = pond;
  document.getElementById('dcl-presets').innerHTML =
    Object.keys(SUBTAB_PRESETS).map(k=>`<button class="dcl-preset" onclick="dclPreset('${k}')">${k}</button>`).join('');
  renderDeclare();
  openSheet('declare-sheet');
}
function renderDeclare(){
  const box=document.getElementById('dcl-list'); if(!box) return;
  const lim=subtabLimit();
  box.innerHTML = _dclList.map((t,i)=>
    `<div class="dcl-row"><span class="nm">${esc(t.n)}</span>
       <button class="x" onclick="dclDrop(${i})">${I.close}</button></div>`).join('')
    + `<div class="dcl-note">${_dclList.length} of ${lim}</div>`;
}
function dclPreset(k){
  (SUBTAB_PRESETS[k]||[]).forEach(n=>{
    if(_dclList.length >= subtabLimit()) return;
    if(dclIndexOf(n) < 0) _dclList.push({n:n});
  });
  renderDeclare();
  track('subtab_preset_used', {preset:k});
}
function dclAdd(){
  if(_dclList.length >= subtabLimit()){
    toast(`Beta accounts have ${SUBTAB_MAX} sub-tabs per pond`);
    return;
  }
  askText({title:'Sub-tab name', max:24, cta:'Add', placeholder:'Stairs, Colour, Lamp…',
    onCancel:function(){ openSheet('declare-sheet'); },
    cb:function(n){
      if(dclIndexOf(n) < 0) _dclList.push({n:n, d:''});
      openSheet('declare-sheet'); renderDeclare();
      // Ask for the line straight away, while the person still knows why they
      // typed the word. Asking later gets skipped.
      const i = dclIndexOf(n); if(i >= 0) setTimeout(function(){ dclDesc(i); }, 260);
    }});
}
function dclDrop(i){ _dclList.splice(i,1); renderDeclare(); }
function dclSkip(){ closeSheet('declare-sheet'); track('subtab_declare_skipped', {pond:_dclPond}); }
function dclDone(){
  const pond=_dclPond, list=subtabsOf(pond);
  // drop tabs the user removed here, but only if nothing was filed by hand
  for(let i=list.length-1;i>=0;i--){
    const s=list[i];
    if(s.label===UNSORTED) continue;
    if(dclIndexOf(s.label) < 0){
      if(s.manualIds.length) s.hidden=true; else list.splice(i,1);
    }
  }
  _dclList.forEach(t=>{
    let s=subtabByName(pond,t.n);
    if(s){ s.hidden=false; }
    else { s=normTab({name:t.n, source:'user'}); list.push(s); }
    resortTab(pond, s);
  });
  closeSheet('declare-sheet');
  if(PROFILE_STATE.pond===pond){ renderSubtabs(); renderMyGrid(); }
  // no `described` count: there is nothing to describe. See hypotheses.md, H7.
  track('subtab_declared', {pond, n:_dclList.length});
  toast(_dclList.length ? `${_dclList.length} sub-tabs ready` : 'No sub-tabs — everything stays in one place');
}
function openSubtabManager(){
  const pond=PROFILE_STATE.pond;
  renderSubtabManager();
  const h=document.getElementById('stm-title'); if(h) h.textContent = 'Sub-tabs · ' + pond;
  openSheet('subtab-manager');
  track('subtab_manager_opened', {pond});
}
function renderSubtabManager(){
  const pond=PROFILE_STATE.pond;
  const box=document.getElementById('stm-list'); if(!box) return;
  const all=subtabsOf(pond).filter(s=>!s.editing && s.label!==UNSORTED);
  const live=all.filter(s=>!s.hidden), hid=all.filter(s=>s.hidden);
  if(!all.length){
    box.innerHTML = `<div class="stm-empty">No sub-tabs in ${esc(pond)} yet.</div>`
      + `<div class="newpond" onclick="openDeclareSheet('${pond}')">Set them up</div>`;
    return;
  }
  const row=(s,i)=>{
    const n=subtabCount(pond, s.name);
    // an empty tab is NORMAL here — you name "Bedroom" before you own a bedroom
    // photo. Flagging it red told people they had done something wrong.
    return `<div class="stm-row${s.hidden?' is-hidden':''}" ${s.hidden?'':`draggable="true"
        ondragstart="stmDragStart(event,${i})" ondragover="event.preventDefault()"
        ondrop="stmDrop(event,${i})" ondragenter="this.classList.add('drop')" ondragleave="this.classList.remove('drop')"`}>
      ${s.hidden?'<span class="stm-grip"></span>':`<span class="stm-grip">${I.grip}</span>`}
      <span class="stm-name">${esc(s.label)}</span>
      <span class="stm-kind">${s.source==='suggested'?'suggested':(s.rule?'auto':'frozen')}</span>
      <span class="stm-n">${n}</span>
      ${s.hidden
        ? `<button class="stm-act" onclick="event.stopPropagation();stmRestore(${i})" title="Restore">${I.undo||'↺'}</button>`
        : `<button class="stm-act" onclick="event.stopPropagation();stmRename(${i})" title="Rename">${I.edit}</button>
           <button class="stm-act stm-del" onclick="event.stopPropagation();stmDelete(${i})" title="Remove">${I.trash}</button>`}
    </div>`;
  };
  box.innerHTML = live.map(s=>row(s, all.indexOf(s))).join('')
    + `<div class="dcl-note">${live.length} of ${subtabLimit()}</div>`
    + (hid.length ? `<div class="stm-sec">HIDDEN</div>` + hid.map(s=>row(s, all.indexOf(s))).join('') : '');
}
function stmRename(i){
  const pond=PROFILE_STATE.pond, s=subtabsOf(pond)[i]; if(!s) return;
  const was=s.name;
  askText({title:'Rename sub-tab', value:was, max:24, cta:'Save',
    sub: s.rule ? 'Photos refile themselves to match the new name. Anything you placed by hand stays put.' : '',
    cb:function(name){
      if(name===was) return;
      if(subtabByName(pond,name)){ toast('That one already exists'); return; }
      const d = s.rule ? resortPreview(pond, s, name) : {added:0, removed:0};
      const commit = function(){
        s.label = s.name = name;
        // renaming RE-TARGETS the tab — it does not switch auto-filling off.
        // Killing auto on rename punished anyone who just preferred another word.
        if(s.rule) { s.rule = name; resortTab(pond, s); }
        if(PROFILE_STATE.activeSubs.has(was)){ PROFILE_STATE.activeSubs.delete(was); PROFILE_STATE.activeSubs.add(name); }
        renderSubtabManager(); renderSubtabs(); renderMyGrid();
        track('subtab_renamed', {pond, from:was, to:name, added:d.added, removed:d.removed});
      };
      // a big swing gets a look before it happens
      if(d.added + d.removed >= 5){
        askConfirm({title:`Refile ${d.added + d.removed} photos?`,
          sub:`"${name}" will take in ${d.added} and let go of ${d.removed}. Anything you filed by hand stays.`,
          cta:'Rename', cb:commit});
      } else commit();
    }});
}
function stmDelete(i){
  const pond=PROFILE_STATE.pond, s=subtabsOf(pond)[i]; if(!s) return;

    toast(`"${s.label}" hidden · restore it any time`);
    track('subtab_hidden', {pond, name:s.label, had:n});

    sub:`The ${n} photo${n>1?'s':''} stay in your pond, and you can restore this from Hidden.`,
