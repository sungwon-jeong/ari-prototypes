<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ari · Pool</title>
<style>
:root{
  --bg:#FFFFFF; --surface:#F2F2F2; --ink:#111111; --soft:#8A8A8E; --line:#ECECEC;
  --mark:#325788; --amber:#D9A45A; --r-pill:999px; --r-img:6px;
  --shadow-float:0 8px 30px rgba(0,0,0,.12);
  --safeT:env(safe-area-inset-top); --safeB:env(safe-area-inset-bottom);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{
  background:var(--bg); color:var(--ink); overflow:hidden;
  font-family:-apple-system,"SF Pro Text",Inter,"Helvetica Neue",sans-serif;
  -webkit-font-smoothing:antialiased; touch-action:manipulation;
}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer;font-size:inherit}
input{font-family:inherit}
.icon{width:22px;height:22px;display:block;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.icon.sm{width:17px;height:17px}

/* ── screens ─────────────────────────────────────────────── */
.screen{position:fixed;inset:0;display:none;flex-direction:column;background:var(--bg)}
.screen.on{display:flex}

.top{flex:none;display:flex;align-items:center;gap:10px;
  padding:calc(var(--safeT) + 12px) 16px 12px;border-bottom:1px solid var(--line)}
.top .ttl{font-size:17px;font-weight:600;letter-spacing:-.01em}
.top .sub{font-size:12px;color:var(--soft)}
.top .r{margin-left:auto;display:flex;gap:14px;align-items:center}
.tbtn{width:36px;height:36px;display:flex;align-items:center;justify-content:center;
  border-radius:50%;background:var(--surface)}
.tbtn:active{opacity:.55}
.tlink{font-size:15px;font-weight:600}
.tlink.dim{color:var(--soft);font-weight:400}

.body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.bottom{flex:none;padding:12px 16px calc(var(--safeB) + 14px);border-top:1px solid var(--line);
  display:flex;align-items:center;gap:12px;background:var(--bg)}
.pri{flex:1;height:48px;border-radius:var(--r-pill);background:var(--ink);color:#fff;
  font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:7px}
.pri:disabled{background:var(--surface);color:var(--soft)}
.pri:active:not(:disabled){opacity:.8}
.sec{font-size:15px;color:var(--soft);padding:0 4px}

/* ── 보관함 grid ─────────────────────────────────────────── */
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:2px;padding:2px}
.cell{position:relative;aspect-ratio:1;background:var(--surface);overflow:hidden}
.cell img{width:100%;height:100%;object-fit:cover;display:block}
.cell .pick{position:absolute;right:6px;top:6px;width:24px;height:24px;border-radius:50%;
  border:2px solid rgba(255,255,255,.95);background:rgba(0,0,0,.15);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:12px;font-weight:700}
.cell.on .pick{background:var(--mark);border-color:#fff}
.cell.on img{transform:scale(.93);transition:transform .12s}
.cell:active img{opacity:.75}

.empty{padding:70px 34px;text-align:center;color:var(--soft);font-size:14px;line-height:1.7}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:8px}

/* ── 조합 2×2 ───────────────────────────────────────────────
   인스타 스토리와 같은 9:16입니다. 4분할하면 각 칸도 540×960 = 9:16이라
   세로로 긴 레퍼런스가 잘리지 않습니다 — 드레스가 정확히 그렇습니다.
   정사각으로 두면 모든 칸이 원본을 위아래로 잘라먹습니다. */
.quadwrap{flex:1;display:flex;align-items:center;justify-content:center;
  min-height:0;background:#fff;padding:8px 10px}
.quad{width:100%;aspect-ratio:9/16;max-height:100%;
  display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;
  gap:3px;padding:3px;background:var(--line);border-radius:4px}
.qc{position:relative;overflow:hidden;background:var(--surface);touch-action:none}
.qc .inner{position:absolute;inset:0;overflow:hidden}
.qc img{position:absolute;left:50%;top:50%;width:100%;height:100%;object-fit:cover;
  transform-origin:center;will-change:transform}
.qc .num{position:absolute;left:7px;top:7px;width:19px;height:19px;border-radius:50%;
  background:rgba(0,0,0,.5);color:#fff;font-size:10.5px;font-weight:700;
  display:flex;align-items:center;justify-content:center;z-index:3;
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.qc svg.ink{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
.qc svg.ink path{fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;
  stroke-linejoin:round;filter:drop-shadow(0 1px 3px rgba(0,0,0,.55))}
.qc .note{position:absolute;left:7px;right:7px;bottom:7px;z-index:4;
  background:rgba(17,17,17,.82);color:#fff;font-size:11px;line-height:1.35;
  padding:6px 8px;border-radius:8px;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.qc.editing{outline:2px solid var(--mark);outline-offset:-2px}
/* 길게 누르기만으로는 아무도 못 찾습니다. 보이는 손잡이를 하나 둡니다 —
   탭은 프레이밍, 이 버튼은 표시. 길게 누르기는 아는 사람을 위한 지름길로 남깁니다. */
.qc .pen{position:absolute;right:6px;top:6px;width:28px;height:28px;border-radius:50%;
  background:rgba(0,0,0,.5);color:#fff;display:flex;align-items:center;justify-content:center;z-index:5;
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.qc .pen .icon{width:15px;height:15px}
.qc .pen:active{background:var(--mark)}

/* 조합 하단 */
.poolbar{flex:none;display:flex;align-items:center;gap:8px;
  padding:11px 14px calc(var(--safeB) + 12px);border-top:1px solid var(--line)}
.pill{height:40px;padding:0 15px;border-radius:var(--r-pill);background:var(--surface);
  display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:500}
.pill:active{opacity:.6}
.pill.on{background:var(--ink);color:#fff}
.pill.star.on{background:var(--amber);color:#fff}
.grow{flex:1}

/* 셀 확대 / 프레이밍 */
.zoomwrap{position:fixed;inset:0;z-index:60;background:#000;display:none;flex-direction:column}
.zoomwrap.on{display:flex}
.zoomstage{flex:1;position:relative;overflow:hidden;touch-action:none}
.zoomstage img{position:absolute;left:50%;top:50%;max-width:none;transform-origin:center}
.zoomhint{position:absolute;left:0;right:0;bottom:14px;text-align:center;color:rgba(255,255,255,.72);
  font-size:12px;pointer-events:none}
.zoombar{flex:none;display:flex;align-items:center;gap:12px;padding:12px 16px calc(var(--safeB) + 12px);
  background:#000;color:#fff}
.zoombar .t{font-size:15px;font-weight:600}
.zoombar .d{margin-left:auto;font-size:15px;font-weight:600;color:#fff}

/* 마킹 */
.markwrap{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.92);display:none;flex-direction:column}
.markwrap.on{display:flex}
.markstage{flex:1;position:relative;overflow:hidden;touch-action:none;
  display:flex;align-items:center;justify-content:center}
.markstage .holder{position:relative;max-width:100%;max-height:100%}
.markstage img{display:block;max-width:100%;max-height:100%;object-fit:contain}
.markstage svg{position:absolute;inset:0;width:100%;height:100%}
.markstage svg path{fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;
  filter:drop-shadow(0 1px 4px rgba(0,0,0,.6))}
.markbar{flex:none;padding:12px 16px calc(var(--safeB) + 12px);background:#111;color:#fff;
  display:flex;flex-direction:column;gap:10px}
.markrow{display:flex;align-items:center;gap:10px}
.markinput{flex:1;height:44px;border-radius:12px;border:0;padding:0 14px;font-size:15px;
  background:#242424;color:#fff}
.markinput::placeholder{color:#7a7a7e}
.mbtn{height:44px;padding:0 16px;border-radius:12px;background:#242424;color:#fff;
  font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px}
.mbtn.pri2{background:#fff;color:#111}
.mbtn:active{opacity:.7}
.mhint{font-size:11.5px;color:#8a8a8e;text-align:center}

/* ── 조합 목록 ──────────────────────────────────────────── */
.plist{padding:12px 14px 26px;display:flex;flex-direction:column;gap:11px}
.pcard{display:flex;gap:12px;align-items:center;border:1px solid var(--line);
  border-radius:14px;padding:10px}
.pcard:active{background:var(--surface)}
.pcard.star{border-color:var(--amber);border-width:1.5px}
.pmini{width:56px;height:99.5px;flex:none;display:grid;grid-template-columns:1fr 1fr;
  grid-template-rows:1fr 1fr;gap:1.5px;border-radius:7px;overflow:hidden;background:var(--line)}
.pmini img{width:100%;height:100%;object-fit:cover;display:block}
.pmeta{flex:1;min-width:0}
.pmeta .nm{font-size:15px;font-weight:600;display:flex;align-items:center;gap:6px}
.pmeta .dt{font-size:12px;color:var(--soft);margin-top:2px}
.pmeta .mk{font-size:11.5px;color:var(--soft);margin-top:4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{color:var(--soft);flex:none}

/* ── 공유 뷰 ────────────────────────────────────────────── */
.shareHead{padding:16px 18px 8px}
.shareHead h2{font-size:19px;font-weight:600;letter-spacing:-.01em}
.shareHead p{font-size:13px;color:var(--soft);margin-top:3px;line-height:1.5}
.opt{margin:12px 14px 0;border:1.5px solid var(--line);border-radius:14px;overflow:hidden}
.opt.sel{border-color:var(--ink)}
.optq{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:2px;background:var(--line)}
.optq .oc{position:relative;aspect-ratio:9/16;overflow:hidden;background:var(--surface)}
.optq img{width:100%;height:100%;object-fit:cover;display:block}
.optq .on2{position:absolute;left:5px;bottom:5px;background:rgba(17,17,17,.82);color:#fff;
  font-size:9.5px;padding:3px 6px;border-radius:6px;max-width:calc(100% - 10px);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.optbar{display:flex;align-items:center;gap:9px;padding:10px 12px}
.optbar .lb{font-size:15px;font-weight:600}
.optbar .rd{margin-left:auto;width:22px;height:22px;border-radius:50%;
  border:1.5px solid var(--line)}
.opt.sel .optbar .rd{border-color:var(--ink);background:var(--ink);
  box-shadow:inset 0 0 0 4px #fff}
.cmt{margin:16px 14px 0}
.cmt input{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);
  padding:0 14px;font-size:15px;background:var(--surface)}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(var(--safeB) + 88px);transform:translateX(-50%) translateY(14px);
  background:rgba(17,17,17,.93);color:#fff;font-size:13.5px;padding:11px 18px;border-radius:var(--r-pill);
  z-index:200;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);max-width:82vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* 첫 안내 */
.coach{position:fixed;inset:0;z-index:150;background:rgba(0,0,0,.72);display:none;
  align-items:center;justify-content:center;padding:34px}
.coach.on{display:flex}
.coachcard{background:#fff;border-radius:18px;padding:24px 22px;max-width:330px;text-align:center}
.coachcard h3{font-size:18px;margin-bottom:10px}
.coachcard p{font-size:14px;line-height:1.65;color:var(--soft);margin-bottom:18px}
.coachcard b{color:var(--ink)}
.coachcard button{width:100%;height:46px;border-radius:var(--r-pill);background:var(--ink);
  color:#fff;font-size:15px;font-weight:600}
</style>
</head>
<body>

<!-- ══ 1 · 보관함 ══ -->
<section class="screen on" id="s-lib">
  <div class="top">
    <span class="ttl">보관함</span>
    <span class="sub" id="lib-count"></span>
    <span class="r">
      <button class="tbtn" onclick="go('s-pools')" title="내 조합"><svg class="icon sm" viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg></button>
      <button class="tbtn" onclick="pickFiles()" title="사진 올리기"><svg class="icon" viewBox="0 0 24 24"><path d="M12 5l0 14"/><path d="M5 12l14 0"/></svg></button>
    </span>
  </div>
  <div class="body"><div class="grid" id="lib-grid"></div></div>
  <div class="bottom">
    <button class="pri" onclick="startPick()">조합 만들기</button>
  </div>
</section>

<!-- ══ 2 · 고르기 ══ -->
<section class="screen" id="s-pick">
  <div class="top">
    <button class="tlink dim" onclick="cancelPick()">취소</button>
    <span class="r" style="margin-left:auto">
      <span class="sub" id="pick-count">0 / 4</span>
    </span>
  </div>
  <div class="body"><div class="grid" id="pick-grid"></div></div>
  <div class="bottom">
    <button class="pri" id="pick-go" disabled onclick="buildPool()">네 장을 고르세요</button>
  </div>
</section>

<!-- ══ 3 · 조합 ══ -->
<section class="screen" id="s-pool">
  <div class="top">
    <button class="tbtn" onclick="leavePool()"><svg class="icon" viewBox="0 0 24 24"><path d="M5 12l14 0"/><path d="M5 12l6 6"/><path d="M5 12l6 -6"/></svg></button>
    <span class="ttl" id="pool-name">새 조합</span>
    <span class="r">
      <button class="tlink" onclick="savePool()" id="pool-save">저장</button>
    </span>
  </div>
  <div class="quadwrap"><div class="quad" id="quad"></div></div>
  <div class="poolbar">
    <button class="pill star" id="btn-star" onclick="toggleStar()"><svg class="icon" viewBox="0 0 24 24" style="width:40px;height:40px;fill:#fff;stroke:none"><path d="M12 17.75l-6.172 3.245l1.179 -6.873l-5 -4.867l6.9 -1l3.086 -6.253l3.086 6.253l6.9 1l-5 4.867l1.179 6.873z"/></svg><span>별표</span></button>
    <span class="grow"></span>
    <button class="pill" onclick="reshuffle()"><svg class="icon sm" viewBox="0 0 24 24"><path d="M9 14l-4 -4l4 -4"/><path d="M5 10h11a4 4 0 1 1 0 8h-1"/></svg><span>다시 섞기</span></button>
    <button class="pill" onclick="go('s-share')"><svg class="icon" viewBox="0 0 440 440" style="width:20.4px;height:20.4px"><path fill-rule="evenodd" clip-rule="evenodd" fill="currentColor" stroke="currentColor" stroke-width="14" d="M209.153 64.1427C103.968 99.2527 16.3381 128.95 14.4201 130.135C2.10005 137.749 -3.27895 154.579 2.05305 168.829C6.37305 180.375 6.09705 180.202 93.0961 226.092L171.667 267.536L213.513 346.592C236.768 390.525 256.849 427.298 258.713 429.362C260.557 431.404 264.8 434.442 268.142 436.112C273.212 438.645 275.404 439.148 281.381 439.148C291.893 439.148 297.231 436.971 304.486 429.727L310.572 423.648L374.902 230.648C444.848 20.8007 441.27 32.7927 437.403 21.1477C434.964 13.8037 425.59 4.2337 418.471 1.8187C406.609 -2.2033 418.703 -5.8043 209.153 64.1427ZM220.218 94.5347C117.819 128.697 33.8281 156.873 33.5721 157.148C33.1861 157.562 155.726 222.952 174.993 232.614L180.907 235.579L218.153 198.444C250.723 165.97 255.874 161.22 259.184 160.61C272.602 158.136 283.255 171.572 277.292 183.448C276.408 185.208 259.491 202.898 239.698 222.76L203.712 258.871L241.439 330.26C262.188 369.523 279.858 402.764 280.705 404.127C282.183 406.505 284.792 398.968 344.552 219.69C378.82 116.886 406.755 32.6947 406.629 32.5977C406.502 32.5007 322.618 60.3727 220.218 94.5347Z"/></svg><span>공유</span></button>
  </div>
</section>

<!-- ══ 4 · 내 조합들 ══ -->
<section class="screen" id="s-pools">
  <div class="top">
    <button class="tbtn" onclick="go('s-lib')"><svg class="icon" viewBox="0 0 24 24"><path d="M5 12l14 0"/><path d="M5 12l6 6"/><path d="M5 12l6 -6"/></svg></button>
    <span class="ttl">내 조합</span>
    <span class="r"><button class="tlink" onclick="startPick()">＋ 새로</button></span>
  </div>
  <div class="body"><div class="plist" id="pool-list"></div></div>
  <div class="bottom">
    <button class="pri" onclick="go('s-share')">디자이너에게 보내기</button>
  </div>
</section>

<!-- ══ 5 · 공유 뷰 ══ -->
<section class="screen" id="s-share">
  <div class="top">
    <button class="tbtn" onclick="go('s-pools')"><svg class="icon" viewBox="0 0 24 24"><path d="M5 12l14 0"/><path d="M5 12l6 6"/><path d="M5 12l6 -6"/></svg></button>
    <span class="ttl">보내기 미리보기</span>
  </div>
  <div class="body">
    <div class="shareHead">
      <h2>어느 쪽이 좋으세요?</h2>
      <p>받는 사람이 보게 될 화면입니다. 가입 없이 열리고, 하나를 고른 뒤 한 줄만 남기면 됩니다.</p>
    </div>
    <div id="share-opts"></div>
    <div class="cmt"><input id="share-cmt" placeholder="한 줄 남기기 — 예: B의 등 라인이 제일 좋아요"></div>
    <div style="height:26px"></div>
  </div>
  <div class="bottom">
    <button class="pri" onclick="toast('프로토타입에서는 여기까지입니다')">보내기</button>
  </div>
</section>

<!-- 셀 프레이밍 -->
<div class="zoomwrap" id="zoomwrap">
  <div class="zoomstage" id="zoomstage"><img id="zoomimg" alt=""></div>
  <div class="zoomhint">두 손가락으로 확대 · 끌어서 위치</div>
  <div class="zoombar">
    <span class="t">프레이밍</span>
    <button class="d" onclick="closeZoom()">완료</button>
  </div>
</div>

<!-- 마킹 -->
<div class="markwrap" id="markwrap">
  <div class="markstage" id="markstage">
    <div class="holder" id="markholder">
      <img id="markimg" alt="">
      <svg id="marksvg" preserveAspectRatio="none"></svg>
    </div>
  </div>
  <div class="markbar">
    <div class="markrow">
      <input class="markinput" id="markinput" maxlength="70" placeholder="한 줄로 — 예: 상반신만 보시면 돼요">
    </div>
    <div class="markrow">
      <button class="mbtn" onclick="markUndo()"><svg class="icon sm" viewBox="0 0 24 24"><path d="M9 14l-4 -4l4 -4"/><path d="M5 10h11a4 4 0 1 1 0 8h-1"/></svg><span>되돌리기</span></button>
      <button class="mbtn" onclick="markClear()"><svg class="icon sm" viewBox="0 0 24 24"><path d="M4 7l16 0"/><path d="M10 11l0 6"/><path d="M14 11l0 6"/><path d="M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2 -2l1 -12"/><path d="M9 7v-3a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v3"/></svg></button>
      <span class="grow"></span>
      <button class="mbtn" onclick="markCancel()">취소</button>
      <button class="mbtn pri2" onclick="markSave()">완료</button>
    </div>
    <p class="mhint">손가락으로 사진 위에 그리세요. 글은 없어도 됩니다.</p>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="coach" id="coach">
  <div class="coachcard">
    <h3>네 장을 골라 조합을 만듭니다</h3>
    <p>고른 <b>순서대로</b> 왼쪽 위부터 채워집니다.<br>
       셀을 <b>탭하면</b> 확대해서 프레임을 잡고,<br>
       <b>길게 누르면</b> 그 위에 표시할 수 있습니다.</p>
    <button onclick="document.getElementById('coach').classList.remove('on')">시작</button>
  </div>
</div>

<input type="file" id="filein" accept="image/*" multiple style="display:none">

<script>

/* ═══ 상태 ═══════════════════════════════════════════════ */
/* 시드는 여덟 장만 둡니다. 서른 장을 박아넣으면 파일이 3MB가 되고,
   public 저장소에 올리는 순간 그 사진들이 전부 공개됩니다.
   질감·직물·장식 위주로 골랐습니다 — 드레스 대화에 맞는 재료들. */
const SEED_KEYS = ['fabriccave','petals','marbled','duvet','coralglass','chandelier','glasscanopy','terracotta'];
let LIB = [];                 // {id, src}
let POOLS = [];               // {id,name,cells:[{img,z,ox,oy,marks:[{d,text}]}],star,made}
let CUR = null;               // 편집 중인 조합
let PICK = [];                // 고른 순서
let CURCELL = -1;

const $ = id => document.getElementById(id);
const uid = () => Math.random().toString(36).slice(2, 9);

/* ═══ 저장 — 이미지는 IndexedDB, 조합은 localStorage ══════
   사진 15장을 data URL로 localStorage에 넣으면 5MB 한도에서 바로 터집니다.
   시연 도중 저장이 실패하는 것이 가장 나쁜 결과라 IDB를 씁니다. */
let db = null;
function openDB(){
  return new Promise(res => {
    const r = indexedDB.open('ari-pool', 1);
    r.onupgradeneeded = e => e.target.result.createObjectStore('imgs', {keyPath:'id'});
    r.onsuccess = e => { db = e.target.result; res(); };
    r.onerror = () => res();          // 실패해도 세션 안에서는 동작
  });
}
function putImg(rec){ try{ db && db.transaction('imgs','readwrite').objectStore('imgs').put(rec); }catch(e){} }
function allImgs(){
  return new Promise(res => {
    if(!db) return res([]);
    try{
      const rq = db.transaction('imgs','readonly').objectStore('imgs').getAll();
      rq.onsuccess = () => res(rq.result || []);
      rq.onerror = () => res([]);
    }catch(e){ res([]); }
  });
}
const savePools = () => { try{ localStorage.setItem('ari-pools', JSON.stringify(POOLS)); }catch(e){} };
const loadPools = () => { try{ POOLS = JSON.parse(localStorage.getItem('ari-pools')||'[]'); }catch(e){ POOLS=[]; } };

/* ═══ 화면 ═══════════════════════════════════════════════ */
function go(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id));
  if(id === 's-lib')   renderLib();
  if(id === 's-pools') renderPools();
  if(id === 's-share') renderShare();
}
let tT;
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(tT); tT = setTimeout(() => t.classList.remove('on'), 2100);
}

/* ═══ 사진 올리기 ════════════════════════════════════════
   묻지 않습니다. 고른 순간 전부 들어옵니다 — 폴더도, 캡션도, 분류도 없이.
   여기에 질문이 하나라도 붙으면 어제와 같은 이탈이 납니다. */
function pickFiles(){ $('filein').click(); }
$('filein').addEventListener('change', async e => {
  const files = [...e.target.files];
  if(!files.length) return;
  toast(files.length + '장 불러오는 중…');
  for(const f of files){
    try{
      const src = await downscale(f, 1400);
      const rec = {id: uid(), src};
      LIB.unshift(rec); putImg(rec);
    }catch(err){}
  }
  e.target.value = '';
  renderLib();
  toast(files.length + '장 들어왔습니다');
});
/* 폰 사진은 4000px가 넘습니다. 그대로 두면 조합 화면에서 네 장이 동시에
   디코드되며 버벅입니다. 긴 변 1400이면 시연에 충분합니다. */
function downscale(file, max){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => {
      const im = new Image();
      im.onload = () => {
        const r = Math.min(1, max / Math.max(im.width, im.height));
        const c = document.createElement('canvas');
        c.width = Math.round(im.width * r); c.height = Math.round(im.height * r);
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', .82));
      };
      im.onerror = rej; im.src = fr.result;
    };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}

/* ═══ 보관함 ═════════════════════════════════════════════ */
function srcOf(id){ const r = LIB.find(x => x.id === id); return r ? r.src : ''; }
function renderLib(){
  $('lib-count').textContent = LIB.length + '장';
  $('lib-grid').innerHTML = LIB.length
    ? LIB.map(r => `<div class="cell"><img src="${r.src}" alt=""></div>`).join('')
    : '';
  if(!LIB.length){
    $('lib-grid').innerHTML =
      `<div class="empty" style="grid-column:1/4"><b>비어 있습니다</b>
       오른쪽 위 ＋ 로 폰 사진을 여러 장 한 번에 올리세요.</div>`;
  }
}

/* ═══ 고르기 — 탭 순서가 곧 배치 순서 ════════════════════ */
function startPick(){ PICK = []; renderPick(); go('s-pick'); }
function cancelPick(){ PICK = []; go('s-lib'); }
function renderPick(){
  $('pick-grid').innerHTML = LIB.map(r => {
    const i = PICK.indexOf(r.id);
    return `<div class="cell ${i>=0?'on':''}" onclick="tapPick('${r.id}')">
      <img src="${r.src}" alt="">
      <span class="pick">${i>=0 ? i+1 : ''}</span></div>`;
  }).join('');
  $('pick-count').textContent = PICK.length + ' / 4';
  const b = $('pick-go');
  b.disabled = PICK.length !== 4;
  b.textContent = PICK.length === 4 ? '조합 만들기' : `네 장을 고르세요 (${PICK.length}/4)`;
}
function tapPick(id){
  const i = PICK.indexOf(id);
  if(i >= 0) PICK.splice(i, 1);
  else { if(PICK.length >= 4){ toast('네 장까지입니다'); return; } PICK.push(id); }
  renderPick();
}
function buildPool(){
  CUR = { id: uid(), name: '조합 ' + (POOLS.length + 1),
          cells: PICK.map(im => ({img: im, z: 1, ox: 0, oy: 0, marks: []})),
          star: false, made: Date.now(), saved: false };
  openPool();
}

/* ═══ 조합 화면 ══════════════════════════════════════════ */
function openPool(){
  $('pool-name').textContent = CUR.name;
  $('btn-star').classList.toggle('on', !!CUR.star);
  $('pool-save').textContent = CUR.saved ? '완료' : '저장';
  renderQuad();
  go('s-pool');
  if(!localStorage.getItem('ari-coach')){
    $('coach').classList.add('on');
    localStorage.setItem('ari-coach', '1');
  }
}
function renderQuad(){
  $('quad').innerHTML = CUR.cells.map((c, i) => `
    <div class="qc" data-i="${i}">
      <div class="inner">
        <img src="${srcOf(c.img)}" alt=""
             style="transform:translate(-50%,-50%) translate(${c.ox}px,${c.oy}px) scale(${c.z})">
      </div>
      <span class="num">${i+1}</span>
      <button class="pen" onclick="event.stopPropagation();openMark(${i})"><svg class="icon sm" viewBox="0 0 24 24"><path d="M4 20h4l10.5 -10.5a1.5 1.5 0 0 0 -4 -4l-10.5 10.5v4"/><path d="M13.5 6.5l4 4"/></svg></button>
      <svg class="ink" viewBox="0 0 100 100" preserveAspectRatio="none">
        ${c.marks.map(m => `<path d="${m.d}"/>`).join('')}
      </svg>
      ${c.marks.filter(m => m.text).length
        ? `<div class="note">${esc(c.marks.filter(m=>m.text).map(m=>m.text).join(' · '))}</div>` : ''}
    </div>`).join('');
  [...document.querySelectorAll('#quad .qc')].forEach(el => bindCell(el));
}
const esc = s => (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* 탭 = 프레이밍, 길게 누름 = 마킹.
   거리가 아니라 시간으로 나눕니다 — 셀 안에서는 드래그가 곧 프레이밍이라
   "움직였으면 드래그"라는 규칙을 쓸 수 없습니다. */
function bindCell(el){
  const i = +el.dataset.i;
  let t0 = 0, timer = null, moved = false, sx = 0, sy = 0;
  el.addEventListener('pointerdown', e => {
    t0 = Date.now(); moved = false; sx = e.clientX; sy = e.clientY;
    timer = setTimeout(() => { if(!moved){ navigator.vibrate && navigator.vibrate(12); openMark(i); } }, 420);
  });
  el.addEventListener('pointermove', e => {
    if(Math.hypot(e.clientX - sx, e.clientY - sy) > 9){ moved = true; clearTimeout(timer); }
  });
  const end = () => {
    clearTimeout(timer);
    if(!moved && Date.now() - t0 < 420) openZoom(i);
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', () => clearTimeout(timer));
}

function toggleStar(){
  CUR.star = !CUR.star;
  $('btn-star').classList.toggle('on', CUR.star);
  if(CUR.saved){ syncPool(); savePools(); }
}
function reshuffle(){
  const pool = LIB.map(r => r.id);
  if(pool.length < 4){ toast('사진이 네 장 이상 필요합니다'); return; }
  const pickd = [];
  while(pickd.length < 4){
    const c = pool[Math.floor(Math.random() * pool.length)];
    if(!pickd.includes(c)) pickd.push(c);
  }
  CUR.cells = pickd.map(im => ({img: im, z: 1, ox: 0, oy: 0, marks: []}));
  renderQuad();
  toast('새로 섞었습니다');
}
function syncPool(){
  const i = POOLS.findIndex(p => p.id === CUR.id);
  if(i >= 0) POOLS[i] = JSON.parse(JSON.stringify(CUR));
}
function savePool(){
  if(!CUR.saved){ CUR.saved = true; POOLS.unshift(JSON.parse(JSON.stringify(CUR))); }
  else syncPool();
  savePools();
  $('pool-save').textContent = '완료';
  toast('저장했습니다');
  setTimeout(() => go('s-pools'), 420);
}
function leavePool(){ go(CUR && CUR.saved ? 's-pools' : 's-lib'); }

/* ═══ 프레이밍 — 핀치줌 ══════════════════════════════════
   스크린샷의 인스타 헤더·좋아요 버튼은 잘라내는 게 아니라
   프레임 밖으로 밀어내면 됩니다. 에디터가 필요 없습니다. */
let zi = -1, zst = null;
function openZoom(i){
  zi = i; const c = CUR.cells[i];
  const im = $('zoomimg'); im.src = srcOf(c.img);
  im.onload = () => {
    const st = $('zoomstage'), r = st.getBoundingClientRect();
    const base = Math.max(r.width / im.naturalWidth, r.height / im.naturalHeight);
    zst = {base, z: c.z, ox: c.ox, oy: c.oy, w: im.naturalWidth, h: im.naturalHeight};
    applyZoom();
  };
  $('zoomwrap').classList.add('on');
}
function applyZoom(){
  const im = $('zoomimg');
  im.style.width = (zst.w * zst.base) + 'px';
  im.style.height = (zst.h * zst.base) + 'px';
  im.style.transform = `translate(-50%,-50%) translate(${zst.ox}px,${zst.oy}px) scale(${zst.z})`;
}
function closeZoom(){
  const c = CUR.cells[zi];
  c.z = zst.z; c.ox = zst.ox; c.oy = zst.oy;
  $('zoomwrap').classList.remove('on');
  renderQuad();
  if(CUR.saved){ syncPool(); savePools(); }
}
(function(){
  const st = $('zoomstage');
  const pts = new Map(); let d0 = 0, z0 = 1, mx = 0, my = 0;
  st.addEventListener('pointerdown', e => { st.setPointerCapture(e.pointerId); pts.set(e.pointerId, e); });
  st.addEventListener('pointermove', e => {
    if(!pts.has(e.pointerId) || !zst) return;
    const prev = pts.get(e.pointerId); pts.set(e.pointerId, e);
    const arr = [...pts.values()];
    if(arr.length === 1){
      zst.ox += e.clientX - prev.clientX; zst.oy += e.clientY - prev.clientY; applyZoom();
    } else if(arr.length === 2){
      const d = Math.hypot(arr[0].clientX - arr[1].clientX, arr[0].clientY - arr[1].clientY);
      if(!d0){ d0 = d; z0 = zst.z; }
      zst.z = Math.max(1, Math.min(5, z0 * (d / d0))); applyZoom();
    }
  });
  const up = e => { pts.delete(e.pointerId); if(pts.size < 2) d0 = 0; };
  st.addEventListener('pointerup', up); st.addEventListener('pointercancel', up);
})();

/* ═══ 마킹 — 그 조합에서 이 부분을 봐 달라 ═══════════════
   마크는 이미지가 아니라 조합에 붙습니다. 같은 사진이 A조합에서는
   "상반신만", B조합에서는 "뒷태 라인"일 수 있기 때문입니다. */
let mi = -1, mpaths = [], mcur = null;
function openMark(i){
  mi = i; const c = CUR.cells[i];
  mpaths = c.marks.map(m => m.d);
  $('markimg').src = srcOf(c.img);
  $('markinput').value = c.marks.map(m => m.text).filter(Boolean)[0] || '';
  drawMarks();
  $('markwrap').classList.add('on');
}
function drawMarks(){
  $('marksvg').innerHTML = mpaths.map(d => `<path d="${d}"/>`).join('');
}
(function(){
  const st = $('markstage'), holder = $('markholder');
  let drawing = false, pts = [];
  const rel = e => {
    const r = holder.getBoundingClientRect();
    return [ ((e.clientX - r.left) / r.width * 100).toFixed(1),
             ((e.clientY - r.top)  / r.height * 100).toFixed(1) ];
  };
  st.addEventListener('pointerdown', e => {
    drawing = true; pts = [rel(e)];
    mcur = 'M' + pts[0][0] + ',' + pts[0][1];
    mpaths.push(mcur); drawMarks();
    st.setPointerCapture(e.pointerId);
  });
  st.addEventListener('pointermove', e => {
    if(!drawing) return;
    const p = rel(e), last = pts[pts.length - 1];
    if(Math.abs(p[0]-last[0]) < .6 && Math.abs(p[1]-last[1]) < .6) return;
    pts.push(p);
    mpaths[mpaths.length - 1] += ' L' + p[0] + ',' + p[1];
    drawMarks();
  });
  const stop = () => { drawing = false; };
  st.addEventListener('pointerup', stop); st.addEventListener('pointercancel', stop);
})();
function markUndo(){ mpaths.pop(); drawMarks(); }
function markClear(){ mpaths = []; drawMarks(); }
function markCancel(){ $('markwrap').classList.remove('on'); }
function markSave(){
  const txt = $('markinput').value.trim();
  const c = CUR.cells[mi];
  /* 도형 여러 개가 문장 하나를 가리키는 경우가 실제로 있었습니다.
     그래서 텍스트는 첫 도형에만 붙이고 나머지는 도형만 남깁니다. */
  c.marks = mpaths.map((d, k) => ({d, text: k === 0 ? txt : ''}));
  if(!mpaths.length && txt) c.marks = [{d:'', text: txt}];
  $('markwrap').classList.remove('on');
  renderQuad();
  if(CUR.saved){ syncPool(); savePools(); }
}

/* ═══ 내 조합들 ══════════════════════════════════════════ */
function renderPools(){
  if(!POOLS.length){
    $('pool-list').innerHTML =
      `<div class="empty"><b>아직 조합이 없습니다</b>보관함에서 네 장을 골라 시작하세요.</div>`;
    return;
  }
  const sorted = [...POOLS].sort((a,b) => (b.star?1:0)-(a.star?1:0) || b.made-a.made);
  $('pool-list').innerHTML = sorted.map((p, k) => {
    const notes = p.cells.flatMap(c => c.marks.map(m => m.text)).filter(Boolean);
    return `<div class="pcard ${p.star?'star':''}" onclick="openSaved('${p.id}')">
      <div class="pmini">${p.cells.map(c => `<img src="${srcOf(c.img)}" alt="">`).join('')}</div>
      <div class="pmeta">
        <div class="nm">${String.fromCharCode(65+k)} · ${esc(p.name)} ${p.star?'★':''}</div>
        <div class="dt">${new Date(p.made).toLocaleDateString('ko-KR',{month:'long',day:'numeric'})}</div>
        ${notes.length ? `<div class="mk">${esc(notes.join(' · '))}</div>` : ''}
      </div>
      <span class="chev"><svg class="icon sm" viewBox="0 0 24 24"><path d="M9 6l6 6l-6 6"/></svg></span></div>`;
  }).join('');
}
function openSaved(id){
  CUR = JSON.parse(JSON.stringify(POOLS.find(p => p.id === id)));
  openPool();
}

/* ═══ 공유 미리보기 ══════════════════════════════════════
   받는 사람이 하는 일은 고르는 것이지 편집하는 것이 아닙니다.
   그래서 코멘트는 이미지가 아니라 조합 하나에 붙습니다. */
let SEL = null;
function renderShare(){
  const list = [...POOLS].sort((a,b) => (b.star?1:0)-(a.star?1:0) || b.made-a.made).slice(0, 3);
  if(!list.length){
    $('share-opts').innerHTML = `<div class="empty">보낼 조합이 없습니다</div>`; return;
  }
  $('share-opts').innerHTML = list.map((p, k) => `
    <div class="opt ${SEL===p.id?'sel':''}" onclick="SEL='${p.id}';renderShare()">
      <div class="optq">${p.cells.map(c => {
        const t = c.marks.map(m=>m.text).filter(Boolean)[0];
        return `<div class="oc"><img src="${srcOf(c.img)}" alt="">
                ${t ? `<span class="on2">${esc(t)}</span>` : ''}</div>`;
      }).join('')}</div>
      <div class="optbar"><span class="lb">${String.fromCharCode(65+k)}</span>
        <span class="sub">${esc(p.name)}</span><span class="rd"></span></div>
    </div>`).join('');
}

/* ═══ 시작 ═══════════════════════════════════════════════ */
(async function(){
  await openDB();
  loadPools();
  const mine = await allImgs();
  /* 씨앗 38장을 먼저 깔아둡니다 — 앱을 열자마자 조합을 만들 수 있어야
     "몇 초 걸리는가"를 잴 수 있습니다. 올린 사진은 그 위에 쌓입니다. */
  LIB = mine.concat(SEED_KEYS.map(k => ({id: 'seed-' + k, src: IMG[k]})));
  renderLib();
})();
</script>
