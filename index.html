<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>ari — beta prototype</title>
<style>
:root{
  --bg:#FFFFFF; --surface:#F2F2F2; --ink:#111111; --soft:#8A8A8E; --line:#ECECEC;
  --mark:#325788; --amber:#D9A45A; --r-pill:999px; --r-card:20px; --r-img:6px;
  --indigo:#3F51B5;
  --shadow-float:0 8px 30px rgba(0,0,0,.12);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:#ECEAE6; font-family:-apple-system,"SF Pro Text",Inter,"Helvetica Neue",sans-serif;
  display:flex; align-items:center; justify-content:center; min-height:100vh; padding:28px 0; color:var(--ink);
}
button{font-family:inherit;border:0;background:none;cursor:pointer;color:inherit}
input,textarea{font-family:inherit;border:0;outline:none;background:transparent;color:var(--ink)}
::placeholder{color:#B8B8BC}
b,strong{font-weight:600}

/* ============ phone frame ============ */
.phone{
  position:relative; width:390px; height:844px; background:var(--bg); border-radius:48px; overflow:hidden;
  box-shadow:0 0 0 10px #111, 0 0 0 12px #3a3a3a, 0 24px 80px rgba(0,0,0,.25);
  flex:none;
}
.statusbar{
  position:absolute; top:0; left:0; right:0; height:48px; z-index:60; pointer-events:none;
  display:flex; align-items:flex-end; justify-content:space-between; padding:0 30px 4px;
  font-size:15px; font-weight:500;
  background:var(--bg);
}
.statusbar .sicons{display:flex; align-items:center; gap:6px}
.screen.dark ~ .statusbar{color:#fff}
.phone.darkbar .statusbar{color:#fff; background:#0d0d0d}

/* ============ app / screens ============ */
.app{position:absolute; inset:0; overflow:hidden}
.screen{position:absolute; inset:0; background:var(--bg); opacity:0; visibility:hidden;
  content-visibility:hidden;                 /* skip layout+paint+decode when off screen */
  transition:opacity .3s ease, visibility .3s ease}
.screen.active{opacity:1; visibility:visible; content-visibility:visible}
/* search opens as a sheet sliding up from the bottom */
#scr-search.active{animation:searchSlideUp .34s cubic-bezier(.22,.61,.36,1)}
@keyframes searchSlideUp{from{transform:translateY(100%);opacity:.4}to{transform:translateY(0);opacity:1}}
.screen.dark{background:#0d0d0d; color:#fff}
.scrollpage{position:absolute; inset:0; overflow-y:auto; scrollbar-width:none}
.scrollpage::-webkit-scrollbar{display:none}

.icon{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
.icon.sm{width:18px;height:18px}
.icon.xs{width:15px;height:15px}

/* top bar (feed) */
.topbar{
  position:sticky; top:0; z-index:20; display:flex; align-items:center; justify-content:space-between;
  padding:72px 20px 14px; background:var(--bg);
}
.logo{display:flex;align-items:center}
.bellbtn{position:relative; padding:4px}
.bellbtn .dot{position:absolute; top:2px; right:0; width:4.8px; height:4.8px; border-radius:50%; background:var(--mark)}

/* reflection banner */
.feed-reflection-banner{
  margin:4px 16px 12px; background:#161616; color:#fff; border-radius:14px; padding:8px 10px 8px 8px;
  display:flex; align-items:center; gap:9px; cursor:pointer;
}
.frb-moon{width:30px;height:30px;border-radius:9px;background:#262626;display:flex;align-items:center;justify-content:center;font-size:14px;flex:none}
.frb-moon svg{width:18px;height:18px;display:block}
.frb-moon svg path{fill:#fff}
.frb-t{font-size:14px;font-weight:500}
.frb-s{font-size:12px;color:#9a9a9a}
.frb-go{margin-left:auto;background:#fff;color:#111;font-size:12px;font-weight:600;padding:6px 13px;border-radius:var(--r-pill);flex:none}
.frb-x{color:#8a8a8a;font-size:13px;line-height:1;padding:4px;flex:none}

/* masonry feed — true Pinterest-style, natural aspect ratios */
.masonry{columns:2; column-gap:3px; padding:0 3px 120px}
.tile{break-inside:avoid; margin-bottom:3px; cursor:pointer; display:block}
.tile .ph{position:relative; overflow:hidden; background:var(--surface); border-radius:6px}
.tile .ph img{width:100%; height:auto; display:block}
.tile .ph img{transition:transform .22s cubic-bezier(.3,.7,.4,1)}
.tile .cap{padding:8px 2px 0}
.title-row{display:flex; align-items:center; justify-content:space-between; gap:6px}
.title-row .t{font-size:15px; font-weight:500; letter-spacing:-.2px}
.spark-inline{color:#9a9a9e; flex:none; width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.spark-inline.on{background:var(--amber); color:#fff}
.tile .sub{font-size:13px; color:var(--soft); margin-top:2px}

/* bottom nav */
.bottomnav{
  position:absolute; bottom:22px; left:50%; transform:translateX(-50%); z-index:40;
  display:flex; align-items:center; gap:10px;
}
.nav-pill{
  background:rgba(255,255,255,.28);
  backdrop-filter:blur(24px) saturate(180%); -webkit-backdrop-filter:blur(24px) saturate(180%);
  border:1px solid rgba(255,255,255,.45);
  border-radius:var(--r-pill); box-shadow:var(--shadow-float), inset 0 1px 0 rgba(255,255,255,.5);
  display:flex; align-items:center; gap:6px; padding:8px 16px; height:64px;
  isolation:isolate;
}
.navbtn{width:46px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#111;transition:background .18s ease}
.navbtn.on{background:rgba(255,255,255,.32);color:#111}
.nav-av{width:34px;height:34px;border-radius:50%;display:block}
.navbtn.avbtn.on .nav-av{box-shadow:0 0 0 2px #fff,0 0 0 3.5px #111}
.nav-fab{
  width:64px;height:64px;border-radius:50%;
  background:rgba(22,22,22,.4);
  backdrop-filter:blur(20px) saturate(160%); -webkit-backdrop-filter:blur(20px) saturate(160%);
  border:1px solid rgba(255,255,255,.25);
  color:#fff;flex:none;
  display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-float), inset 0 1px 0 rgba(255,255,255,.2);
}
.nav-fab .icon{width:28px;height:28px;stroke-width:1.6}

/* ============ plop detail ============ */
.dethead{display:flex;align-items:center;gap:12px;padding:72px 16px 18px;position:relative}
.backbtn{width:44px;height:44px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;flex:none}
.dethead .ttl{position:absolute;left:0;right:0;text-align:center;font-size:15px;color:var(--soft);pointer-events:none}
.dethead .ttl.b{color:var(--ink);font-weight:500}
.author{display:flex;align-items:center;gap:9px;padding:6px 20px 14px}
.av{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:500;font-size:15px;flex:none}
.av.sm{width:24px;height:24px;font-size:10px;border:2px solid #fff}
.g0{background:linear-gradient(160deg,#1d3a5f,#6f93b4)} .g1{background:linear-gradient(165deg,#d8c9a8,#a58c66)}
.g2{background:linear-gradient(150deg,#c9a36a,#eadfca)} .g3{background:linear-gradient(160deg,#2b2b2e,#6e6e74)}
.g4{background:linear-gradient(155deg,#5c6b52,#cfd6c0)} .g5{background:linear-gradient(150deg,#a3543d,#e8c3b2)}
.g6{background:linear-gradient(160deg,#10182b,#3c4f7a)} .g7{background:linear-gradient(160deg,#efece6,#cfc8ba)}
.g8{background:linear-gradient(160deg,#7fa8a0,#dcebe6)} .g9{background:linear-gradient(160deg,#5a5a86,#cdaec6)}
.author .nm{font-size:15px;font-weight:600}
.author .hd{font-size:13px;color:var(--soft)}
.author .when{margin-left:auto;font-size:12px;color:var(--soft)}
.hero{position:relative;margin:4px 0 14px;background:var(--surface);border-radius:0}
.hero > img{border-radius:0;display:block;width:100%}
.hero img{width:100%;height:416px;object-fit:cover;display:block}
.marks-pill{
  position:absolute;top:12px;right:12px;background:rgba(70,70,72,.78);color:#fff;font-size:13px;font-weight:500;
  padding:8px 14px;border-radius:var(--r-pill);display:flex;align-items:center;gap:7px;backdrop-filter:blur(4px);
}
.marks-pill .rdot{width:12px;height:12px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center}
.marks-pill .rdot::after{content:'';width:6px;height:6px;border-radius:50%;background:var(--mark)}
.mark-dot{
  position:absolute;width:27px;height:27px;border-radius:50%;background:var(--mark);border:1.5px solid #fff;
  color:#fff;font-size:13px;font-weight:500;line-height:1;display:none;align-items:center;justify-content:center;
  transform:translate(-50%,-50%);box-shadow:0 2px 8px rgba(0,0,0,.3);
}
.hero.marks-on .mark-dot{display:flex}
/* reference-style mark: white dot on the point + dim pill holding the note text */
/* An absolutely positioned box with no width shrinks to fit whatever space is
   left between its `left` and the container edge — so a mark at 85% got 15% of
   the image to lay out in, wrapped after two words, and still ellipsised. The
   old max-width:70% never applied because the available space was always
   smaller. `width:max-content` lets the pill ask for what it needs first; the
   per-mark max-width (set in plopMarkEl) then trims it to the room that
   genuinely exists on the side it opens toward. */
.plop-mark{
  position:absolute; display:none; align-items:center; gap:7px; z-index:5;
  transform:translateY(-50%); width:max-content; min-width:0;
}
.plop-mark .pm-pill{min-width:0}
.hero.marks-on .plop-mark{display:flex}
.plop-mark.flip{flex-direction:row-reverse; transform:translate(-100%,-50%)}
.plop-mark .pm-dot{
  width:12px;height:12px;border-radius:50%;background:#fff;flex:none;
  box-shadow:0 0 0 3px rgba(0,0,0,.16), 0 1px 5px rgba(0,0,0,.45);
}
.plop-mark .pm-pill{
  display:flex; align-items:center; gap:6px; max-width:230px;
  background:rgba(28,28,30,.82); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
  color:#fff; font-size:13px; font-weight:500; line-height:1.3;
  padding:7px 12px; border-radius:14px; box-shadow:0 4px 16px rgba(0,0,0,.3);
}
.plop-mark.dotonly .pm-pill{display:none}
.plop-mark .pm-note{
  overflow:hidden; text-overflow:ellipsis; word-break:break-word;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
}
/* selected pill: dim bubble with an input + ONE small toolbar floating above it */
.plop-mark.editing{z-index:9}
.plop-mark.editing .pm-pill{position:relative;background:rgba(18,18,18,.95);padding:9px 13px;box-shadow:0 10px 30px rgba(0,0,0,.5);border-radius:14px;outline:2px solid rgba(255,255,255,.5);outline-offset:1px}
.plop-mark .pm-input{background:transparent;border:0;outline:none;color:#fff;font-size:13px;width:130px;min-width:60px}
.plop-mark .pm-input::placeholder{color:rgba(255,255,255,.5)}
.plop-mark .pm-bar{display:none}
.plop-mark.editing .pm-bar{
  display:flex;align-items:center;gap:6px;position:absolute;left:0;bottom:100%;margin-bottom:8px;
  background:#2b2b2e;border-radius:999px;padding:4px;box-shadow:0 4px 14px rgba(0,0,0,.45);
}
.plop-mark.editing.flip .pm-bar{left:auto;right:0}
.plop-mark.editing .pm-bar button{
  display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;
  background:transparent;color:#fff;border:0;padding:0;cursor:pointer;
}
.plop-mark.editing .pm-bar button:active{background:rgba(255,255,255,.14)}
.plop-mark.editing .pm-bar button svg{width:15px;height:15px;stroke:#fff}
.plop-mark.editing .pm-bar .pm-move{cursor:grab;touch-action:none}
.plop-mark.editing .pm-bar .pm-del svg{stroke:#ff6b60}
.plop-mark.editing .pm-bar .pm-vis.nv-public svg{stroke:#7FB0E8}
.plop-mark.editing .pm-bar .pm-vis.nv-noquote svg{stroke:#D9A45A}
/* inherited note inside a quote — credited to whoever wrote it.
   No input, no move, no visibility toggle: keep it or remove it. */
.plop-mark.locked .pm-note{opacity:.92}
/* Private marks carry NO fill — outline only, plus a lock. Solid means shared;
   see-through means it never leaves this screen. Colour is unusable here: these
   sit on arbitrary photographs, and any hue that reads on one vanishes on the
   next. The dot has to differ too — a collapsed mark used to be identical
   either way, which is the state people spend most of their time looking at. */
.plop-mark[data-vis="private"] .pm-pill{
  background:rgba(18,18,18,.22);
  border:1.5px solid rgba(255,255,255,.95);
  backdrop-filter:blur(2px);
}
.plop-mark[data-vis="private"] .pm-note{text-shadow:0 1px 3px rgba(0,0,0,.7)}
.plop-mark[data-vis="private"].editing .pm-pill{background:rgba(18,18,18,.9)}
.plop-mark[data-vis="private"] .pm-dot{
  background:transparent;
  border:2.5px solid #fff;
  box-shadow:0 0 0 3px rgba(0,0,0,.16), 0 1px 5px rgba(0,0,0,.45);
}
.pm-lock{display:inline-flex;align-items:center;margin-right:5px;opacity:.95;flex:none}
.pm-lock svg{width:11px;height:11px;stroke:#fff;display:block}
.dcl-presets{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 4px}
.dcl-preset{padding:8px 14px;border:1px solid #E4E4E4;border-radius:var(--r-pill);font-size:13px;
  font-weight:500;color:#4a4a4a;background:#fff;cursor:pointer}
.dcl-preset:active{background:#F2F2F2}
.dcl-row{display:flex;align-items:center;gap:10px;padding:12px 2px;border-bottom:1px solid #F2F2F2}
.dcl-row .nm{flex:1;font-size:15px;font-weight:500}
.dcl-row .x{color:#B8B8BC;background:none;padding:6px;cursor:pointer}
.dcl-note{font-size:12.5px;color:var(--soft);padding:10px 2px 0}
.stm-sec{font-size:11px;font-weight:600;letter-spacing:.9px;color:#a0a0a5;padding:18px 2px 6px}
.stm-row.is-hidden .stm-name{color:#a8a8ad}
.subtab-chip.unsorted{background:#fff;border:1px dashed #D2D2D2;color:#6b6b70}
.subtab-chip.unsorted.on{background:#161616;border-color:#161616;color:#fff}
.plop-mark.locked.editing .pm-pill{outline-color:rgba(255,255,255,.35)}
/* author credit inside the toolbar, immediately left of the delete button */
.plop-mark.locked .pm-bar-locked{padding-left:10px}
.plop-mark.locked .pm-by{
  font-size:12px;line-height:1;color:rgba(255,255,255,.5);
  white-space:nowrap;flex:none;padding-right:2px;
}
.plop-mark.locked.editing.zoomed:not(.lasso){transform:translate(-50%,-50%) scale(1.15) !important}
/* selecting a pin just shows its toolbar. Focusing the note input zooms the
   text form to the centre + dims the screen; a "Done" button commits it. */
.mark-dim{position:absolute;inset:0;background:rgba(0,0,0,.5);z-index:80;display:none}
.mark-dim.on{display:block}
.plop-mark.editing.zoomed:not(.lasso){position:fixed !important;left:50% !important;top:42% !important;transform:translate(-50%,-50%) scale(1.3) !important;max-width:300px !important;z-index:90 !important}
.plop-mark.editing.zoomed:not(.lasso).flip{flex-direction:row !important}
/* region (swipe) note: zoom just the note bubble to the centre */
.plop-mark.editing.zoomed.lasso .pm-pill{position:fixed !important;left:50% !important;top:42% !important;transform:translate(-50%,-50%) scale(1.3) !important;max-width:300px !important;z-index:90 !important}
.plop-mark.editing.zoomed .pm-bar{display:none}
.plop-mark.editing.zoomed .pm-dot{display:none}
/* floating Done button (top-right) while a note is zoomed */
.mark-done{position:absolute;top:72px;right:20px;height:44px;z-index:95;background:none;color:#fff;font-weight:600;font-size:15px;padding:0;display:none;align-items:center}
.mark-done.on{display:flex}
.mark-done:active{opacity:.6}
/* tap a marker in the detail view → bring it to front + emphasise (they overlap) */
.plop-mark.focused{z-index:20}
.plop-mark.focused .pm-pill{outline:2px solid rgba(255,255,255,.9);box-shadow:0 8px 26px rgba(0,0,0,.55)}
.plop-mark.focused .pm-dot{box-shadow:0 0 0 4px rgba(255,255,255,.55),0 1px 6px rgba(0,0,0,.5)}
/* freehand lasso region (kept, dim styling) */
.plop-mark.lasso{display:none;background:none;border:none;box-shadow:none;transform:none;max-width:none}
.hero.marks-on .plop-mark.lasso{display:block}
.plop-mark.lasso .lasso-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.plop-mark.lasso .lasso-path{fill:rgba(255,255,255,.12);stroke:#fff;stroke-width:2;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
.plop-mark.lasso .pm-pill{position:absolute;left:0;top:0;transform:translateY(calc(-100% - 8px));z-index:1}
.plop-mark.lasso.pill-below .pm-pill{top:100%;transform:translateY(8px)}
.plop-mark.lasso .pm-dot{display:none}
.actions{display:flex;align-items:center;gap:6px;padding:16px 20px 14px}
.actbtn{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink);position:relative;flex-grow:0;flex-basis:44px}
.actbtn.note-toggle{cursor:pointer;transition:flex-grow .22s ease, border-radius .22s ease, background .2s ease}
.actbtn.note-toggle .nt-tools{display:none}
.actbtn.note-toggle.open{flex-grow:1;border-radius:22px;background:#161616;color:#fff;justify-content:flex-start;padding:0 10px}
.actbtn.note-toggle.open .nt-collapsed{display:none}
.actbtn.note-toggle.open .nt-tools{display:flex;align-items:center;gap:8px;width:100%}
.actbtn.note-toggle .nt-tools svg{width:18px;height:18px}
.actbtn.note-toggle .nt-tools button{color:#fff;display:flex;padding:4px;border-radius:50%;flex:none}
.actbtn.note-toggle .nt-tools .push-right{margin-left:auto}
.actbtn.note-toggle .nt-tools button.on{background:#fff;color:#161616}
.actbtn.note-toggle .nt-tools button.dim{color:#8a8a8e}
.actbtn.note-toggle .nt-tools .tsep{width:1px;height:20px;background:#3c3c3c;flex:none}
.inline-notewrap{max-height:0;opacity:0;overflow:hidden;margin:0 20px 0;transition:max-height .28s ease, opacity .2s ease, margin .28s ease}
.inline-notewrap.open{max-height:640px;opacity:1;margin:0 20px 14px}
.plop-saverow{display:flex;align-items:center;gap:8px;margin-top:12px}
.plop-savepond{flex:1;min-width:0;display:flex;align-items:center;justify-content:space-between;gap:6px;background:#fff;border:1.5px solid #EDEDED;color:var(--ink);font-size:14px;font-weight:500;padding:11px 16px;border-radius:14px}
.plop-savepond span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plop-savepond .car{color:var(--soft);font-size:15px;flex:none}
.plop-savebtn{flex:none;background:#161616;color:#fff;font-size:14px;font-weight:600;padding:12px 22px;border-radius:14px}
.hero.armed{cursor:crosshair;touch-action:none;-webkit-user-select:none;user-select:none}
.hero.armed img{cursor:crosshair}
.actbtn.spark.on{background:var(--amber);color:#fff;box-shadow:0 0 0 6px rgba(217,164,90,.25)}
.actbtn.keep.on{background:#161616;color:#fff;box-shadow:0 0 0 6px rgba(0,0,0,.06)}
.actbtn.note-toggle.on{background:#161616;color:#fff;box-shadow:0 0 0 6px rgba(0,0,0,.06)}
.plop-title{padding:0 20px;font-size:18px;font-weight:600;letter-spacing:-.2px;line-height:1.35}
.plop-sub{padding:4px 20px 10px;font-size:13px;color:var(--soft);line-height:1.4}
.plop-place{padding:0 20px 14px}
.place-tag{display:inline-flex;align-items:center;gap:5px;background:var(--surface);color:var(--ink);font-size:13px;font-weight:500;padding:6px 12px;border-radius:var(--r-pill)}
.place-tag .icon{width:14px;height:14px}
.plop-desc{padding:0 20px 18px;font-size:15px;line-height:1.6}
.keptby{
  margin:0 16px 20px;background:var(--surface);border-radius:14px;padding:13px 16px;
  display:flex;align-items:center;gap:10px;cursor:pointer;font-size:14px;color:var(--ink);
}
.avstack{display:flex;flex:none}
.avstack .av.sm+.av.sm{margin-left:-8px}
.keptby .chev{margin-left:auto;color:#9a9a9e}
.notesbox{margin:0 16px 28px;border:1.5px dashed #DDDDDD;border-radius:16px;padding:18px}
.notesbox .nb-h{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:600;letter-spacing:1px;color:#6f6f73}
.notesbox .nb-h .only{font-weight:400;letter-spacing:0;color:var(--soft);text-transform:none;font-size:13px}
.note-item{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid #F0F0F0;font-size:14px;line-height:1.5}
.note-item:last-child{border-bottom:0;padding-bottom:2px}
.note-item .num{width:26px;height:26px;border-radius:50%;background:var(--mark);color:#fff;font-size:13px;font-weight:500;display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px}
.note-item.ro .num{background:none;border:1.5px solid var(--mark);position:relative}
.note-item.ro .num::after{content:'';width:8px;height:8px;border-radius:50%;background:var(--mark)}
.disc{border-top:8px solid #FAFAFA;padding:22px 0 120px}
.disc h2{font-size:18px;font-weight:600;letter-spacing:-.3px;padding:0 20px 14px}
.chips{display:flex;gap:8px;padding:0 4px 16px}
.chip{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:#6f6f73;background:var(--surface);padding:8px 14px;border-radius:var(--r-pill)}
.chip.on{background:#161616;color:#fff}
.rc-grid{columns:2;column-gap:3px;padding:0 3px}
.rc{break-inside:avoid;margin-bottom:3px;cursor:pointer;display:block}
.rc-img{position:relative;width:100%;overflow:hidden;background:var(--surface);border-radius:6px}
.rc-img img{width:100%;height:auto;display:block}

/* ============ alerts ============ */
.sect-label{font-size:12px;font-weight:500;letter-spacing:1px;color:var(--soft);padding:18px 20px 10px}
.draft-card{margin:0 16px 14px;border:1px solid #EFEFEF;border-radius:16px;padding:14px;display:flex;gap:14px;box-shadow:0 2px 10px rgba(0,0,0,.03)}
.draft-card .thumb{width:74px;height:74px;border-radius:10px;object-fit:cover;flex:none;position:relative}
.draft-card .thumbwrap{position:relative;flex:none}
.draft-card .thumbwrap::after{content:'';position:absolute;top:6px;right:6px;width:10px;height:10px;border-radius:50%;background:var(--amber);border:2px solid #fff}
.draft-card .dt{font-size:15px;font-weight:500}
.draft-card .dm{font-size:13px;color:var(--soft);margin-top:2px}
.draft-card .dq{font-size:14px;font-style:italic;margin-top:2px;line-height:1.45}
.draft-card .cont{margin-top:10px;background:#161616;color:#fff;font-size:13px;font-weight:600;padding:8px 14px;border-radius:var(--r-pill);display:inline-flex;align-items:center;gap:6px}
.show-more{padding:2px 20px 8px;font-size:14px;color:var(--soft);cursor:pointer}
.act-card{margin:0 16px 12px;border:1px solid #EFEFEF;border-radius:16px;padding:14px;display:flex;align-items:center;gap:12px}
.act-card.unread{background:#F5F8FC;border-color:#E4ECF6}
.act-card .udot{width:8px;height:8px;border-radius:50%;background:transparent;flex:none}
.act-card.unread .udot{background:#FF3B30}
.act-card .tx{font-size:14px;line-height:1.4}
.act-card .tm{font-size:12px;color:var(--soft);margin-top:3px}
.act-card .athumb{width:48px;height:62px;border-radius:8px;margin-left:auto;flex:none}
.markread{margin-left:auto;font-size:13px;font-weight:500;color:var(--mark);position:relative;z-index:1}

/* ============ profile ============ */
.prof-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:72px 20px 0;position:relative}
.prof-top .logo{justify-self:start}
.prof-top .backbtn{justify-self:start}
.prof-icons{display:flex;gap:10px;justify-self:end;grid-column:3}
.prof-icons .pib{width:44px;height:44px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center}
.prof-id-row{display:flex;align-items:center;gap:14px;padding:22px 20px 0}
.prof-av{width:48px;height:48px;border-radius:50%;font-size:18px}
.prof-body{padding:12px 20px 0}
.prof-name{font-size:22px;font-weight:600;letter-spacing:-.3px;line-height:1.25}
.prof-handle{font-size:14px;color:var(--soft);margin-top:2px;line-height:1.4}
.prof-bio{font-size:15px;margin-top:10px;line-height:1.45}
.prof-btns{display:flex;gap:10px;margin-top:16px}
.pbtn{border:1.5px solid #E2E2E2;border-radius:var(--r-pill);font-size:15px;font-weight:500;padding:10px 20px}
.pbtn.dark{background:#161616;border-color:#161616;color:#fff}
.prof-tabs{display:flex;align-items:center;gap:10px;padding:16px 20px 12px;position:sticky;top:0;background:#fff;z-index:5}
.prof-tabs .viewseg{margin-left:auto}
/* the origin filter is one chip, not a 200px segment: on a phone the segment
   left room for a single sub-tab, which defeated the row it was sharing. */
.pond-chip{flex:none;display:inline-flex;align-items:center;gap:6px;
  height:38px;padding:0 14px;border-radius:var(--r-pill);background:#161616;color:#fff;
  font-size:13.5px;font-weight:600;white-space:nowrap;cursor:pointer;
  box-shadow:10px 0 8px -6px rgba(255,255,255,.95)}
.pond-chip .car{font-size:9px;opacity:.75}
.pond-chip .pc-lock{display:inline-flex;align-items:center;opacity:.85}
.pond-chip .pc-lock svg{width:12px;height:12px;stroke:currentColor}
.pond-chip:active{transform:scale(.96)}
.subtab-sep{flex:none;width:1px;height:20px;background:#E4E4E4;margin:0 2px}
.pt-all{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:600;cursor:pointer}
.pt-all .cnt{background:#161616;color:#fff;font-size:12px;font-weight:500;padding:3px 10px;border-radius:var(--r-pill)}
.pt-all .car{color:var(--soft);font-size:12px}
/* pond label + sub-tab chip row */
.pond-label{font-size:16px;font-weight:600;letter-spacing:-.2px;cursor:pointer;display:flex;align-items:center;gap:6px}
.pond-label .car{color:var(--soft);font-size:12px}
.subtab-row{display:flex;gap:8px;align-items:center;padding:2px 20px 12px;overflow-x:auto;scrollbar-width:none;background:#fff;position:sticky;top:66px;z-index:4}
.subtab-row::-webkit-scrollbar{display:none}
.subtab-chip{height:38px;padding:0 14px;background:#f3f3f2;border-radius:var(--r-pill);font-size:13px;font-weight:500;color:#4a4a4a;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;flex-shrink:0;cursor:pointer;user-select:none;position:relative}
.subtab-chip.on{background:#161616;color:#fff;font-weight:600}
.subtab-chip .cnt{font-size:11px;color:#999;font-weight:400}
.subtab-chip.on .cnt{color:rgba(255,255,255,.7)}
.subtab-chip.manual{background:#E7EFFA;color:#2f4a6b;border:0}
.subtab-chip.manual .cnt{color:#6b86a8}
.subtab-chip.manual.on{background:#161616;color:#fff}
.subtab-chip.editing{background:#E7EFFA;padding:4px 10px}
.subtab-input{border:0;outline:none;background:transparent;font-size:13px;font-weight:600;color:#2f4a6b;width:88px}
.subtab-input::placeholder{color:#8fa6c2}
.subtab-chip.drop{outline:2px dashed var(--soft);outline-offset:2px}
.subtab-chip[draggable="true"]{cursor:grab}
.subtab-chip[draggable="true"]:active{cursor:grabbing}
.subtab-add{height:38px;padding:0 13px;color:#555;font-size:15px;background:#fff;border:1px dashed #cfcfcf;border-radius:var(--r-pill);flex-shrink:0;cursor:pointer;position:sticky;right:0;box-shadow:-10px 0 8px -6px rgba(255,255,255,.95)}
.subtab-hint{flex-shrink:0;display:inline-flex;align-items:center;color:var(--soft);font-size:11px;padding:0 2px}
.viewseg{margin-left:auto;background:#EFEFEF;border-radius:var(--r-pill);padding:4px;display:flex;gap:2px}
.viewseg button{width:38px;height:34px;border-radius:var(--r-pill);display:flex;align-items:center;justify-content:center;color:#7c7c80}
.viewseg button.on{background:#fff;color:#111;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding-bottom:120px}
.pcell{position:relative;aspect-ratio:1;overflow:hidden;cursor:pointer}
.pcell img{width:100%;height:100%;object-fit:cover;display:block}
.pcell .spark-badge{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;background:var(--amber);border:2.5px solid rgba(255,255,255,.9)}
.pcell .spark-badge::after{content:'';position:absolute;inset:0;margin:auto;width:9px;height:9px;border-radius:50%;background:#fff}
.plist{padding:0 16px 120px}
.plist-row{display:flex;gap:12px;padding:12px 4px;border-bottom:1px solid #F2F2F2;align-items:center;cursor:pointer}
.plist-row img{width:56px;height:56px;border-radius:8px;object-fit:cover}
.plist-row .t{font-size:14px;font-weight:500}
.plist-row .s{font-size:12px;color:var(--soft);margin-top:2px}
.plist{padding:8px 20px 140px}
.pnote-row{display:flex;gap:14px;padding:18px 0;border-bottom:1px solid #F2F2F2;align-items:flex-start;cursor:pointer}
.pnote-row:last-child{border-bottom:0}
.pnote-row img{width:80px;height:80px;border-radius:12px;object-fit:cover;flex:none}
.pnote-head{margin-bottom:8px}
.pnote-title{font-size:15px;font-weight:600;color:var(--ink);letter-spacing:-.1px}
.pnote-sub{font-size:12px;color:var(--soft);margin-top:1px}
.pnote-notes{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.pnote-item{display:flex;gap:9px;font-size:13.5px;line-height:1.45;color:var(--ink);align-items:flex-start}
.pn-num{width:20px;height:20px;border-radius:50%;background:var(--mark);color:#fff;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px}
.pn-num.dot{background:none;border:1.5px solid var(--mark);position:relative}
.pn-num.dot::after{content:'';width:7px;height:7px;border-radius:50%;background:var(--mark);position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.pnote-item .pn-txt{flex:1;min-width:0;word-break:break-word}
.plist-empty{padding:64px 20px;text-align:center;color:var(--soft);font-size:14px}

/* ============ camera ============ */
#scr-camera{background:#0d0d0d;color:#fff}
.cam-head{display:flex;align-items:center;padding:56px 16px 8px;position:relative}
.cam-head .backbtn{background:#242424;color:#fff}
.cam-head .ct{position:absolute;left:0;right:0;text-align:center;color:#9a9a9e;font-size:15px}
.viewfinder{
  position:relative;margin:8px 16px;height:456px;border-radius:24px;overflow:hidden;
  background:radial-gradient(120% 90% at 30% 25%, #efe6d2, #cbbc9c 75%, #a99a77);
}
.viewfinder .gl{position:absolute;background:rgba(255,255,255,.35)}
.cam-hint{text-align:center;color:#8A8A8E;font-size:14px;margin-top:74px}
.cam-controls{display:flex;align-items:center;justify-content:space-between;padding:26px 48px 0}
.cam-thumb{width:52px;height:52px;border-radius:14px;background:linear-gradient(150deg,#dbe4ee,#aebccb);box-shadow:0 2px 8px rgba(0,0,0,.4)}
.shutter{width:82px;height:82px;border-radius:50%;background:#fff;box-shadow:0 4px 18px rgba(0,0,0,.5)}
.shutter:active{transform:scale(.94)}
.cam-flip{width:52px;height:52px;border-radius:50%;background:#242424;color:#ccc;display:flex;align-items:center;justify-content:center}
.flash-overlay{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .18s;z-index:50}
.flash-overlay.on{opacity:1}

/* ============ library ============ */
.lib-head{display:flex;align-items:center;padding:60px 20px 4px;position:relative}
.lib-head .cancel{font-size:15px}
.lib-head .lt{position:absolute;left:0;right:0;text-align:center;font-size:17px;font-weight:600;pointer-events:none}
.lib-tabs{display:flex;gap:8px;padding:12px 20px 14px}
.lib-grid-wrap{position:absolute;top:170px;bottom:104px;left:0;right:0;overflow-y:auto;scrollbar-width:none}
.lib-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.lib-ph{position:relative;aspect-ratio:1;cursor:pointer}
.lib-ph .sel{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;border:2px solid rgba(255,255,255,.9);background:rgba(0,0,0,.12)}
.lib-ph.on .sel{background:var(--amber);border-color:#fff}
.lib-ph.on .sel::after{content:'✓';position:absolute;inset:0;color:#fff;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center}
.lib-cta{position:absolute;bottom:0;left:0;right:0;background:#fff;display:flex;gap:10px;padding:16px 20px 34px;box-shadow:0 -8px 24px rgba(0,0,0,.05)}
.lib-cta .c1{flex:1;border:1.5px solid #E2E2E2;border-radius:var(--r-pill);font-size:15px;font-weight:500;padding:14px 0}
.lib-cta .c2{flex:2;border-radius:var(--r-pill);font-size:15px;font-weight:600;padding:14px 0;background:#CCCCCE;color:#fff}
.lib-cta .c2.ready{background:#161616}

/* ============ url ============ */
.url-body{padding:18px 24px}
.url-body h1{font-size:22px;font-weight:600;letter-spacing:-.4px}
.url-body .us{font-size:14px;color:var(--soft);margin-top:6px}
.url-input{margin-top:22px;display:flex;align-items:center;gap:10px;border:1.5px solid #EDEDED;background:#FBFBFB;border-radius:16px;padding:16px;font-family:ui-monospace,Menlo,monospace;font-size:15px}
.url-input input{flex:1;font-family:inherit;font-size:15px}
.url-paste{margin-top:14px;border:1.7px dashed #DBDBDB;border-radius:16px;padding:15px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:500;color:#6f6f73;width:100%}
.url-preview{margin-top:18px;border:1px solid #EFEFEF;border-radius:16px;padding:12px;display:none;align-items:center;gap:12px}
.url-preview.on{display:flex}
.url-preview img{width:56px;height:70px;border-radius:8px;object-fit:cover}
.url-preview .t{font-size:15px;font-weight:500}
.url-preview .s{font-size:13px;color:var(--soft)}
.url-cta{position:absolute;bottom:0;left:0;right:0;padding:16px 20px 34px;background:#fff}
.url-cta button{width:100%;border-radius:var(--r-pill);background:#CCCCCE;color:#fff;font-size:16px;font-weight:600;padding:16px 0}
.url-cta button.ready{background:#161616}

/* ============ review / editor ============ */
.rev-body{position:absolute;top:138px;bottom:0;left:0;right:0;overflow-y:auto;scrollbar-width:none;padding-bottom:30px}
.ed-card{margin:4px 8px 22px;border:1px solid #F0F0F0;border-radius:18px;padding:6px;box-shadow:0 4px 16px rgba(0,0,0,.04)}
.ed-photo{position:relative;border-radius:0;margin:0 0 14px}
.ed-photo img{width:100%;height:auto;max-height:52vh;object-fit:contain;display:block;border-radius:0}
.ed-mn{padding:12px 8px 4px}
.ed-hint{margin:0 8px}
#ed-marknotes{padding:0 4px}
.ed-photo .mark-dot{display:flex}
.ed-mn{display:flex;align-items:center;gap:8px;padding:16px 6px 10px;font-size:13px;font-weight:600}
.ed-mn .only{font-weight:400;color:var(--soft)}
.ed-hint{display:inline-block;background:var(--surface);color:#8a8a8e;font-size:13px;padding:9px 14px;border-radius:var(--r-pill);margin:0 4px 14px}
.toolbar{background:#161616;color:#fff;border-radius:var(--r-pill);height:56px;display:flex;align-items:center;padding:0 20px;gap:22px;margin:0 2px 12px}
.toolbar .tsep{width:1px;height:24px;background:#3c3c3c;margin-left:auto}
.toolbar button{color:#fff;display:flex;padding:6px;border-radius:50%;transition:background .15s}
.toolbar button.on{background:#fff;color:#161616}
.toolbar button.dim{color:#6c6c70}
.ed-photo.armed{cursor:crosshair;touch-action:none;user-select:none}
.ed-photo.armed img{cursor:crosshair}
.mark-arrow{position:absolute;transform:translate(-4px,-4px);color:#fff;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5));display:flex;align-items:center;gap:4px;pointer-events:none}
.mark-arrow svg{width:22px;height:22px}
.mark-arrow-num{background:var(--mark);color:#fff;font-size:11px;font-weight:600;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.mark-scribble{position:absolute;pointer-events:none;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5));display:flex;align-items:flex-start;gap:2px}
.mark-scribble svg{width:60px;height:30px;display:block}
.ed-noterow{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:var(--r-pill);padding:6px 8px 6px 16px;margin:0 2px 12px}
.ed-noterow input{flex:1;font-size:15px}
.ed-noterow .addbtn{width:46px;height:46px;border-radius:50%;background:#161616;color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
#ed-marknotes,[id$='-plopnotes']{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.ed-marknote{display:flex;align-items:flex-start;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-size:14px}
.ed-marknote .num{width:22px;height:22px;border-radius:50%;background:var(--mark);color:#fff;font-size:12px;font-weight:600;flex:none;display:flex;align-items:center;justify-content:center;margin-top:1px}
.ed-marknote .num.dot{background:none;border:1.5px solid var(--mark);position:relative}
.ed-marknote .num.dot::after{content:'';width:7px;height:7px;border-radius:50%;background:var(--mark);position:absolute}
.ed-marknote .txt{flex:1;line-height:1.4;word-break:break-word}
.ed-marknote .mx{margin-left:auto;color:#9a9a9e;display:flex;gap:12px;align-items:center}
.ed-marknote .mn-del{margin-left:auto;flex:none;width:26px;height:26px;border-radius:50%;background:#fff;border:1px solid var(--line);color:#9a9a9e;display:flex;align-items:center;justify-content:center;cursor:pointer;margin-top:-1px}
.ed-marknote .mn-del svg{width:13px;height:13px}
.ed-marknote.flash{background:#eef3fa;border-color:var(--mark);transition:background .3s ease,border-color .3s ease}
.cap-label{display:flex;align-items:center;gap:8px;padding:12px 16px 10px;font-size:11px;font-weight:600;letter-spacing:1px;color:#3a3a3e}
.cap-label .ck{color:var(--mark);font-weight:600}
.cap-label .sub{font-weight:400;letter-spacing:0;color:var(--soft);font-size:13px}
.fields{margin:0 16px 14px;border:1.5px solid #F5CDBF;border-radius:16px;overflow:hidden}
.fields{margin:0 8px;background:#FBFBFA;border-radius:14px;padding:2px 12px}
.frow{display:flex;align-items:center;gap:8px;padding:12px 0;border-bottom:1px solid #F0F0F0}
.frow:last-child{border-bottom:0}
.frow input{flex:1;min-width:0;font-size:15px;font-weight:400;background:transparent}
.frow input::placeholder{color:#a5a5a9}
.frow .fx{flex:none;width:26px;height:26px;display:flex;align-items:center;justify-content:center;color:#B8B8BC;font-size:13px;border-radius:50%}
.frow .fmic{flex:none;width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:#6f6f73;background:#fff;border:1px solid #EAEAEA;border-radius:50%}
.ed-chips{display:flex;gap:8px;padding:12px 16px 0;flex-wrap:wrap}
.edchip{display:flex;align-items:center;gap:7px;border:1.5px solid #E7E7E7;border-radius:var(--r-pill);font-size:13px;font-weight:500;padding:10px 15px}
.edchip.dash{border-style:dashed;color:#8A8A8E;font-weight:500}
.ed-chips{align-items:center}
.clearall{margin-left:auto;font-size:13px;color:#6f6f73;text-decoration:underline;background:none;border:0;cursor:pointer;padding:8px 4px;align-self:center}
.saveto{margin:18px 16px 14px;border:1.5px solid #EDEDED;border-radius:16px;padding:15px 16px;display:flex;align-items:center;cursor:pointer}
.saveto .sl{font-size:13px;color:var(--soft)}
.saveto .sv{margin-left:auto;font-size:15px;font-weight:500;display:flex;align-items:center;gap:8px}
.saveto .sv .car{color:var(--soft);font-size:15px}
.bigsave{display:block;width:calc(100% - 32px);margin:0 16px;background:#161616;color:#fff;border-radius:var(--r-pill);font-size:16px;font-weight:600;padding:16px 0}
.discard{display:block;margin:18px auto 8px;font-size:14px;color:var(--soft)}

/* ============ saved / ritual ============ */
.center-scr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 40px}
.bigcheck{width:100px;height:100px;border-radius:50%;background:#161616;color:#fff;display:flex;align-items:center;justify-content:center;margin-bottom:26px}
.center-scr h1{font-size:24px;font-weight:600;letter-spacing:-.4px}
.center-scr .cs{font-size:14px;color:var(--soft);margin-top:12px;line-height:1.5}
.center-scr .cbtn{margin-top:26px;border:1.5px solid #E2E2E2;border-radius:var(--r-pill);font-size:15px;font-weight:500;padding:14px 28px}
.rit-dots{position:absolute;left:0;right:0;top:70px;display:flex;gap:8px;justify-content:center}
.rit-dots span{width:32px;height:4px;border-radius:4px;background:#E5E5E5}
.rit-dots span.on{background:#161616}
.rit-body{padding:26px 24px 0}
.rit-body h1{font-size:24px;font-weight:600;letter-spacing:-.5px}
.rit-body .rs{font-size:14px;color:var(--soft);margin-top:6px}
.rit-card{margin-top:18px;border:1px solid #EFEFEF;border-radius:20px;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.05)}
.rit-card img,.rit-card .rimg{width:100%;height:408px;object-fit:cover;display:block}
.rit-q{padding:18px 18px 8px;font-size:16px;font-weight:500}
.rit-line{margin:34px 18px 18px;border-bottom:1px solid #EEE}
.rit-line input{width:100%;font-size:15px;padding-bottom:8px}
.rit-btns{position:absolute;bottom:0;left:0;right:0;display:flex;gap:10px;padding:16px 20px 34px;background:#fff}
.rit-btns .r1{flex:1;border:1.5px solid #E2E2E2;border-radius:var(--r-pill);font-size:15px;font-weight:500;color:var(--soft);padding:15px 0}
.rit-btns .r2{flex:1.6;background:#161616;color:#fff;border-radius:var(--r-pill);font-size:15px;font-weight:600;padding:15px 0}

/* ============ sheets ============ */
.sheetwrap{position:absolute;inset:0;z-index:70;display:none}
.sheetwrap.open{display:block}
.sheetwrap .scrim{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.sheet{
  position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:28px 28px 0 0;padding:14px 24px 40px;
  animation:sheetup .22s ease;max-height:78%;overflow-y:auto;scrollbar-width:none;
}
@keyframes sheetup{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.handle{width:38px;height:4px;border-radius:4px;background:#E5E5E5;margin:0 auto 18px}
.sheet-h{font-size:19px;font-weight:600;letter-spacing:-.3px;margin-bottom:10px}
.sheet-p{font-size:14px;color:var(--soft);margin-top:6px;line-height:1.45}
.srow{display:flex;align-items:center;gap:14px;padding:16px 2px;border-bottom:1px solid #F2F2F2;font-size:15px;font-weight:500;cursor:pointer}
.srow:last-child{border-bottom:0}
.srow .chev{margin-left:auto;color:#B8B8BC}
.srow .right{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:15px;color:var(--soft)}
.srow .ok{color:var(--mark);font-weight:600}
.srow .dots{color:#9a9a9e;letter-spacing:1px;font-weight:600}
.srow .lock{color:#9a9a9e}
.newpond{display:flex;align-items:center;gap:10px;padding:16px 2px;font-size:16px;color:#9a9a9e;font-weight:500}
.prochip{background:#161616;color:#fff;font-size:12px;font-weight:600;padding:5px 12px;border-radius:var(--r-pill);letter-spacing:.5px}
.sheet-field{border:1.5px solid #EDEDED;border-radius:16px;padding:13px 18px;margin-top:16px}
.sheet-field .lab{font-size:12px;font-weight:500;letter-spacing:.8px;color:var(--soft)}
.sheet-field input{width:100%;font-size:16px;margin-top:3px}
.sheet-row-toggle{border:1.5px solid #EDEDED;border-radius:16px;padding:15px 18px;margin-top:14px;display:flex;align-items:center}
.sheet-row-toggle .tt{font-size:15px;font-weight:500}
.sheet-row-toggle .ts{font-size:13px;color:var(--soft);margin-top:2px}
.toggle{margin-left:auto;width:52px;height:32px;border-radius:16px;background:#161616;position:relative;flex:none;cursor:pointer}
.toggle::after{content:'';position:absolute;top:3px;right:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:.15s}
.toggle.off{background:#E2E2E2}
.toggle.off::after{right:23px}
.sheet-cta{display:flex;gap:10px;margin-top:20px}
.sheet-cta .sc1{flex:1;border:1.5px solid #E2E2E2;border-radius:var(--r-pill);font-size:15px;font-weight:500;padding:15px 0}
.sheet-cta .sc1.red{color:#E0442A}
.sheet-cta .sc2{flex:1.8;background:#161616;color:#fff;border-radius:var(--r-pill);font-size:15px;font-weight:600;padding:15px 0}
.sheet-cta .sc2.red{background:#161616;color:#fff}
.sheet.rmenu{
  left:auto; right:16px; top:104px; bottom:auto; width:230px; border-radius:18px; padding:8px;
  box-shadow:var(--shadow-float); animation:rmenuin .18s ease;
}
@keyframes rmenuin{from{transform:translateX(20px);opacity:0}to{transform:none;opacity:1}}
.sheet.rmenu .handle{display:none}
.sheet.rmenu .srow{padding:13px 10px}
.freeplan{margin-top:18px;background:#F5F5F5;border-radius:14px;padding:14px 16px;font-size:13px;color:#3a3a3e}
.drafts-cta{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:14px;padding:14px 16px;margin-top:14px;font-size:15px;font-weight:500;cursor:pointer}
.drafts-cta .chev{margin-left:auto;color:var(--soft)}
.freeplan b{font-weight:500}
.freeplan u{font-weight:500;cursor:pointer}
.mn-head{display:flex;align-items:center;gap:12px}
.mn-head .num{width:34px;height:34px;border-radius:50%;background:var(--mark);color:#fff;font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center}
.mn-head h2{font-size:18px;font-weight:600}
.mn-head .x{margin-left:auto;width:40px;height:40px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;color:#6f6f73}
.mn-input{display:flex;align-items:center;background:var(--surface);border-radius:var(--r-pill);padding:8px 8px 8px 20px;margin-top:20px}
.mn-input input{flex:1;font-size:15px}
.mn-input .mic{width:42px;height:42px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;color:#3a3a3e}
.rec-row{display:flex;align-items:center;gap:16px;background:var(--surface);border-radius:16px;padding:16px;margin-top:20px}
.rec-row>div:nth-child(2){flex:1;min-width:0}
.rec-btn{width:60px;height:60px;border-radius:50%;background:#F26649;color:#fff;display:flex;align-items:center;justify-content:center;flex:none;transition:transform .15s ease,box-shadow .15s ease}
.rec-btn:active{transform:scale(.92)}
.rec-btn.recording{box-shadow:0 0 0 6px rgba(242,102,73,.22);animation:recpulse 1.4s ease-in-out infinite}
@keyframes recpulse{0%,100%{box-shadow:0 0 0 5px rgba(242,102,73,.20)}50%{box-shadow:0 0 0 10px rgba(242,102,73,.08)}}
.rec-t{font-size:15px;font-weight:500}
.wave{display:flex;align-items:center;gap:2px;height:16px;margin-top:6px}
.wave i{width:2.5px;background:#c9c9cd;border-radius:2px;display:block}
/* 30s cap — progress meter + counter */
.rec-meter{height:3px;border-radius:2px;background:#dcdce0;margin-top:8px;overflow:hidden;opacity:0;transition:opacity .2s}
.rec-meter.on{opacity:1}
.rec-bar{display:block;height:100%;width:0%;background:#F26649;border-radius:2px;transition:width .1s linear}
.rec-clock{
  flex:none;font-size:13px;font-variant-numeric:tabular-nums;color:var(--soft);
  opacity:0;transition:opacity .2s,color .2s;
}
.rec-clock.on{opacity:1}
.rec-clock.near{color:#F26649;font-weight:600}
.rec-clock .rec-max{opacity:.55}
.rec-transcript{display:none;background:#FFF7F0;border:1px solid #F5DEC9;border-radius:12px;margin-top:12px;padding:12px 14px;font-size:15px;font-style:italic}
.rec-transcript.on{display:block}
.pro-star{width:96px;height:96px;border-radius:50%;background:#161616;color:#fff;display:flex;align-items:center;justify-content:center;margin:8px auto 18px}
.pro-h{font-size:22px;font-weight:600;text-align:center}
.pro-s{font-size:14px;color:var(--soft);text-align:center;margin-top:8px;line-height:1.45}
.pro-row{display:flex;align-items:center;gap:14px;padding:15px 2px;border-bottom:1px solid #F2F2F2;font-size:15px}
.pro-row .cir{width:26px;height:26px;border-radius:50%;border:2px solid #D9D9DC;flex:none}
.pro-cta{display:block;width:100%;margin-top:22px;background:#161616;color:#fff;border-radius:var(--r-pill);font-size:16px;font-weight:600;padding:15px 0}
.kb-row{display:flex;align-items:center;gap:14px;padding:14px 2px;border-bottom:1px solid #F2F2F2}
.kb-row .kn{font-size:15px;font-weight:500}
.kb-row .kt{font-size:13px;color:var(--soft);margin-top:2px}
.followmini{margin-left:auto;border:1.5px solid #161616;background:#161616;color:#fff;border-radius:var(--r-pill);font-size:13px;font-weight:600;padding:7px 16px;flex:none}
.followmini.on{background:none;color:#111;border-color:#E2E2E2}
.prof-stats{display:flex;align-items:center;gap:20px;margin-top:12px}
.pstat{font-size:14px;color:var(--soft);cursor:pointer}
.pstat b{font-weight:600;color:var(--ink)}
.search-input{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:var(--r-pill);padding:15px 18px}
.search-input input{flex:1;font-size:16px}
.search-head{flex:1;padding:11px 16px}
.search-head .icon{width:20px;height:20px}
.mycol-row{padding:14px 20px 2px}
.col-toggle{display:inline-flex;align-items:center;gap:9px;font-size:14px;font-weight:500;color:var(--ink)}
.col-toggle .cbox{width:20px;height:20px;border-radius:6px;border:1.5px solid #D5D5D8;display:flex;align-items:center;justify-content:center;color:transparent;transition:.15s;flex:none}
.col-toggle .cbox svg{width:13px;height:13px;display:block}
.col-toggle.on .cbox{background:var(--mark);border-color:var(--mark);color:#fff}
.seg-toggle{display:inline-flex;background:#f3f3f2;border-radius:var(--r-pill);padding:3px}
.seg-btn{padding:6px 14px;font-size:13px;font-weight:500;color:#6b6b6b;background:transparent;border:0;border-radius:var(--r-pill);cursor:pointer}
.seg-btn.on{background:#fff;color:#161616;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.fs-sticky{position:sticky;top:0;z-index:5;background:#fff}
.fs-cancel{background:transparent;border:0;color:var(--ink);font-size:15px;font-weight:500;padding:0 4px 0 10px;cursor:pointer}
.fs-count-inline{margin-left:10px;font-size:13px;color:var(--soft);align-self:center}
.mycol-row{padding:14px 20px 8px;display:flex;align-items:center}
.browse-pills{display:flex;gap:8px;padding:4px 20px 12px;overflow-x:auto;scrollbar-width:none}
.browse-pills::-webkit-scrollbar{display:none}
.bpill{padding:7px 14px;background:#f3f3f2;border-radius:var(--r-pill);font-size:13px;font-weight:500;color:#4a4a4a;white-space:nowrap;flex-shrink:0;cursor:pointer;user-select:none}
.bpill.on{background:#161616;color:#fff;font-weight:600}
.preview-mosaic{columns:2;column-gap:3px;padding:8px 3px 0}
.preview-mosaic .pm-cell{break-inside:avoid;margin-bottom:3px;overflow:hidden;cursor:pointer;display:block;border-radius:6px}
.preview-mosaic .pm-cell img{width:100%;height:auto;display:block}
.rec-head{display:flex;justify-content:space-between;align-items:center;padding:16px 0 8px;font-size:13px;color:var(--soft);font-weight:500}
.rec-clear{color:var(--soft);font-weight:500;cursor:pointer}
.rec-item{display:flex;align-items:center;gap:12px;padding:12px 0;font-size:15px;color:var(--ink);cursor:pointer;border-bottom:1px solid #f2f2f2}
.rec-item .ric{width:18px;height:18px;color:var(--soft);flex-shrink:0}
.rec-item .rx{margin-left:auto;color:var(--soft);font-size:16px;padding:4px 8px}
.sug-item{display:flex;align-items:center;gap:12px;padding:11px 0;font-size:15px;color:var(--ink);cursor:pointer}
.sug-item .ric{width:18px;height:18px;color:var(--soft);flex-shrink:0}
.sh-sub{font-size:14px;color:var(--soft);margin:20px 0 12px}
.settings-group{background:var(--surface);border-radius:var(--r-card);padding:2px 14px}
.settings-group .srow{border-bottom:1px solid rgba(0,0,0,.07)}
.settings-group .srow:last-child{border-bottom:0}
.set-note{font-size:13px;color:var(--soft);line-height:1.55;margin:4px 4px 16px}
.set-body{font-size:14px;color:var(--ink);line-height:1.65;margin:6px 4px 16px}
.settings-group .srow .rt{margin-left:auto;color:var(--soft);font-size:14px;font-weight:400}
.set-opt .chk{margin-left:auto;color:var(--mark);font-weight:700;opacity:0}
.set-opt.on .chk{opacity:1}
.set-field{background:var(--surface);border-radius:14px;padding:12px 16px;margin:10px 0}
.set-field .lab{font-size:11px;font-weight:600;letter-spacing:1px;color:var(--soft);margin-bottom:6px}
.set-field input{width:100%;font-size:15px;background:none;border:0;outline:none}
.set-empty{white-space:pre-line;text-align:center;color:var(--soft);font-size:14px;line-height:1.6;padding:48px 20px}
.wordchips{display:flex;flex-wrap:wrap;gap:10px}
.wchip{display:flex;align-items:center;gap:7px;background:var(--surface);border-radius:var(--r-pill);padding:10px 16px;font-size:14px;font-weight:500;cursor:pointer}
.wchip .c{color:var(--soft);font-weight:400;font-size:12px}
.results-grid{columns:2;column-gap:3px;margin-top:14px;padding:0 3px}
.res-cell{break-inside:avoid;margin-bottom:3px;display:block;cursor:pointer;position:relative;overflow:hidden;border-radius:6px}
.res-cell img{width:100%;height:auto;display:block}
.res-cell .rl{position:absolute;left:0;right:0;bottom:0;padding:20px 10px 8px;color:#fff;font-size:12px;font-weight:500;background:linear-gradient(transparent,rgba(0,0,0,.55));line-height:1.2}

/* toast */
.toast{
  position:absolute;left:50%;bottom:180px;transform:translateX(-50%) translateY(6px);z-index:90;
  background:#161616;color:#fff;font-size:13px;font-weight:400;padding:10px 20px;border-radius:var(--r-pill);
  opacity:0;pointer-events:none;transition:.18s;white-space:nowrap;
}
.toast.on{opacity:1;transform:translateX(-50%)}
.toast .ta-action{margin-left:10px;text-decoration:underline;font-weight:400;cursor:pointer;pointer-events:auto}

/* Apple-style camera */
.cam-top{position:absolute;top:56px;left:0;right:0;display:flex;justify-content:space-between;padding:0 22px;z-index:5}
.cam-top-btn{width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.35);color:#fff;display:flex;align-items:center;justify-content:center;border:0}
.cam-top-btn svg{width:16px;height:16px}
.cam-top-chev{background:rgba(0,0,0,.35);font-size:20px;line-height:1;padding-bottom:2px}
.cam-preview{position:absolute;top:100px;left:0;right:0;bottom:200px;overflow:hidden}
.cam-preview-img{width:100%;height:100%;object-fit:cover;opacity:.9;filter:brightness(.8) contrast(1.05)}
.cam-zoom{position:absolute;bottom:172px;left:0;right:0;display:flex;justify-content:center;gap:14px;z-index:4}
.cam-zoom-btn{padding:5px 9px;font-size:11px;font-weight:600;background:rgba(0,0,0,.5);color:#fff;border-radius:50%;min-width:26px;border:0}
.cam-zoom-btn.on{background:rgba(255,204,0,.15);color:#FCC419;padding:6px 11px}
.cam-modes{position:absolute;bottom:130px;left:0;right:0;display:flex;justify-content:center;gap:22px;font-size:11px;font-weight:600;letter-spacing:1.2px;color:#a3a3a3;z-index:4}
.cam-modes .on{color:#FCC419}
.cam-controls{position:absolute;bottom:36px;left:0;right:0;display:flex;align-items:center;justify-content:space-around;padding:0 34px;z-index:5}
.cam-thumb{width:44px;height:44px;border-radius:8px;overflow:hidden;background:#333;border:1px solid rgba(255,255,255,.2)}
.cam-thumb img{width:100%;height:100%;object-fit:cover}
.shutter{width:72px;height:72px;border-radius:50%;background:#fff;border:4px solid #fff;box-shadow:0 0 0 3px rgba(0,0,0,.35), inset 0 0 0 2px transparent}
.cam-flip{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;display:flex;align-items:center;justify-content:center;border:0}
.cam-flip svg{width:20px;height:20px}


/* Mobile: fill viewport, drop desktop phone frame */
@media (max-width: 480px){
  body{padding:0;align-items:stretch;justify-content:stretch;background:var(--bg)}
  .topbar{padding-top:14px}
  .dethead{padding-top:14px}
  .cam-top{top:14px}
  .rev-body{top:64px}
  
  .phone{width:100vw;height:100vh;height:100dvh;border-radius:0;box-shadow:none}
  .statusbar{display:none}
  .bottomnav{bottom:max(16px, env(safe-area-inset-bottom))}
}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.plop-place{display:none !important}
.sheetwrap .sheet{min-height:0}
#prompt-sheet,#confirm-sheet{z-index:82}
.sheet-field textarea{width:100%;font-size:16px;margin-top:3px;border:0;outline:0;resize:none;
  font-family:inherit;line-height:1.45;min-height:62px;background:transparent}
.sheet-field.focus{border-color:#C9C9C9}
.ps-count{font-size:12px;color:var(--soft);text-align:right;margin-top:6px}
.sheet .sheet-cta{margin-bottom:8px}

.backbtn:active,.actbtn:active,.toolbar button:active,.pm-del:active,.mn-head .x:active,.note-del:active{
  transform:scale(.9);
  opacity:.7;
  transition:transform .1s ease, opacity .1s ease;
}
.backbtn,.actbtn,.toolbar button,.pm-del,.mn-head .x,.note-del{transition:transform .18s ease, opacity .18s ease}


.note-item{position:relative}
.note-item .ni-text{flex:1;min-width:0}
.note-del{margin-left:auto;width:22px;height:22px;border-radius:50%;color:#b0b0b0;background:transparent;border:0;font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.pnote-item{position:relative}

/* ============================================================
   SAVE/NOTE UPDATE — repost/quote, per-note visibility,
   dim note views + bubbles, note actions
   ============================================================ */
/* --- Repost / Quote action buttons --- */
.actbtn.repost, .actbtn.quote{
  flex-grow:1; flex-basis:auto; width:auto; border-radius:22px; height:44px;
  background:var(--surface); color:var(--ink); gap:6px; padding:0 14px;
}
.actbtn.repost .icon, .actbtn.quote .icon{width:20px;height:20px}
.actbtn .ab-label{font-size:14px;font-weight:600;letter-spacing:-.2px}
.actbtn.repost.on{background:#161616;color:#fff;box-shadow:0 0 0 5px rgba(0,0,0,.06)}
.actbtn.quote.on{background:#161616;color:#fff}
.actbtn.share{flex:none;flex-basis:44px}
/* Quote helper banner inside the note editor */
.quote-banner{display:flex;gap:8px;align-items:flex-start;background:#f4f0e9;border:1px solid #e7ddcc;
  color:#6b5d43;font-size:12.5px;line-height:1.45;border-radius:12px;padding:10px 12px;margin:0 0 12px}
.quote-banner b{color:#4a3f2c}

/* --- per-note visibility chip (in the editor rows) --- */
.nv-controls{display:flex;align-items:center;gap:8px;margin-left:auto;flex:none}
.nv-controls .mn-del{margin-left:0}
.nv-chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;
  padding:5px 9px;border-radius:999px;border:1px solid var(--line);background:#fff;color:#6f6f73;cursor:pointer;white-space:nowrap}
.nv-chip .icon{width:13px;height:13px}
.nv-chip.nv-public{color:#2f6fb0;border-color:#cfe0f2;background:#f2f7fd}
.nv-chip.nv-noquote{color:#b07d2f;border-color:#eddcc2;background:#fbf5ea}

/* --- profile note view: dim black cards --- */
.noteview-card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:12px;box-shadow:none}
.noteview-card img{width:64px;height:64px}
.noteview-card .pnote-title{color:var(--ink)}
.noteview-card .pnote-sub{color:var(--soft)}
.noteview-card .pnote-item{align-items:center;color:var(--ink);padding:7px 0}
.noteview-card .pn-txt{color:var(--ink)}
.noteview-card .pn-num.dot{border-color:var(--mark)}
.noteview-card .pn-num.dot::after{background:var(--mark)}
.pn-vis{display:inline-flex;align-items:center;justify-content:center;flex:none;margin-left:6px;opacity:.9}
.pn-vis .icon{width:14px;height:14px}
.pn-vis-private{color:#8f8f95}
.pn-vis-public{color:#7FB0E8}
.pn-vis-noquote{color:#D9A45A}
.pn-grip{display:inline-flex;align-items:center;flex:none;margin-left:8px;color:#6a6a70;cursor:grab}
.pn-grip .icon{width:16px;height:16px}
.mylist.reordering .pn-grip, .plist.reordering .pn-grip{color:#7FB0E8}
.mylist.reordering .pnote-item, .plist.reordering .pnote-item{background:rgba(127,176,232,.06);border-radius:8px}
.pnote-item.note-drop{outline:2px dashed #7FB0E8;outline-offset:2px;border-radius:8px}

/* --- note actions sheet --- */
.na-quote{background:var(--surface);border-radius:14px;padding:14px 16px;margin-bottom:4px}
.na-vis{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.3px;color:var(--soft);margin-bottom:6px}
.na-vis .icon{width:13px;height:13px}
.na-quote p{font-size:15px;line-height:1.5;color:var(--ink)}
.na-row{gap:12px;cursor:pointer}
.na-row .icon{color:var(--ink);flex:none}
.na-hint{margin-left:auto;font-size:12px;color:var(--soft);font-weight:400}
.na-del, .na-del .icon{color:#E0442A}

/* --- voice: bottom-left record icon on the detail image + recordings list --- */
.img-fabs{position:absolute;left:12px;bottom:12px;z-index:8;display:flex;gap:10px}
.img-fab{position:relative;width:46px;height:46px;border-radius:50%;
  background:rgba(24,24,26,.74);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(0,0,0,.32)}
.img-fab .icon{width:22px;height:22px;stroke:#fff}
.voice-fab .vf-dot{width:16px;height:16px;border-radius:50%;background:#FF3B30;box-shadow:0 0 0 2.5px rgba(255,255,255,.92)}
.plop-mark.freeNote .pm-dot{display:none}
.voice-fab .vf-count{position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;
  background:var(--mark);color:#fff;font-size:10px;font-weight:600;display:flex;align-items:center;justify-content:center;border:1.5px solid #fff}
.voice-row{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid #F2F2F2;cursor:pointer}
.voice-row:last-of-type{border-bottom:0}
.vn-play{width:42px;height:42px;border-radius:50%;background:#161616;color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.vn-play svg{width:18px;height:18px;fill:#fff;stroke:none}
.voice-row.playing .vn-play{background:var(--mark)}
.vn-meta{flex:1;min-width:0}
.vn-label{font-size:15px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vn-dur{font-size:12px;color:var(--soft);margin-top:2px}
.vn-wave{display:flex;align-items:center;gap:2px;height:22px;flex:none}
.vn-wave i{width:2.5px;background:#c9c9cd;border-radius:2px;display:block}
.voice-row.playing .vn-wave i{background:var(--mark)}

/* ============ A - profile origin segments: All / Quote / Reposts ============ */
.pondseg{display:flex;gap:2px;align-items:center;background:#F0F0F0;border-radius:var(--r-pill);padding:3px}
/* header pond selector — plain name + caret, no chrome around it */
.pondbtn{height:34px;padding:0 6px;border-radius:var(--r-pill);font-size:16px;font-weight:600;color:var(--ink);background:none;border:0;display:flex;align-items:center;gap:5px;flex:none;white-space:nowrap}
.pondbtn .car{font-size:10px;opacity:.7;flex:none}
.pondbtn:active{opacity:.55}
/* pond selector centred in the header; filter (left) + view (right) in the tab row */
/* filter group styled to match the grid/list view toggle exactly (icons keep original size) */
.filterseg{margin-left:0;background:#EFEFEF;border-radius:var(--r-pill);padding:4px;display:flex;gap:2px}
.filterseg button{width:38px;height:34px;min-width:0;padding:0;border-radius:var(--r-pill);display:flex;align-items:center;justify-content:center;color:#7c7c80;background:none}
.filterseg button.on{background:#fff;color:#111;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.filterseg button svg{width:22px;height:22px;stroke:currentColor}
.pondbtn-head{justify-self:center}
.prof-tabs{position:relative}
.prof-tabs .pond-menu{left:20px;top:calc(100% - 4px)}
.pondseg button{height:32px;min-width:46px;padding:0 15px;border-radius:var(--r-pill);font-size:15px;font-weight:600;color:#38383c;background:none;display:flex;align-items:center;justify-content:center;transition:background .18s ease,color .18s ease}
.pondseg button.on{background:#161616;color:#fff}
.pondseg button svg{width:20px;height:20px;stroke:currentColor}
.pondseg #pg-all{gap:5px}
.pondseg #pg-all .car{font-size:10px;opacity:.85}
.pond-menu{position:absolute;top:calc(100% + 2px);left:20px;min-width:200px;background:#fff;border-radius:14px;box-shadow:var(--shadow-float);padding:6px;z-index:40;display:none}
.pond-menu.open{display:block}
.pond-menu .pm-row{display:flex;align-items:center;gap:6px;padding:11px 12px;border-radius:10px;font-size:15px;font-weight:500;color:var(--ink);cursor:pointer}
.pond-menu .pm-row:active{background:#F2F2F2}
.pond-menu .pm-row.on{font-weight:700}
.pond-menu .pm-row .pm-cnt{margin-left:auto;color:var(--soft);font-size:13px;font-weight:500}
.pond-menu .pm-row .icon{width:15px;height:15px}
.pond-menu .pm-new{color:var(--mark);font-weight:600;border-top:1px solid var(--line);margin-top:4px}
.pondseg #pg-all{gap:5px}
.pondseg #pg-all .car{font-size:10px;opacity:.85}
.pond-menu{position:absolute;top:calc(100% + 2px);left:20px;min-width:200px;background:#fff;border-radius:14px;box-shadow:var(--shadow-float);padding:6px;z-index:40;display:none}
.pond-menu.open{display:block}
.pond-menu .pm-row{display:flex;align-items:center;gap:6px;padding:11px 12px;border-radius:10px;font-size:15px;font-weight:500;color:var(--ink);cursor:pointer}
.pond-menu .pm-row:active{background:#F2F2F2}
.pond-menu .pm-row.on{font-weight:700}
.pond-menu .pm-row .pm-cnt{margin-left:auto;color:var(--soft);font-size:13px;font-weight:500}
.pond-menu .pm-row .icon{width:15px;height:15px}
.pond-menu .pm-new{color:var(--mark);font-weight:600;border-top:1px solid var(--line);margin-top:4px}

/* ============ C - note edit-pending (b) vs editing (c) states ============ */
.hero.armed .plop-mark:not(.editing) .pm-pill{background:rgba(18,18,18,.92);outline:1.5px solid rgba(255,255,255,.35);outline-offset:1px;cursor:text}
.hero.armed .plop-mark:not(.editing) .pm-dot{box-shadow:0 0 0 3px rgba(255,255,255,.28),0 1px 5px rgba(0,0,0,.45)}
.hero.armed .plop-mark.lasso:not(.editing) .lasso-path{fill:rgba(255,255,255,.16)}

/* ============ B - nested quote (Threads-style) card ============ */
.quote-card{margin:12px 20px 4px 34px;position:relative;cursor:pointer;border:1px solid var(--line);border-radius:14px;padding:11px 12px;background:#FAFAFA}
.quote-card::before{content:"";position:absolute;left:-16px;top:6px;bottom:6px;width:2px;background:var(--line);border-radius:2px}
.qc-head{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.qc-head .av{width:20px;height:20px;font-size:10px}
.qc-nm{font-weight:600;font-size:13px}
.qc-hd{color:var(--soft);font-size:12px}
.qc-row{display:flex;gap:10px;align-items:flex-start}
.qc-thumb{width:52px;height:52px;border-radius:8px;object-fit:cover;flex:none}
/* the quoted post is itself a quote — how much further the chain goes */
.qc-chain{
  margin-top:9px;padding-top:8px;border-top:1px dashed var(--line);
  font-size:11.5px;color:var(--soft);letter-spacing:.01em;
}
.qc-txt{min-width:0}
.qc-t{font-weight:600;font-size:13px;margin-bottom:2px}
.qc-d{color:var(--soft);font-size:12px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ============ C - bottom-left note dropdown ============ */
.note-drop{position:absolute;left:12px;bottom:64px;width:250px;max-height:300px;overflow-y:auto;background:rgba(20,20,20,.94);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-radius:16px;padding:8px;z-index:40;box-shadow:var(--shadow-float);display:none;scrollbar-width:none}
.note-drop::-webkit-scrollbar{display:none}
.note-drop.open{display:block;animation:noteDropIn .22s cubic-bezier(.22,.61,.36,1)}
@keyframes noteDropIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.nd-item{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:10px;color:#fff;font-size:13px;cursor:pointer}
.nd-item:active{background:rgba(255,255,255,.08)}
.nd-num{width:18px;height:18px;border-radius:50%;background:#fff;color:#161616;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.nd-num.dot{background:none;border:1.5px solid rgba(255,255,255,.6)}
.nd-txt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nd-voice .nd-num{background:var(--mark);color:#fff;font-size:9px}
.nd-dur{color:rgba(255,255,255,.5);font-size:11px;flex:none}
.nd-add{display:flex;align-items:center;gap:8px;padding:10px;margin-top:2px;border-top:1px solid rgba(255,255,255,.12);color:#fff;font-weight:600;font-size:13px;cursor:pointer}
.nd-empty{padding:14px 10px;color:rgba(255,255,255,.55);font-size:12.5px;text-align:center}
.nd-hint{padding:10px;margin-top:2px;border-top:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.6);font-size:12px;text-align:center}
.nd-hint b{color:#fff;font-weight:600}
.nd-item.nd-readonly .nd-txt{cursor:default}
.nd-ic{width:26px;height:26px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:8px;color:rgba(255,255,255,.7);cursor:pointer}
.nd-ic svg{width:15px;height:15px;stroke:currentColor}
.nd-ic:active{background:rgba(255,255,255,.12)}
.nd-ic.nd-del{color:#ff6b60}
.nd-edit-input{flex:1;min-width:0;background:rgba(255,255,255,.1);border:0;border-radius:8px;color:#fff;font-size:13px;padding:6px 8px;outline:none}
.nd-item.nd-editing{background:rgba(255,255,255,.06)}
.text-link{display:block;width:100%;margin:14px auto 2px;background:none;color:var(--soft);font-size:13px;text-decoration:underline;text-underline-offset:2px;cursor:pointer;padding:6px}
.text-link:active{opacity:.6}

/* ============ E - two-step create ============ */
.rev-steps{display:flex;gap:6px;padding:2px 20px 0}
.rev-dot{height:3px;flex:1;border-radius:2px;background:var(--line)}
.rev-dot.on{background:var(--ink)}
.rev-back-cap{width:100%;text-align:center;color:var(--soft);font-size:14px;font-weight:500;padding:12px;background:none}

/* ============ Repost/Quote v7 ============ */
/* single icon-only repost button, matched to profile repost glyph */
.actbtn.repost-ic{width:44px;height:44px;flex:none;flex-basis:44px;border-radius:50%;background:none;color:var(--ink)}
.actbtn.repost-ic .rp-ic{position:relative;display:flex;align-items:center;justify-content:center;width:21px;height:21px}
.actbtn.repost-ic .rp-ic > .icon{width:21px;height:21px;stroke-width:2}
.actbtn.repost-ic .rp-check{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:none;align-items:center;justify-content:center;width:10px;height:10px}
.actbtn.repost-ic .rp-check .icon{width:10px;height:10px;stroke-width:3;stroke:var(--indigo)}
.actbtn.repost-ic.reposted{color:var(--indigo);background:none}
.actbtn.repost-ic.reposted .rp-check{display:flex}
.actbtn.repost-ic:active{transform:scale(.92)}

/* caption sub as an author link */
.plop-author-link{color:var(--soft);font-weight:500;cursor:pointer;text-underline-offset:2px}
.plop-author-link:active{opacity:.6;text-decoration:underline}

/* ============ Quote editor screen ============ */
.qed-wrap{padding:0 0 132px}
.qed-hint{padding:8px 20px 2px;font-size:12.5px;color:var(--soft)}
.qed-sec-label{padding:14px 20px 6px;font-size:11px;letter-spacing:.4px;color:var(--soft);font-weight:600;text-transform:uppercase}
.qed-noterow{display:flex;align-items:center;gap:8px;margin:0 20px 4px;background:#fff;border:1.5px solid #EDEDED;border-radius:14px;padding:6px 8px 6px 14px}
.qed-noterow input{flex:1;min-width:0;font-size:14px;padding:6px 0}
.qed-noterow button{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--soft);flex:none}
.qed-noterow .addbtn{background:#161616;color:#fff}
.qed-noterow .addbtn:active{transform:scale(.92)}
#quote-notelist{padding:4px 20px 0}
.qnote-item{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #F2F2F2;font-size:14px;color:var(--ink)}
.qnote-item:last-child{border-bottom:0}
.qnote-item .qn-num{width:20px;height:20px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:var(--mark);color:#fff}
.qnote-item .qn-num.dot{background:none;border:1.5px solid var(--mark);position:relative}
.qnote-item .qn-num.dot::after{content:'';width:7px;height:7px;border-radius:50%;background:var(--mark)}
.qnote-item .qn-num.voice{background:var(--mark);font-size:10px}
.qnote-item .qn-txt{flex:1;min-width:0;line-height:1.35}
.qnote-item .qn-dur{color:var(--soft);font-size:11px;flex:none}
.qnote-item .qn-del{width:28px;height:28px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:8px;color:#c0392b}
.qnote-item .qn-del:active{background:rgba(0,0,0,.05)}
/* a note carried over from the post you're quoting — read-only, removable,
   credited to its author. Italic + muted so yours read as clearly "live". */
.qnote-item.locked .qn-txt{color:#4a4a4e;font-style:italic}
.qnote-item.locked .qn-dur{color:#B8B8BC}
.qnote-item.locked .qn-num.dot{border-color:#B8B8BC}
.qnote-item.locked .qn-num.dot::after{background:#B8B8BC}
.qnote-item.locked .qn-num.voice{background:#B8B8BC}
.qnote-item .qn-by{flex:none;font-size:12px;color:var(--soft);white-space:nowrap}
.qnote-empty{padding:14px 4px;color:var(--soft);font-size:13px}
.qed-orig-wrap{margin:16px 20px 0;padding-left:12px;border-left:2px solid var(--line)}
.qed-orig-label{font-size:11px;letter-spacing:.4px;color:var(--soft);font-weight:600;text-transform:uppercase;margin-bottom:8px}
.quote-cta{position:absolute;left:0;right:0;bottom:0;z-index:30;display:flex;align-items:center;gap:10px;padding:12px 18px calc(18px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 78%,rgba(255,255,255,0))}
.quote-cta .q-pond{flex:1;min-width:0;display:flex;align-items:center;justify-content:space-between;gap:6px;background:#fff;border:1.5px solid #EDEDED;color:var(--ink);font-size:14px;font-weight:500;padding:12px 16px;border-radius:14px}
.quote-cta .q-pond span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.quote-cta .q-pond .car{color:var(--soft);flex:none}
.quote-cta .q-publish{flex:none;background:#161616;color:#fff;font-size:14px;font-weight:600;padding:13px 26px;border-radius:14px}
.quote-cta .q-publish:active{transform:scale(.97)}

/* note-author mini sheet */
/* repost chooser — pond selector next to Repost */
#rc-repost-row{position:relative}
.rc-pond{margin-left:auto;display:flex;align-items:center;gap:5px;background:#F2F2F2;border-radius:var(--r-pill);padding:7px 12px;font-size:14px;font-weight:500;color:var(--ink)}
.rc-pond .car{font-size:10px;color:var(--soft)}
.rc-pond:active{background:#EAEAEA}
.rc-pond-menu{position:absolute;right:0;top:100%;margin-top:4px;background:#fff;border-radius:12px;box-shadow:var(--shadow-float);padding:6px;z-index:5;display:none;min-width:150px}
.rc-pond-menu.open{display:block}
.rc-pond-menu .rcp-row{display:flex;align-items:center;gap:6px;padding:11px 12px;border-radius:8px;font-size:15px;font-weight:500;color:var(--ink);cursor:pointer}
.rc-pond-menu .rcp-row:active{background:#F2F2F2}
.rc-pond-menu .rcp-row .lock{color:#9a9a9e;margin-left:auto}
.na-noteref{font-size:13px;line-height:1.4;color:var(--ink);background:#F4F4F5;border-left:3px solid var(--mark);border-radius:8px;padding:9px 11px;margin:2px 0 12px;display:none}
.na-author{display:flex;align-items:center;gap:12px;padding:6px 2px 14px}
.na-author .na-id{min-width:0}
.na-author .na-nm{font-size:16px;font-weight:600}
.na-author .na-hd{font-size:13px;color:var(--soft)}

/* editor · marks-first step */
#scr-review .hero{margin:4px 8px 0}
#scr-review .hero img{width:100%;height:auto;max-height:52vh;object-fit:contain;display:block;border-radius:14px}

/* repost history */
.rp-hist .avstack{margin-right:2px}
.rph-row{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid #F2F2F2;cursor:pointer}
.rph-row:last-child{border-bottom:0}
.rph-id{flex:1;min-width:0}
.rph-nm{font-size:15px;font-weight:600;letter-spacing:-.1px}
.rph-hd{font-size:12px;color:var(--soft);margin-top:1px}
.rph-n{font-size:12px;color:var(--soft);flex:none}
.plop-credit{color:var(--soft)}

/* first-run coach mark on the capture editor */
.tap-coach{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  flex-direction:column;gap:14px;pointer-events:none;z-index:6;
  background:rgba(12,12,14,.34);-webkit-backdrop-filter:blur(1px);backdrop-filter:blur(1px);border-radius:14px}
.tap-coach.on{display:flex;animation:coachIn .3s ease}
@keyframes coachIn{from{opacity:0}to{opacity:1}}
.tc-ring{width:54px;height:54px;border-radius:50%;border:2px solid rgba(255,255,255,.9);
  animation:coachPulse 1.7s ease-out infinite}
@keyframes coachPulse{0%{transform:scale(.75);opacity:.35}60%{transform:scale(1.12);opacity:1}100%{transform:scale(1.3);opacity:0}}
.tc-txt{color:#fff;font-size:14px;line-height:1.45;text-align:center;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.cbtn-primary{background:#161616;color:#fff;border-color:#161616}
.rev-prompt{margin:16px 20px 4px;font-size:17px;font-weight:600;letter-spacing:-.2px;text-align:center}
.pn-grip{display:none}
#mylist.reordering .pn-grip{display:inline-flex}
#mylist.reordering .pnote-item{background:#FAFAF9;border-radius:10px}
.origbtn{display:inline-flex;align-items:center;gap:6px;padding:0 12px 0 10px}
.origbtn .ob-lbl{font-size:13px;font-weight:500;letter-spacing:-.1px}
.origbtn .icon{width:15px;height:15px}
.rev-cap-warn{margin:12px 20px 0;font-size:12px;color:var(--soft);text-align:center}
.author .rp-tag{font-size:11px;font-weight:600;letter-spacing:.3px;text-transform:uppercase;
  color:var(--soft);background:var(--surface);padding:3px 7px;border-radius:5px;margin-left:-2px}
.rp-hist-card{margin:14px 16px 8px;padding:14px 16px;border-radius:16px;
  background:#161616;color:#fff;cursor:pointer}
.rp-hist-card .rph-head{display:flex;align-items:center;gap:10px}
.rp-hist-card .rph-lead{font-size:15px;font-weight:600;letter-spacing:-.1px;flex:1}
.rp-hist-card .chev{color:rgba(255,255,255,.6)}
.rp-hist-card .rph-sub{font-size:12px;color:rgba(255,255,255,.62);margin-top:4px;margin-left:2px}
.rp-hist-card .av{border-color:#161616}
.pp-head{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.pp-head img{width:52px;height:52px;border-radius:10px;object-fit:cover;flex:none;background:var(--surface)}
.pp-t{font-size:20px;font-weight:700;letter-spacing:-.4px}
.pp-s{font-size:13px;color:var(--soft);margin-top:2px}

/* editor · footer actions */
.rev-actions{display:flex;align-items:center;justify-content:space-between;
  margin:28px 20px 0;padding-top:2px}
.rev-discard{background:none;border:0;padding:10px 2px;font-size:15px;color:var(--soft);cursor:pointer}
.rev-next{background:none;border:0;padding:10px 2px;font-size:16px;font-weight:600;
  letter-spacing:-.2px;color:var(--soft);cursor:pointer}
.rev-next.has-marks{color:var(--ink)}
.rev-discard:active,.rev-next:active{opacity:.55}
/* character counter inside the note pill */
.pm-count{display:none;font-size:10px;color:rgba(255,255,255,.55);
  padding:0 8px 5px;text-align:right}
.pm-count.on{display:block}
.pm-count.full{color:#FF6B57}
/* a finished note is at most two lines */
.plop-mark .pm-note{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;text-overflow:ellipsis}
.plop-mark.focused .pm-note{-webkit-line-clamp:unset;overflow:visible}

/* profile · origin segmented control */
.origseg{display:inline-flex;background:var(--surface);border-radius:var(--r-pill);padding:3px;gap:2px}
.oseg{border:0;background:none;padding:7px 15px;border-radius:var(--r-pill);
  font-size:13px;font-weight:500;letter-spacing:-.1px;color:#6f6f73;cursor:pointer;white-space:nowrap}
.oseg.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.07)}

/* reading switcher — flip between how different people marked the same image */
/* The reading row is avatars and nothing else. Slot 0 is always whoever made
   the image, so it carries a permanent hairline ring; the one you are reading
   is filled and slightly larger. No caption, no name, no position readout —
   the marks on the photo say who you are looking at. */
/* A tray, not floating avatars: the action row below is bare icons, so a filled
   surface here reads as a different kind of control at a glance. The tray's own
   padding is what stops the selection ring being clipped — scaling a child
   inside an overflow-x scroller was always going to lose that fight. */
.reading-bar{padding:12px 20px 0}
.rb-avs{display:flex;gap:14px;align-items:center;background:#F2F0EC;border-radius:var(--r-pill);
  padding:9px 16px;overflow-x:auto;scrollbar-width:none}
.rb-avs::-webkit-scrollbar{display:none}
.rb-av{position:relative;flex:none;cursor:pointer;opacity:.42;transition:opacity .16s ease}
.rb-av .av{width:34px;height:34px;font-size:13px;transition:box-shadow .16s ease}
.rb-av.origin .av{box-shadow:0 0 0 2px #F2F0EC, 0 0 0 3.5px #C9C9C9}
.rb-av.on{opacity:1}
.rb-av.on .av{box-shadow:0 0 0 2px #F2F0EC, 0 0 0 4px #161616}
.rb-av:active{opacity:.7}
.rb-more{flex:none;height:34px;min-width:34px;padding:0 11px;border-radius:var(--r-pill);
  background:#fff;color:#5d5d62;font-size:13px;font-weight:600;display:flex;align-items:center;
  justify-content:center;cursor:pointer;margin-left:auto}
  justify-content:center;cursor:pointer}
.hero.swiping .plop-mark{opacity:.25;transition:opacity .12s ease}

/* grid selection */
.pcell{position:relative}
.pcell-tick{display:none;position:absolute;top:7px;right:7px;width:22px;height:22px;border-radius:50%;
  background:#161616;color:#fff;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.pcell-tick svg{width:12px;height:12px}
