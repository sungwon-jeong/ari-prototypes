.pgrid.selecting .pcell{cursor:pointer}
.pgrid.selecting .pcell::after{content:'';position:absolute;inset:0;border:2px solid transparent;border-radius:2px}
.pgrid.selecting .pcell.sel::after{border-color:#161616}
.pgrid.selecting .pcell.sel .pcell-tick{display:flex}
.pgrid.selecting .pcell:not(.sel) img{opacity:.55}
/* Long-press to multi-select is the only way to file photos by hand, and a bare
   grid gives no sign it exists. Retires the moment it is used or dismissed. */
.grid-hint{display:none;margin:0 20px 10px;padding:10px 14px;background:#F4F4F3;border-radius:12px;
  font-size:12.5px;color:var(--soft);align-items:center;gap:8px}
.grid-hint.on{display:flex}
.grid-hint .gh-x{margin-left:auto;color:#a8a8ad;background:none;padding:6px 8px;font-size:13px;cursor:pointer}
/* These are the smallest controls in the app and they are all destructive —
   exactly the wrong combination. Keep them visually small, but grow the hit
   area to 44px with a transparent overlay so the layout is untouched. */
.mn-del,.fx,.note-del,.qn-del,.gh-x{position:relative}
.mn-del::after,.fx::after,.note-del::after,.qn-del::after,.gh-x::after{
  content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:44px;height:44px;border-radius:50%;
}
.sel-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:10px 20px 12px;position:sticky;top:0;background:#fff;z-index:6}
.sel-cancel{background:none;border:0;font-size:15px;color:var(--soft);cursor:pointer;padding:6px 0}
.sel-count{font-size:14px;font-weight:600;letter-spacing:-.1px}
.sel-add{background:#161616;color:#fff;border:0;border-radius:var(--r-pill);
  padding:9px 16px;font-size:14px;font-weight:600;cursor:pointer}
.sel-add:disabled{background:var(--surface);color:var(--soft)}
.ast-row .right{color:var(--soft);font-size:13px}

/* sub-tab manager */
.subtab-manage{position:sticky;right:0;z-index:2;flex:none;width:38px;height:38px;padding:0;
  color:var(--soft);background:#fff;border:1px solid #E2E2E2;
  box-shadow:-10px 0 8px -6px rgba(255,255,255,.95);
  border-radius:var(--r-pill);flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center}
.subtab-manage svg{width:15px;height:15px}
.stm-row{display:flex;align-items:center;gap:10px;padding:12px 2px;border-bottom:1px solid #F2F2F2;cursor:grab}
.stm-row:last-child{border-bottom:0}
.stm-row.drop{outline:2px dashed var(--soft);outline-offset:2px}
.stm-grip{color:#C8C8CC;display:flex;flex:none}
.stm-grip svg{width:16px;height:16px}
.stm-name{flex:1;font-size:15px;font-weight:500;letter-spacing:-.1px;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stm-kind{font-size:11px;color:var(--soft);background:var(--surface);padding:3px 7px;border-radius:5px;flex:none}
.stm-n{font-size:13px;color:var(--soft);min-width:20px;text-align:right;flex:none}
.stm-n.zero{color:#D0443A}
.stm-act{background:none;border:0;padding:6px;color:var(--soft);cursor:pointer;flex:none;display:flex}
.stm-act svg{width:16px;height:16px}
.stm-del{color:#E0442A}
.stm-empty{padding:28px 4px;text-align:center;color:var(--soft);font-size:14px;line-height:1.5}

/* open any post in a published quote chain (mine or someone else's) */
function openMyPlop(img, pid){

    origHandle: orig ? orig.handle : 'sungwon',

document.getElementById('masonry').innerHTML = FEED.map((f,i)=>`

let pressTimer=null, longPressed=false;
function tilePressStart(i){
  longPressed=false;
  clearTimeout(pressTimer);
  pressTimer=setTimeout(()=>{
    longPressed=true;
    if(navigator.vibrate)navigator.vibrate(8);
    openFeedPond(i);
  },480);
}
function tilePressEnd(i){
  clearTimeout(pressTimer);
  if(longPressed){longPressed=false;return;}
  openTile(i);
}
function tilePressCancel(){
  clearTimeout(pressTimer);
}
/* The 160ms delay is the tile's zoom animation. It used to fire unconditionally,
   so a navigation that happened in the meantime got yanked back to this post. */
var _tileNav = null;
function openTile(i){
  const f=FEED[i];
  const tile=document.getElementById('tile-'+i);
  const img=tile?tile.querySelector('img'):null;
  if(img) img.style.transform='scale(1.06)';
  const targetId = f.mine ? 'scr-plop-mine' : 'scr-plop-others';
  populatePlop(targetId, f);
  if(_tileNav) clearTimeout(_tileNav);
  _tileNav = setTimeout(()=>{ _tileNav=null; go(targetId); if(img) img.style.transform=''; },160);
}
function populatePlop(id, f){
  const section = document.getElementById(id);
  if(section){
    section.dataset.img = f.img;
    // plop screens are reused — never let a previous post's chain id linger
    if(f.pid) section.dataset.pid = f.pid; else delete section.dataset.pid;
  }
  const hero = document.getElementById(id+'-hero');
  // Hero image
  if(hero){
    const heroImg = hero.querySelector('img');
    if(heroImg) heroImg.src = IMG[f.img] || heroImg.src;
    // Clear previous marks + pill
    hero.querySelectorAll('.plop-mark').forEach(el=>el.remove());
    const oldPill = hero.querySelector('.marks-pill');
    if(oldPill) oldPill.remove();
  }
  // Title, sub, description
  if(section){
    const t = section.querySelector('.plop-title'); if(t) t.textContent = f.t || '';
    const s = section.querySelector('.plop-sub');
    if(s){
      // Caption sub-line = the ORIGINAL author, pinned. Reposting never
      // rewrites it. Resolve it every time — these screens are reused, so
      // falling back to whatever was here before would show the wrong name.
      const orig = f.origName
        ? {name:f.origName, handle:f.origHandle||'', target:f.origTarget||'scr-other-profile'}
        : originAuthorOf(f.img);
      if(orig){
        section.dataset.origname   = orig.name;
        section.dataset.orighandle = orig.handle||'';
        section.dataset.origtarget = orig.target||'scr-other-profile';
        s.innerHTML = `<span class="plop-credit">Image by </span><span class="plop-author-link" onclick="event.stopPropagation();go('${orig.target||'scr-other-profile'}')">@${esc(orig.handle||'')}</span>`;
      } else {
        delete section.dataset.origname;
        delete section.dataset.orighandle;
        delete section.dataset.origtarget;
        // nobody else made this — the poster is the author
        const own = f.origHandle || section.dataset.authhandle || 'sungwon';
        s.innerHTML = `<span class="plop-credit">Image by </span><span class="plop-author-link">@${esc(own)}</span>`;
      }
    }
    const d = section.querySelector('.plop-desc');
    if(d) d.textContent = f.desc || f.s || '';
  }
  // Quote: attach the original plop below (tap to open it — chain-traversable)
  // Notes — a published quote keeps its own set, others read the shared store
  const notes = plopNotesFor(section, f.img);
  const hasNotes = notes.length > 0;
  // Render reference-style marks (dot + dim pill) — view mode
  renderPlopMarks(id, false);
  // The persistent text list on the detail page is gone — note TEXT now lives
  // only in the profile note view. On the image, marks stay tappable (dim bubble).
  const notesbox = document.getElementById(id+'-notesbox');
  if(notesbox){ notesbox.style.display='none'; notesbox.innerHTML=''; }
  // Reset plopnotes area (for new notes)
  const plopnotes = document.getElementById(id+'-plopnotes');
  if(plopnotes) plopnotes.innerHTML='';
  // Sync SAVED state — marking something means you kept it
  if(hasNotes || f.kept || f.mine) SAVED.add(f.img);
  syncSaveButtons(id);
  syncReadingBar(id, f.img);
  /* The "reposted" badge is gone: the credit line under the title already names
     whoever made the image, and the reading row shows every take on it. */
}
// Deterministic mark positions per image (spread across image)
function markPositionsFor(imgKey, count){
  const seeds = [
    [52, 45], [32, 58], [68, 55], [45, 76], [60, 32], [28, 38],
    [72, 78], [50, 62], [38, 26], [66, 68]
  ];
  const off = ((imgKey||'x').charCodeAt(0) + (imgKey||'x').length) % seeds.length;
  return Array.from({length: count}, (_, i) => {
    const s = seeds[(off + i) % seeds.length];
    return {x: s[0], y: s[1]};
  });
}
/* ---- reference-style marks: white dot / swipe region + dim pill with note text ---- */
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }
/* pill contents — view = text only; selected = input + ONE compact toolbar (move/visibility/delete) */
function pillInnerHtml(text, vis, editable, locked, byHandle){
  const v = VIS_META[vis] ? vis : 'public';
  const vm = VIS_META[v];
  // a private note carries a lock on the resting pill — the dashed outline says
  // "unshared" at a glance, the glyph says it again for anyone who can't separate
  // the two by contrast alone. Public marks stay completely unadorned.
  const lock = v==='private' ? `<span class="pm-lock">${I.lock}</span>` : '';
  // inherited (someone else's) note inside a quote — credited to whoever wrote it,
  // and only removable: keep it as they wrote it, or take it out
  if(locked){
    // the author's handle sits in the toolbar, just left of the trash —
    // so it only shows once you tap the marker, not on the resting pill
    const by = byHandle ? `<span class="pm-by">@${esc(byHandle)}</span>` : '';
    return lock + `<span class="pm-note">${esc(text)}</span>`
      + (editable ? `<span class="pm-bar pm-bar-locked">`
          + by
          + `<button class="pm-del" title="Remove this note" onclick="event.stopPropagation();plopMarkAskDelete(this)" onpointerdown="event.stopPropagation()">${I.trash}</button>`
          + `<button class="pm-cancel" title="Close" onclick="event.stopPropagation();plopMarkCancel(this)" onpointerdown="event.stopPropagation()">${I.close}</button>`
        + `</span>` : '');
  }
  if(!editable) return lock + `<span class="pm-note">${esc(text)}</span>`;
  return `<span class="pm-bar">`
      + `<button class="pm-move" title="Drag to move" onpointerdown="plopMoveStart(event,this)">${I.move}</button>`
      + `<button class="pm-vis nv-${v}" title="${vm.label}" onclick="event.stopPropagation();plopMarkVis(this)" onpointerdown="event.stopPropagation()">${I[vm.icon]}</button>`
      + `<button class="pm-del" title="Delete" onclick="event.stopPropagation();plopMarkAskDelete(this)" onpointerdown="event.stopPropagation()">${I.trash}</button>`
      + `<button class="pm-cancel" title="Cancel edit" onclick="event.stopPropagation();plopMarkCancel(this)" onpointerdown="event.stopPropagation()">${I.close}</button>`
    + `</span>`
    + `<input class="pm-input" maxlength="${NOTE_MAXLEN}" placeholder="What caught your eye?" value="${esc(text)}" oninput="event.stopPropagation();this.closest('.plop-mark').dataset.text=this.value;markCount(this)" onclick="event.stopPropagation()" onpointerdown="event.stopPropagation()" onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur();commitMark(this.closest('.plop-mark'));}">`
    + `<span class="pm-count"></span>`;
}
/* (re)build a mark element's inner markup from its dataset */
function rebuildMark(el, editable){
  const isLasso = el.classList.contains('lasso');
  const text = el.dataset.text || '';
  const vis = el.dataset.vis || 'public';
  const locked = el.dataset.inherited === '1';   // someone else's note carried into a quote
  const byHandle = locked ? (el.dataset.authorHandle || '') : '';
  el.classList.toggle('editing', !!editable);
  el.classList.toggle('locked', locked);
  el.classList.toggle('dotonly', !isLasso && !text && !editable);
  if(isLasso){
    const b = (el.dataset.bbox||'').split(',').map(Number);
    let pts=[]; try{ pts = JSON.parse(el.dataset.pts||'[]'); }catch(e){}
    const dstr = pts.length ? ('M'+pts.map(p=>p[0].toFixed(2)+' '+p[1].toFixed(2)).join('L')+'Z') : '';
    el.innerHTML = `<svg class="lasso-svg" viewBox="${b[0]} ${b[1]} ${b[2]||1} ${b[3]||1}" preserveAspectRatio="none"><path class="lasso-path" d="${dstr}"/></svg>`
      + `<span class="pm-pill">${pillInnerHtml(text, vis, editable, locked, byHandle)}</span>`;
  } else {
    el.innerHTML = `<span class="pm-dot"></span><span class="pm-pill">${pillInnerHtml(text, vis, editable, locked, byHandle)}</span>`;
  }
  el.setAttribute('onpointerdown','event.stopPropagation()');
  el.setAttribute('onclick', editable ? 'event.stopPropagation()' : 'plopMarkReedit(this)');
}
function plopMarkEl(x, y, opt){
  opt = opt || {};
  const el = document.createElement('div');
  const flip = x > 50;                       // 58 opened past the right edge
  el.className = 'plop-mark' + (flip?' flip':'') + (opt.free?' freeNote':'');
  el.style.left = x + '%'; el.style.top = y + '%';
  // room on the side the pill actually opens toward, floored so a mark in the
  // corner still gets a readable pill rather than a two-word sliver
  const room = flip ? x : (100 - x);
  el.style.maxWidth = 'max(150px, calc(' + room.toFixed(1) + '% - 16px))';
  el.dataset.x = x; el.dataset.y = y;
  el.dataset.vis = VIS_META[opt.vis] ? opt.vis : 'public';
  el.dataset.text = opt.text || '';
  if(opt.free) el.dataset.free = '1';
  if(opt.inherited) el.dataset.inherited = '1';

function collectPlopNotes(id, persist){
  if(persist===undefined) persist = true;
  const sec = document.getElementById(id);
  const img = sec && sec.dataset ? sec.dataset.img : null;
  if(!img) return [];
  const hero = document.getElementById(id+'-hero');
  const out = [];
  hero.querySelectorAll('.plop-mark').forEach(el=>{

    const noteEl = el.querySelector('.pm-note');
    const txt = (inp ? inp.value : (noteEl ? noteEl.textContent : '')).trim();
    if(!txt) return;
    const entry = {text: txt.slice(0,NOTE_MAXLEN), visibility: el.dataset.vis||'public'};
    if(el.dataset.inherited === '1'){
      entry.inherited = true;
      if(el.dataset.authorName) entry.authorName = el.dataset.authorName;
      if(el.dataset.authorHandle) entry.authorHandle = el.dataset.authorHandle;
    }
    if(el.classList.contains('lasso') && el.dataset.pts){
      try{ entry.shape = {pts: JSON.parse(el.dataset.pts), bbox: (el.dataset.bbox||'').split(',').map(Number)}; }catch(e){}
    } else if(el.dataset.free === '1'){
      entry.pos = {x: +el.dataset.x, y: +el.dataset.y};
    } else {
      entry.pos = {x: +el.dataset.x, y: +el.dataset.y};
    }

  });

  MARKNOTES[img] = out;

function currentGridItems(){

  try { pond = PROFILE_STATE.pond; active = PROFILE_STATE.activeSubs; } catch(e){}
  let items = MYGRID.slice();
  // 1) POND — always narrows to the selected pond's members
  if(pond && pond!=='All'){
    const members = (typeof POND_MEMBERS!=='undefined' && POND_MEMBERS[pond]) || [];

/* ---------- in-app prompt / confirm ----------
   Browser prompt() and confirm() are blocking, unstyled and don't exist in a
   native app. Everything that used to call them now routes through these two
   sheets. Both take a callback so the caller can restore whatever was open
   underneath (the sub-tab manager, mostly). */
var _psCb=null, _pcCb=null, _psCancelCb=null, _pcCancelCb=null;

function askText(o){
  o=o||{};
  _psCb=o.cb||null; _psCancelCb=o.onCancel||null;
  var multi=!!o.multiline, max=o.max||40;
  document.getElementById('ps-title').textContent=o.title||'';
  var sub=document.getElementById('ps-sub');
  sub.textContent=o.sub||''; sub.style.display=o.sub?'':'none';
  document.getElementById('ps-lab').textContent=o.label||'NAME';
  document.getElementById('ps-go').textContent=o.cta||'Save';
  var inp=document.getElementById('ps-input'), area=document.getElementById('ps-area');
  inp.style.display=multi?'none':''; area.style.display=multi?'':'none';
  var el=multi?area:inp;
  el.maxLength=max; el.value=o.value||''; el.placeholder=o.placeholder||'';
  psCount();
  openSheet('prompt-sheet');
  setTimeout(function(){ try{ el.focus(); if(!multi) el.select(); }catch(e){} },160);
}
function psEl(){ var a=document.getElementById('ps-area');
  return (a && a.style.display!=='none') ? a : document.getElementById('ps-input'); }
function psCount(){
  var el=psEl(), n=(el.value||'').length, m=el.maxLength||40;
  var c=document.getElementById('ps-count');
  c.textContent = n > m-12 ? (n+' / '+m) : '';
  document.getElementById('ps-go').disabled = !(el.value||'').trim();
  document.getElementById('ps-go').style.opacity = (el.value||'').trim() ? 1 : .35;
}
function psCommit(){
  var v=(psEl().value||'').trim(); if(!v) return;
  var cb=_psCb; _psCb=null; _psCancelCb=null;
  closeSheet('prompt-sheet');
  if(cb) cb(v);
}
function psCancel(){
  var cb=_psCancelCb; _psCb=null; _psCancelCb=null;
  closeSheet('prompt-sheet'); if(cb) cb();
}
function askConfirm(o){
  o=o||{};
  _pcCb=o.cb||null; _pcCancelCb=o.onCancel||null;
  document.getElementById('pc-title').textContent=o.title||'Are you sure?';
  var sub=document.getElementById('pc-sub');
  sub.textContent=o.sub||''; sub.style.display=o.sub?'':'none';
  var go=document.getElementById('pc-go');
  go.textContent=o.cta||'Confirm';
  go.className='sc2'+(o.danger?' red':'');
  openSheet('confirm-sheet');
}
function pcGo(){ var cb=_pcCb; _pcCb=null; _pcCancelCb=null; closeSheet('confirm-sheet'); if(cb) cb(); }
function pcCancel(){ var cb=_pcCancelCb; _pcCb=null; _pcCancelCb=null; closeSheet('confirm-sheet'); if(cb) cb(); }

  'privacy-full':{title:`Privacy Policy`,body:`<p class="set-note">Full text · Last updated July 2026.</p><p class="set-body">1. Information we collect. We collect the account details you provide, the plops and notes you save, and basic usage data needed to run the service.</p><p class="set-body">2. How we use information. To operate and improve Ari, personalize Discoveries, and keep accounts secure. We do not sell your personal information.</p><p class="set-body">3. Sharing. Your private notes are never shared. Public ponds are visible to others you allow.</p><p class="set-body">4. Your choices. You can access, download, or delete your information at any time from Accounts Center.</p><p class="set-body">5. Contact. Questions? Reach us through Help, then Support requests.</p>`},

let _setStack=[], _curSet=null;
function renderSetting(key){
  const c=SETPAGES[key]; if(!c) return false;
  document.getElementById('set-detail-title').textContent=c.title;
  document.getElementById('set-detail-body').innerHTML=c.body;
  const sp=document.querySelector('#scr-set-detail .scrollpage'); if(sp) sp.scrollTop=0;
  return true;
}
function openSetting(key){
  if(!SETPAGES[key]) return;
  const onDetail=document.getElementById('scr-set-detail').classList.contains('active');
  if(onDetail && _curSet) _setStack.push(_curSet);
  _curSet=key;
  renderSetting(key);
  if(!onDetail){ _setStack=[]; go('scr-set-detail'); }
}
function settingsBack(){
  if(_setStack.length){ _curSet=_setStack.pop(); renderSetting(_curSet); }
  else { _curSet=null; goBack('scr-settings'); }
}
function pauseAllNotif(el){
  el.classList.toggle('off');
  const paused=!el.classList.contains('off');
  document.querySelectorAll('#set-detail-body .notif-tog').forEach(function(t){ t.classList.toggle('off', paused); });
}

/* A save has to actually land somewhere: it joins the pond, shows up in My Pond
   and gets filed by the classifier. Before this it only flipped a button. */
function keepImage(img, pond){
  if(!img) return;
  SAVED.add(img);
  SAVED_IMGS.add(img);
  const m = (POND_MEMBERS[pond] = POND_MEMBERS[pond] || []);
  if(!m.includes(img)) m.push(img);
  Object.keys(POND_MEMBERS).forEach(p=>{        // one pond per photo
    if(p===pond) return;
    const i=POND_MEMBERS[p].indexOf(img); if(i>=0) POND_MEMBERS[p].splice(i,1);
  });
  if(!MYGRID.some(c=>c.img===img)) MYGRID.unshift({img});
  const pd=_PONDS.find(p=>p.name===pond); if(pd) pd.count=(POND_MEMBERS[pond]||[]).length;
  const all=_PONDS.find(p=>p.name==='All'); if(all) all.count=MYGRID.length;
  if(typeof autoClassify==='function') autoClassify(img, pond);
  if(typeof renderMyGrid==='function' && document.getElementById('mygrid')) renderMyGrid();
  if(typeof renderSubtabs==='function') renderSubtabs();
}
function unkeepImage(img){
  if(!img) return;
  SAVED.delete(img); SAVED_IMGS.delete(img);
  Object.keys(POND_MEMBERS).forEach(p=>{
    const i=POND_MEMBERS[p].indexOf(img); if(i>=0) POND_MEMBERS[p].splice(i,1);
  });
  subtabsOf('All'); Object.keys(SUBTABS).forEach(p=>subtabsOf(p).forEach(s=>{
    let i=s.autoIds.indexOf(img);   if(i>=0) s.autoIds.splice(i,1);
    i=s.manualIds.indexOf(img);     if(i>=0) s.manualIds.splice(i,1);
  }));
  const gi=MYGRID.findIndex(c=>c.img===img); if(gi>=0) MYGRID.splice(gi,1);
  if(typeof renderMyGrid==='function' && document.getElementById('mygrid')) renderMyGrid();
  if(typeof renderSubtabs==='function') renderSubtabs();
}

/* ---------- Repost · fork the image with the source's public marks seeded ---------- */
function openRepostEditor(srcId){
  const sec=document.getElementById(srcId); if(!sec) return;
  const img=sec.dataset ? sec.dataset.img : null;
  if(!img){ toast('Nothing to repost'); return; }
  // reposting is for someone else's post; your own is just... your post
  if(srcId==='scr-plop-mine' || (sec.dataset.authhandle||'')===ME_HANDLE){
    toast("This one's already yours"); return;
  }
  // REPOST.pending is read (and cleared) by openEditor on the very next line of
  // execution. Attribution is NOT stored here — REPOST_SOURCE is the single source
  // of truth for who made an image; a second copy only ever drifts out of sync.
  REPOST.pending=true; REPOST.srcId=srcId; REPOST.img=img;
  // the source's caption comes along pre-filled — everything in a repost is
  // yours to change; only the image credit stays with whoever made it
  const srcCap = (sec.querySelector('.plop-desc')||{}).textContent || '';
  const srcTitle = (sec.querySelector('.plop-title')||{}).textContent || '';
  openEditor(img,'','');                   // reuses the capture editor
  const dsc=document.getElementById('f-desc'); if(dsc) dsc.value = srcCap;
  if(srcTitle){
    const trow=document.getElementById('f-title-row'), tin=document.getElementById('f-title');
    if(trow) trow.style.display='flex';
    if(tin) tin.value = srcTitle;
  }
  refreshClearAll();
  document.getElementById('rev-head-t').textContent='Repost';
  const hero=document.getElementById('scr-review-hero');
  // Seed whatever the user is ACTUALLY looking at. If they swiped to Jinyoung's
  // reading and hit repost, seeding the original author's marks would hand them
  // something different from what was on screen.
  const viewing = (_readingId===srcId && _readings[_readingIdx]) ? _readings[_readingIdx] : null;
  const seeded = (viewing && !viewing.original)
    ? (viewing.notes||[]).filter(n=>n.visibility!=='private')
    : _sourcePublicNotes(img);
  if(viewing && !viewing.original) track('repost_of_reading', {img, who:viewing.who.handle});
  const pos=markPositionsFor(img, seeded.length);
  seeded.slice(0, MARK_CAP).forEach((n,i)=>{
    const p=(n.pos && isFinite(n.pos.x)) ? n.pos : pos[i % pos.length];
    hero.appendChild(plopMarkEl(p.x, freeBandY(hero, p.y, null), {text:n.text, vis:'public', editable:false}));
  });
  hero.classList.add('marks-on');
  refreshMarkCount();
  track('repost_started', {img, seeded:seeded.length});
}

function stmRename(i){
  const pond=PROFILE_STATE.pond, s=subtabsOf(pond)[i]; if(!s) return;
  const was=s.name;
  askText({title:'Rename sub-tab', value:was, max:24, cta:'Save',
    sub: s.rule ? 'Photos refile themselves to match the new name. Anything you placed by hand stays put.' : '',
    cb:function(name){
      if(name===was) return;
      if(subtabByName(pond,name)){ toast('That one already exists'); return; }
      const d = s.rule ? resortPreview(pond, s, name) : {added:0, removed:0};
      const commit = function(){
        s.label = s.name = name;
        // renaming RE-TARGETS the tab — it does not switch auto-filling off.
        // Killing auto on rename punished anyone who just preferred another word.
        if(s.rule) { s.rule = name; resortTab(pond, s); }
        if(PROFILE_STATE.activeSubs.has(was)){ PROFILE_STATE.activeSubs.delete(was); PROFILE_STATE.activeSubs.add(name); }
        renderSubtabManager(); renderSubtabs(); renderMyGrid();
        track('subtab_renamed', {pond, from:was, to:name, added:d.added, removed:d.removed});
      };
      // a big swing gets a look before it happens
      if(d.added + d.removed >= 5){
        askConfirm({title:`Refile ${d.added + d.removed} photos?`,
          sub:`"${name}" will take in ${d.added} and let go of ${d.removed}. Anything you filed by hand stays.`,
          cta:'Rename', cb:commit});

    }});

   fills them from the grid. Counts are derived, never stored, so they can't
   drift away from what's actually in there. */
/* ---------- sub-tab model ----------
   A sub-tab is a name the USER chose. The classifier only fills it.

     label      what you see and rename
     rule       what the classifier matches against. Same as label until you
                switch auto-filling off, at which point it is null and the tab
                stops changing on its own.
     source     'user' (you declared it) | 'suggested' (we proposed it)
     autoIds    filled by the classifier — wiped and rebuilt on every re-sort
     manualIds  put there by you — NEVER touched by a re-sort

   The auto/manual split is the whole point: renaming a tab re-targets it and
   re-files every photo, but anything you placed by hand survives that.

   NOTE(spec): production also needs `excludedIds` — photos you took OUT of an
   auto tab. Without it a classifier upgrade re-scores everything and silently
   undoes every manual removal your users ever made. Left out of the prototype
   because there is no model swap here to observe it.                        */

/* The demo account is on PRO — the seeded ponds carry 5-6 sub-tabs, which is
   past the free ceiling, and a walkthrough should show the finished feature.
   Flip this to false to walk the paywall instead; every limit path still runs. */
var IS_PRO = true;
const UNSORTED = 'Unsorted';      // reserved label — never user-created
const SUBTAB_PRESETS = {
  Interior : ['Stairs','Colour','Living room','Bedroom','Lamp','Material'],
  Fashion  : ['Silhouette','Material','Colour','Styling','Detail'],
  Graphic  : ['Type','Layout','Colour','Print','Logo'],
  Research : ['Reference','Counter-example','Method','Quote']
};
const SUBTAB_MAX = 20;            // per pond, hard ceiling
const SUBTAB_FREE = 3;            // per pond on the free plan
const MEMBERSHIP_MAX = 3;         // tabs one photo may land in. quality bound,
                                  // NOT a paid tier — a photo silently missing
                                  // from a tab reads as a broken classifier.

function autoIdsFor(rule){
  if(!rule) return [];
  const r = String(rule).toLowerCase();
  return Object.keys(IMAGE_CATEGORIES)
    .filter(k => (IMAGE_CATEGORIES[k]||[]).some(t => String(t).toLowerCase()===r));
}
/* seeds in SUBTABS are written in the old shape; upgrade them on first touch
   so the literals stay readable and load order stops mattering */
function normTab(s){
  if(s && s._n) return s;
  if(!s) return s;
  s.label = s.label || s.name;
  s.name  = s.label;                       // .name kept as an alias for call sites
  if(s.rule === undefined)   s.rule = s.label;
  if(s.source === undefined) s.source = 'user';
  if(s.hidden === undefined) s.hidden = false;
  if(!s.autoIds)   s.autoIds   = autoIdsFor(s.rule);   // rule null ⇒ []
  if(!s.manualIds) s.manualIds = (s.members || []).slice();
  delete s.members; delete s.auto; delete s.count;
  s._n = true;
  return s;
}
function subtabsOf(pond){
  const list = (SUBTABS[pond] = SUBTABS[pond] || []);
  list.forEach(normTab);
  return list;
}
/* the visible ones — hidden tabs still hold their memberships */
function liveSubtabs(pond){ return subtabsOf(pond).filter(s=>!s.hidden); }
function subtabByName(pond, name){
  // case-insensitive: "Lamp" and "lamp" are one tab to a person, and letting
  // both exist splits one pile into two that look identical
  const k=String(name||'').trim().toLowerCase();
  return subtabsOf(pond).find(s=>String(s.label).trim().toLowerCase()===k);
}

function membersOf(pond, name){
  const s = subtabByName(pond, name); if(!s) return [];
  const out = s.autoIds.slice();
  s.manualIds.forEach(k=>{ if(!out.includes(k)) out.push(k); });
  return out;
}
function subtabCount(pond, name){
  if(name===UNSORTED) return unsortedOf(pond).length;
  const inPond = (pond==='All') ? null : ((POND_MEMBERS[pond])||[]);
  return membersOf(pond, name).filter(k=>!inPond || inPond.includes(k)).length;
}
function addToSubtab(pond, name, keys){
  const s = subtabByName(pond, name); if(!s) return 0;
  let added=0;
  keys.forEach(k=>{ if(!s.manualIds.includes(k)){ s.manualIds.push(k); added++; } });
  track('subtab_assigned', {pond, name, added});
  return added;
}
function removeFromSubtab(pond, name, key){
  const s = subtabByName(pond, name); if(!s) return;
  let i = s.manualIds.indexOf(key); if(i>=0) s.manualIds.splice(i,1);
  i = s.autoIds.indexOf(key);       if(i>=0) s.autoIds.splice(i,1);
  // production would record this in excludedIds so a re-sort cannot undo it
}
/* re-target a tab and re-file everything. manual placements are untouched. */
function resortTab(pond, s){
  normTab(s);
  s.autoIds = s.rule ? autoIdsFor(s.rule) : s.autoIds;
  return s;
}
/* Unsorted is computed, never stored: whatever the pond holds that no live tab
   claims. A photo the classifier could not place has to be visible somewhere —
   silently dropping it is how people conclude the feature is broken. */
function unsortedOf(pond){
  const inPond = (pond==='All') ? null : ((POND_MEMBERS[pond])||[]);
  const all = MYGRID.map(c=>c.img).filter(k=>!inPond || inPond.includes(k));
  const claimed = new Set();
  liveSubtabs(pond).forEach(s=>{ if(s.label!==UNSORTED) membersOf(pond,s.label).forEach(k=>claimed.add(k)); });
  return all.filter(k=>!claimed.has(k));
}
function subtabLimit(){ return IS_PRO ? SUBTAB_MAX : SUBTAB_FREE; }
function atSubtabLimit(pond){
  if(liveSubtabs(pond).length < subtabLimit()) return false;
  if(!IS_PRO){ closeSheet('subtab-manager'); openSheet('pro-sheet'); }
  else toast(`Up to ${SUBTAB_MAX} sub-tabs per pond`);
  return true;
}

/* ---------- (a) auto classification on save ----------
   Stands in for the Vision call: reads the tags already on the photo and
   files it under any matching sub-tab, creating one when enough photos
   share a tag. */
/* Files a freshly saved photo into the tabs the user already declared.
   It never invents a tab: the taxonomy is the user's to choose, and a photo
   that fits nothing lands in Unsorted rather than spawning a chip nobody asked
   for. No minimum photo count either — one photo is enough to belong. */
function autoClassify(imgKey, pond){
  if(!POND_META[pond] || POND_META[pond].autoDetect === false) return [];
  const tags = (IMAGE_CATEGORIES[imgKey] || []).map(t=>String(t).toLowerCase());
  const applied = [];
  liveSubtabs(pond).forEach(s=>{
    if(applied.length >= MEMBERSHIP_MAX) return;
    if(!s.rule) return;                                  // auto-filling switched off
    if(!tags.includes(String(s.rule).toLowerCase())) return;
    if(!s.autoIds.includes(imgKey)) s.autoIds.push(imgKey);
    applied.push(s.label);
  });
  track(applied.length ? 'subtab_auto_applied' : 'subtab_unsorted',
        {img:imgKey, pond, tabs:applied});
  return applied;
}

/* ---------- reading switcher ----------
   Slot 0 is always whoever made the image. After that come reposters —
   people I follow first, then most recent. Six slots on screen; anything
   past that lives behind the +N overflow sheet. */
const READ_SLOTS = 6;                  // avatars shown inline, original included
var _readings = [];                    // [{who, notes, pid}] for the open post
var _readingIdx = 0;
var _readingId = null;

function buildReadings(id, img){
  const sec=document.getElementById(id);
  const orig = (typeof originAuthorOf==='function' && originAuthorOf(img))
            || {name: sec.dataset.authname||'', handle: sec.dataset.authhandle||'',
                l: sec.dataset.authl||'', g: sec.dataset.authg||'g5'};
  const base = [{who:{name:orig.name, handle:orig.handle, avL:orig.l||orig.avL||(orig.name||'?')[0], avG:orig.g||orig.avG||'g5'},
                 notes:(typeof MARKNOTES!=='undefined' && MARKNOTES[img]) || [], original:true}];
  const reposts = (typeof repostsFor==='function' ? repostsFor(img) : []).map(r=>({who:r, notes:r.notes}));
  // people I follow first, then whatever order they came in (newest first)
  reposts.sort((a,b)=>{
    const fa = (typeof FOLLOWING!=='undefined' && FOLLOWING.has(a.who.handle)) ? 0 : 1;
    const fb = (typeof FOLLOWING!=='undefined' && FOLLOWING.has(b.who.handle)) ? 0 : 1;
    return fa-fb;
  });
  return base.concat(reposts);
}

function syncReadingBar(id, img){
  const bar=document.getElementById(id+'-readbar'); if(!bar) return;
  _readings = buildReadings(id, img);
  // always open on the original. Following changes the ORDER of the avatars,
  // never which one is selected — a post that looks different every time you
  // scroll past it is a post you cannot find again.
  _readingIdx = 0; _readingId = id;
  if(_readings.length < 2){ bar.style.display='none'; return; }   // nobody else read it
  bar.style.display='';
  const shown=_readings.slice(0, READ_SLOTS);
  const extra=_readings.length - shown.length;
  const avs=document.getElementById(id+'-rb-avs');
  avs.innerHTML = shown.map((r,i)=>
      `<span class="rb-av ${i===0?'origin ':''}${i===0?'on':''}" title="${esc(r.who.name)}" onclick="pickReading(${i})">${av(r.who.avL, r.who.avG)}</span>`).join('')
    + (extra>0 ? `<button class="rb-more" onclick="event.stopPropagation();openRepostHistory('${id}')">+${extra}</button>` : '');
}


function pickReading(i){
  const id=_readingId; const r=_readings[i]; if(!r) return;
  _readingIdx=i;
  document.querySelectorAll('#'+id+'-rb-avs .rb-av').forEach((el,k)=>el.classList.toggle('on', k===i));
  track('reading_picked', {idx:i});
  const hero=document.getElementById(id+'-hero'); if(!hero) return;
  hero.querySelectorAll('.plop-mark').forEach(el=>el.remove());
  const img=document.getElementById(id).dataset.img;
  const pos=markPositionsFor(img, r.notes.length);
  r.notes.forEach((n,k)=>{
    const p=(n.pos && isFinite(n.pos.x)) ? n.pos : pos[k % pos.length];
    hero.appendChild(plopMarkEl(p.x, freeBandY(hero, p.y, null),
      {text:n.text, vis:n.visibility||'public', editable:false}));
  });
  hero.classList.add('marks-on');
  track('reading_switched', {img, idx:i, original:!!r.original});
}


/* ---------- Repost history ---------- */
function repostsFor(img){ return (typeof REPOST_HISTORY!=='undefined' && REPOST_HISTORY[img]) || []; }
/* The "N people marked this differently" card is gone. It restated what the
   reading switcher shows directly above it, and two controls describing one
   fact make the reader stop and work out the difference. Overflow now lives on
   the switcher's own chevron. */
function openRepostHistory(id){
  const sec=document.getElementById(id);
  const img=sec && sec.dataset ? sec.dataset.img : null;
  _rpHistImg=img;
  const list=repostsFor(img);
  const box=document.getElementById('rp-hist-list');
  const head=document.getElementById('rp-hist-count');
  if(head) head.textContent = list.length===1 ? '1 version' : `${list.length} versions`;
  if(box) box.innerHTML = list.map((r,i)=>`
    <div class="rph-row" onclick="openRepostVersion(${i})">

      <div class="rph-n">${r.notes.length} mark${r.notes.length>1?'s':''}</div>
      <span class="chev">›</span>
    </div>`).join('');

}
function openRepostVersion(i){
  const list=repostsFor(_rpHistImg); const r=list[i]; if(!r) return;
  closeSheet('repost-history');
  const base=(typeof FEED_BY_ID!=='undefined' && FEED_BY_ID[_rpHistImg]) || {img:_rpHistImg,t:'',s:'',desc:''};
  // their fork: same image, their marks, credit still points at whoever made it

  const f=Object.assign({}, base, {img:_rpHistImg, mine:0,

  populatePlop('scr-plop-others', f);

           sec.dataset.authl=r.avL; sec.dataset.authg=r.avG; sec.dataset.authtarget='scr-other-profile'; }
  // paint their marks over the shared ones

    hero.querySelectorAll('.plop-mark').forEach(el=>el.remove());

const REPOST = {srcId:null, img:null, pending:false};
var _batchSuppressCoach = false;


/* The coach mark teaches one thing — that the photo is tappable — and it only
   earns the right to say it once. It is counted the moment it is DISPLAYED, not
   when it is dismissed: a user who opens the editor and hits Skip has still been
   shown the lesson, and must not be taught again. In the real app _coachSeen is
   persisted per user; a session variable here would re-teach on every cold start. */
const COACH_MAX = 1;
var _coachSeen = 0;                    // TODO(app): persist per user, not per session
function showCoach(allow){
  const el=document.getElementById('rev-coach'); if(!el) return;
  const show = allow===true && _coachSeen < COACH_MAX && markCountOf('scr-review')===0;
  el.classList.toggle('on', show);
  if(show) _coachSeen++;
}
function hideCoach(){
  const el=document.getElementById('rev-coach');
  if(el) el.classList.remove('on');
}


/* live character counter — only shows once you're near the limit */
function markCount(inp){
  const el = inp.closest('.plop-mark'); if(!el) return;
  const box = el.querySelector('.pm-count'); if(!box) return;
  const n = inp.value.length;
  const near = n >= NOTE_MAXLEN - 20;      // ~50자부터 보여줘야 갑자기 막히지 않음
  box.textContent = near ? n + '/' + NOTE_MAXLEN : '';
  box.classList.toggle('on', near);
  box.classList.toggle('full', n >= NOTE_MAXLEN);
}


/* ---------- marks never overlap ----------
   A pill can run to two lines, so each mark reserves a horizontal band tall
   enough to hold one. New marks snap to the nearest FREE band instead of
   landing exactly where the finger did — a small compromise that guarantees
   every note stays readable. */
const BAND_H = 17;                 // % of image height reserved per mark
const BAND_TOP = 6, BAND_BOTTOM = 94;
function bandIndexOf(y){
  return Math.round((y - BAND_TOP) / BAND_H);
}
function bandCentre(i){
  return Math.min(BAND_BOTTOM, Math.max(BAND_TOP, BAND_TOP + i * BAND_H));
}
function occupiedBands(hero, except){
  const used = new Set();
  hero.querySelectorAll('.plop-mark').forEach(el=>{
    if(el===except) return;
    const y = parseFloat(el.dataset.y);
    if(isFinite(y)) used.add(bandIndexOf(y));
  });
  return used;
}
/* nearest free band to the tapped point, searching down then up */
function freeBandY(hero, y, except){
  const maxBand = Math.floor((BAND_BOTTOM - BAND_TOP) / BAND_H);
  const used = occupiedBands(hero, except);
  const want = Math.min(maxBand, Math.max(0, bandIndexOf(y)));
  if(!used.has(want)) return bandCentre(want);
  for(let d=1; d<=maxBand; d++){
    if(want+d <= maxBand && !used.has(want+d)) return bandCentre(want+d);
    if(want-d >= 0        && !used.has(want-d)) return bandCentre(want-d);
  }
  return bandCentre(want);
}

/* ---------- marks: cap + counter ---------- */
const MARK_CAP = 5;
function markCountOf(id){
  // an empty pill is not a mark yet — it disappears the moment it's committed,
  // so it must not inflate the count or claim a band
  const hero=document.getElementById(id+'-hero');
  if(!hero) return 0;
  let n=0;
  hero.querySelectorAll('.plop-mark').forEach(el=>{
    const inp=el.querySelector('.pm-input');
    const txt=(inp ? inp.value : (el.dataset.text||'')).trim();
    if(txt) n++;
  });
  return n;
}
function hasEmptyMark(id){
  const hero=document.getElementById(id+'-hero'); if(!hero) return false;
  return [...hero.querySelectorAll('.plop-mark')].some(el=>{
    const inp=el.querySelector('.pm-input');
    return !((inp ? inp.value : (el.dataset.text||'')).trim());
  });
}
function markCapReached(id){ return markCountOf(id) >= MARK_CAP; }
function refreshMarkCount(){
  const n=markCountOf('scr-review');
  if(n) hideCoach();                    // the lesson is over the moment it lands
  const warn=document.getElementById('rev-cap-warn');
  if(warn){
    warn.style.display = (n===MARK_CAP-1 || n===MARK_CAP) ? 'block' : 'none';
    warn.textContent = n===MARK_CAP ? `${MARK_CAP} marks — that's the limit`
                                    : 'One more mark left';
  }
  const btn=document.getElementById('rev-next-btn');
  if(btn) btn.textContent = n ? 'Next →'
    : (batchLabel==='Reflection' ? 'Nothing today' : 'Skip');
  if(btn) btn.classList.toggle('has-marks', n>0);
}

/* ---------- event log (wired to PostHog later) ---------- */
const TRACK=[]; window.TRACK=TRACK;
function track(name, props){
  TRACK.push({name, props:props||{}, t:Date.now()});
  if(window.posthog && window.posthog.capture) window.posthog.capture(name, props||{});
}

function plopEditing(id){
  if(id==='scr-review') return true;          // the capture editor is always annotatable
  const nb=document.getElementById(id+'-notebtn');
  return !!(nb && nb.classList.contains('open'));
}
/* ---------- swipe the photo to page through readings ----------
   Marking owns the pointer whenever the editor is armed, so this only ever runs
   on a resting post — where a drag previously did nothing at all. Horizontal
   intent is required (1.4x the vertical travel) so the page still scrolls. */
var _rswipe=null;
const SWIPE_MIN=44;
function readSwipeStart(id,evt){
  if(_readingId!==id || _readings.length<2) return;
  _rswipe={id, x:evt.clientX, y:evt.clientY, live:false};
}
function readSwipeMove(evt){
  if(!_rswipe) return;
  const dx=evt.clientX-_rswipe.x, dy=evt.clientY-_rswipe.y;
  if(!_rswipe.live && Math.abs(dx)>10 && Math.abs(dx)>Math.abs(dy)*1.4){
    _rswipe.live=true;
    const h=document.getElementById(_rswipe.id+'-hero'); if(h) h.classList.add('swiping');
  }
  if(_rswipe.live) _rswipe.dx=dx;
}
function readSwipeEnd(){
  const g=_rswipe; _rswipe=null; if(!g) return;
  const h=document.getElementById(g.id+'-hero'); if(h) h.classList.remove('swiping');
  if(!g.live || Math.abs(g.dx||0) < SWIPE_MIN) return;
  const dir = g.dx < 0 ? 1 : -1;                      // drag left = next reading
  const next = _readingIdx + dir;
  if(next < 0 || next >= _readings.length){
    toast(dir>0 ? 'That is the last reading' : 'Back at the original');
    return;
  }
  pickReading(next);
  track('reading_swiped', {dir});
}
function plopPointerDown(id,evt){
  if(!plopEditing(id)){ readSwipeStart(id,evt); return; }
  const hero=document.getElementById(id+'-hero');
  const img=hero.querySelector('img');
  const rect=img.getBoundingClientRect();
  if(evt.clientX<rect.left||evt.clientX>rect.right||evt.clientY<rect.top||evt.clientY>rect.bottom) return;
  const sx=((evt.clientX-rect.left)/rect.width)*100;
  const sy=((evt.clientY-rect.top)/rect.height)*100;
  plopDrag={id, hero, rect, sx, sy, moved:false, pts:[[sx,sy]], lassoEl:null};
  try{ hero.setPointerCapture(evt.pointerId); plopDrag.pointerId=evt.pointerId; }catch(e){}
  if(evt.preventDefault) evt.preventDefault();
}
function updateLassoPath(d,close){
  const pts=d.pts;
  if(!pts.length){ d.path.setAttribute('d',''); return; }
  let s='M'+pts.map(p=>p[0].toFixed(2)+' '+p[1].toFixed(2)).join('L');
  if(close) s+='Z';
  d.path.setAttribute('d',s);
}
function plopPointerMove(id,evt){
  if(_rswipe && _rswipe.id===id){ readSwipeMove(evt); return; }
  if(!plopDrag || plopDrag.id!==id) return;
  const g=plopDrag;
  const cx=Math.min(Math.max(((evt.clientX-g.rect.left)/g.rect.width)*100,0),100);
  const cy=Math.min(Math.max(((evt.clientY-g.rect.top)/g.rect.height)*100,0),100);
  if(!g.moved && (Math.abs(cx-g.sx)+Math.abs(cy-g.sy)) > 2.5){
    // it's a drag → start a region draw
    g.moved=true;
    deselectAllMarks(id);
    const el=document.createElement('div');
    el.className='plop-mark lasso drawing';
    el.style.left='0%'; el.style.top='0%'; el.style.width='100%'; el.style.height='100%';
    const svg=document.createElementNS(SVGNS,'svg');
    svg.setAttribute('class','lasso-svg'); svg.setAttribute('viewBox','0 0 100 100'); svg.setAttribute('preserveAspectRatio','none');
    const path=document.createElementNS(SVGNS,'path'); path.setAttribute('class','lasso-path');
    svg.appendChild(path); el.appendChild(svg);
    g.hero.classList.add('marks-on'); g.hero.appendChild(el);
    g.lassoEl=el; g.path=path;
  }
  if(g.moved){
    const last=g.pts[g.pts.length-1];
    if(!last || Math.abs(last[0]-cx)+Math.abs(last[1]-cy) > 0.4){ g.pts.push([cx,cy]); updateLassoPath(g,false); }
  }
}
function plopPointerUp(id,evt){
  if(_rswipe && _rswipe.id===id){ readSwipeEnd(); return; }
  if(!plopDrag || plopDrag.id!==id) return;
  const g=plopDrag; plopDrag=null;
  try{ if(g.pointerId!=null) document.getElementById(id+'-hero').releasePointerCapture(g.pointerId); }catch(e){}
  if(!g.moved){
    // TAP: commit whatever is selected (empty ones are discarded), then pin a new note here
    deselectAllMarks(id);
    if(markCapReached(id)){ toast('Up to '+MARK_CAP+' marks per photo'); refreshMarkCount(); return; }
    hideCoach();
    if(hasEmptyMark(id)){ toast('Finish the open note first'); return; }
    g.hero.classList.add('marks-on');
    const snapY = freeBandY(g.hero, g.sy, null);
    const el=plopMarkEl(g.sx, snapY, {editable:true, vis:'public', text:''});
    g.hero.appendChild(el); selectOnly(el);
    track('mark_added', {screen:id});
    refreshMarkCount();
    // no auto-focus: placing a pin shows only the toolbar; tap the field to zoom & type
    return;
  }
  // DRAG finished → region mark with an editable note pill
  const el=g.lassoEl, pts=g.pts;
  if(!el) return;
  if(pts.length<8){ el.remove(); return; }
  let minX=100,minY=100,maxX=0,maxY=0;
  pts.forEach(p=>{minX=Math.min(minX,p[0]);minY=Math.min(minY,p[1]);maxX=Math.max(maxX,p[0]);maxY=Math.max(maxY,p[1]);});

  batchLabel = 'Draft';
  if(n === 1){
    openEditor(batchQueue[0],'','');
    document.getElementById('rev-head-t').textContent = 'Draft';
    return;
  }
  document.getElementById('batch-count').textContent = n;
  openSheet('batch-intent');
}
function batchAddNow(){
  closeSheet('batch-intent');
  batchIndex = 0;
  openBatchItem();
}
function openBatchItem(){
  const img = batchQueue[batchIndex];
  _batchSuppressCoach = batchIndex > 0;   // teach once per batch, not once per photo
  openEditor(img,'','');
  const pr=document.getElementById('rev-prompt');
  if(pr) pr.style.display = (batchLabel==='Reflection') ? 'block' : 'none';
  document.getElementById('rev-head-t').textContent = `${batchLabel} ${batchIndex+1} of ${batchQueue.length}`;
}
function batchAllDrafts(){
  closeSheet('batch-intent');
  const n = batchQueue.length;
  batchQueue = [];
  go('scr-feed');
  setTimeout(()=>toast(`${n} photos saved as drafts. Find them in + → Drafts.`), 250);
}

}
function urlPasteDemo(){

  document.getElementById('url-prev').classList.add('on');
  document.getElementById('url-go').classList.add('ready');

function urlContinue(){

}

/* ritual */
const RIT=['chapelsteel','venice','redlamp'];let ritStep=0;
function startRitual(){
  batchQueue = RIT.slice();
  batchIndex = 0;
  batchLabel = 'Reflection';

/* search */
let searchMyCol=false;
let searchFocused=false;
function setSearchScope(scope){
  searchMyCol = (scope==='saved');
  document.getElementById('seg-all').classList.toggle('on', !searchMyCol);
  document.getElementById('seg-saved').classList.toggle('on', searchMyCol);
  fsRun();
}
function fsSetView(view){
  const def=document.getElementById('fs-default');
  const rec=document.getElementById('fs-recents');
  const sug=document.getElementById('fs-suggest');
  const res=document.getElementById('fs-results');
  const pills=document.getElementById('fs-pills');
  const cancel=document.getElementById('fs-cancel');
  const count=document.getElementById('fs-count-inline');
  const segRow=document.querySelector('#scr-search .mycol-row');
  def.style.display = view==='default' ? 'block' : 'none';
  rec.style.display = view==='recents' ? 'block' : 'none';
  sug.style.display = view==='typing' ? 'block' : 'none';
  res.style.display = (view==='typing'||view==='results') ? 'block' : 'none';
  pills.style.display = view==='default' ? 'flex' : 'none';
  cancel.style.display = view==='default' ? 'none' : 'inline-block';
  // Hide All/Saved segment on idle + recents; show only when typing/results
  if(segRow) segRow.style.display = (view==='typing'||view==='results') ? 'flex' : 'none';
  count.textContent = (view==='results'||view==='typing') && res.dataset.count ? `· ${res.dataset.count} results` : '';
}
function fsFocus(on){
  searchFocused = on;
  const v = (document.getElementById('fs-in').value||'').trim();
  if(on && !v){ renderRecents(); fsSetView('recents'); }
  else if(!on && !v){ fsSetView('default'); }
}
function fsCancel(){
  document.getElementById('fs-in').value='';
  document.getElementById('fs-in').blur();
  fsSetView('default');
}
function renderRecents(){
  document.getElementById('fs-recents-list').innerHTML = RECENTS.map(r=>`
    <div class="rec-item" onclick="fsPick('${r}')">
      <svg class="ric" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      <span>${r}</span>
      <span class="rx" onclick="event.stopPropagation();fsRemoveRecent('${r}')">×</span>
    </div>`).join('') || '<div style="color:var(--soft);font-size:14px;padding:12px 0">No recent searches</div>';
}
function fsRemoveRecent(w){
  const i = RECENTS.indexOf(w); if(i>=0) RECENTS.splice(i,1);
  renderRecents();
}
function fsClearRecents(){ RECENTS.length=0; renderRecents(); }
function fsPick(w){
  document.getElementById('fs-in').value=w;
  if(!RECENTS.includes(w)) RECENTS.unshift(w);
  fsRun(true);
}
function fsPill(el, name){
  document.querySelectorAll('#fs-pills .bpill').forEach(p=>p.classList.remove('on'));
  el.classList.add('on');
  // preview grid stays; in a real build the mosaic would filter by pill
  toast(`Browsing "${name}"`);
}
function fsRun(submit){
  const v=(document.getElementById('fs-in').value||'').trim().toLowerCase();
  const res=document.getElementById('fs-results');
  if(!v){ fsFocus(searchFocused); return; }
  const mycol=searchMyCol;
  let pool=mycol?FEED.filter(f=>f.kept||f.mine):FEED;
  const hits=pool.filter(f=>(f.t+' '+f.s).toLowerCase().includes(v));
  res.dataset.count = hits.length;
  document.getElementById('fs-grid').innerHTML=hits.map(h=>`
    <div class="res-cell" onclick="go('${h.mine?'scr-plop-mine':'scr-plop-others'}')">
      <img loading="lazy" decoding="async" src="${thumb(h.img)}"><span class="rl">${h.t}</span></div>`).join('');
  if(submit){
    if(!RECENTS.includes(v)) RECENTS.unshift(v);
    document.getElementById('fs-in').blur();
    fsSetView('results');
  } else {
    // typing state: show suggestions + live results
    const sugList = [v, v+' light', v+'s'].slice(0,3);
    document.getElementById('fs-suggest-list').innerHTML = sugList.map(s=>`
      <div class="sug-item" onclick="fsPick('${s}')">
        <svg class="ric" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <span>${s}</span>
      </div>`).join('');
    fsSetView('typing');
  }
}

/* waveform bars */
document.querySelectorAll('.wave i').forEach((b,i)=>b.style.height=(4+((i*7)%11))+'px');
document.querySelectorAll('.vn-wave i').forEach((b,i)=>b.style.height=(5+((i*5)%13))+'px');
let _ndEdit=null;
/* ---- long-press a note → its author's profile ---- */
let _lpTimer=null, _lpFired=false, _noteAuthorTarget=null;
function _lpStart(e){
  const el = e.target && e.target.closest ? e.target.closest('[data-author-target]') : null;
  if(!el) return;
  _lpFired = false;
  _lpTimer = setTimeout(()=>{ _lpTimer=null; _lpFired=true; openAuthorFromEl(el); }, 480);
}
function _lpCancel(){ if(_lpTimer){ clearTimeout(_lpTimer); _lpTimer=null; } }
document.addEventListener('pointerdown', _lpStart, true);
document.addEventListener('pointerup', _lpCancel, true);
document.addEventListener('pointermove', _lpCancel, true);
document.addEventListener('pointercancel', _lpCancel, true);
document.addEventListener('click', function(e){ if(_lpFired){ _lpFired=false; e.stopPropagation(); e.preventDefault(); } }, true);
function openAuthorFromEl(el){
  const name = el.getAttribute('data-author-name')||'';
  const handle = el.getAttribute('data-author-handle')||'';
  const target = el.getAttribute('data-author-target')||'scr-other-profile';
  const l = el.getAttribute('data-author-l')||'';
  const g = el.getAttribute('data-author-g')||'g5';
  if(!name && !handle) return;
  _noteAuthorTarget = target;
  // show the note/marker you pressed at the top of the sheet
  const note = el.getAttribute('data-author-note') || ((el.classList && el.classList.contains('nd-txt')) ? (el.textContent||'') : '');
  const noteEl = document.getElementById('nau-note');
  if(noteEl){ const t=(note||'').trim(); if(t){ noteEl.textContent = '“'+t+'”'; noteEl.style.display='block'; } else { noteEl.textContent=''; noteEl.style.display='none'; } }
  const avEl = document.getElementById('nau-av'); if(avEl){ avEl.textContent = l; avEl.className = 'av '+g; }
  const nm = document.getElementById('nau-nm'); if(nm) nm.textContent = name || ('@'+handle);
  const hd = document.getElementById('nau-hd'); if(hd) hd.textContent = handle ? ('@'+handle) : '';
  if(navigator.vibrate) navigator.vibrate(8);
  openSheet('note-author');
}
function noteAuthorGo(){ closeSheet('note-author'); if(_noteAuthorTarget) go(_noteAuthorTarget); }

/* live counter + enter-to-commit on the prompt sheet */
(function(){
  var inp=document.getElementById('ps-input'), area=document.getElementById('ps-area');
  [inp,area].forEach(function(el){
    if(!el) return;
    el.addEventListener('input', psCount);
    el.addEventListener('focus', function(){ document.getElementById('ps-field').classList.add('focus'); });
    el.addEventListener('blur',  function(){ document.getElementById('ps-field').classList.remove('focus'); });
  });
  if(inp) inp.addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); psCommit(); } });
})();
</script>
